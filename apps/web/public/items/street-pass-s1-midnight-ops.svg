<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Midnight Ops collection">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".65"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3e44"/><stop offset=".45" stop-color="#16181b"/><stop offset="1" stop-color="#08090a"/></linearGradient>
    <linearGradient id="gun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4f56"/><stop offset="1" stop-color="#121316"/></linearGradient>
  </defs>
  <g transform="rotate(-6 64 64)">
    <g filter="url(#s)"><rect x="26" y="16" width="76" height="96" rx="7" fill="url(#card)" stroke="#060708" stroke-width="1.6"/></g>
    <rect x="31" y="21" width="66" height="86" rx="4" fill="none" stroke="#4fd1a8" stroke-width="1.4" filter="url(#glow)"/>
    <!-- pistol in the collection finish, with optic -->
    <g transform="translate(32 18) scale(.48)" stroke="#000" stroke-width="2.6" stroke-linejoin="round">
      <path d="M32 58 H60 L51 103 Q50 107 45 107 H25 Q19 107 20 101 Z" fill="url(#gun)"/>
      <path d="M28 54 H104 V61 Q104 64 100 64 H30 Z" fill="#1c1e22"/>
      <path d="M24 38 H100 V55 H24 Q20 55 20 51 V42 Q20 38 24 38 Z" fill="url(#gun)"/>
      <path d="M98 39 H113 Q116 39 116 42 V52 Q116 55 113 55 H98 Z" fill="#1d1f23"/>
      <path d="M44 38 V31 Q44 28 47 28 H58 Q63 28 64 33 L66 38 Z" fill="#26292e"/>
    </g>
    <path d="M32 36 H80" stroke="#4fd1a8" stroke-opacity=".5" stroke-width="1"/>
    <!-- chevron emblem -->
    <g fill="none" stroke="#4fd1a8" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <path d="M52 92 L64 84 L76 92"/>
      <path d="M52 100 L64 92 L76 100" stroke-opacity=".6"/>
    </g>
    <path d="M32 24 H60" stroke="#8a929c" stroke-opacity=".4" stroke-width="1"/>
  </g>
</svg>
