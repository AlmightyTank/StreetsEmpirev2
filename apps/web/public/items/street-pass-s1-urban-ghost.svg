    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d3d7db"/><stop offset=".5" stop-color="#979ca2"/><stop offset="1" stop-color="#5c6168"/></linearGradient>
    <linearGradient id="gun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6c7178"/><stop offset="1" stop-color="#2b2e33"/></linearGradient>
    <clipPath id="cardclip"><rect x="26" y="16" width="76" height="96" rx="7"/></clipPath>
  </defs>
  <g transform="rotate(-6 64 64)">
