    <g clip-path="url(#cardclip)" opacity=".55">
      <path d="M22 14 L52 14 L46 34 L22 38 Z" fill="#c4c8cc"/>
      <path d="M80 12 L106 12 L106 36 L84 30 Z" fill="#3f4348"/>
      <path d="M22 92 L46 88 L50 116 L22 116 Z" fill="#3f4348"/>
      <path d="M74 96 L106 92 L106 116 L78 116 Z" fill="#c4c8cc"/>
    </g>
    <rect x="31" y="21" width="66" height="86" rx="4" fill="none" stroke="#f2f8fd" stroke-opacity=".7" stroke-width="1"/>
