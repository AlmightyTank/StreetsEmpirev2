<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".6"/></filter>
    <radialGradient id="halo"><stop offset="0" stop-color="#ffcf4a" stop-opacity=".55"/><stop offset="1" stop-color="#ffcf4a" stop-opacity="0"/></radialGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a323a"/><stop offset=".3" stop-color="#8a97a3"/><stop offset=".6" stop-color="#46525c"/><stop offset="1" stop-color="#171c21"/></linearGradient>
    <linearGradient id="br" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a0"/><stop offset=".45" stop-color="#d9a032"/><stop offset="1" stop-color="#6a4810"/></linearGradient>
    <linearGradient id="st" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5b6168"/><stop offset=".4" stop-color="#e8edf2"/><stop offset=".7" stop-color="#a7adb4"/><stop offset="1" stop-color="#4b5058"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6b0"/><stop offset=".5" stop-color="#ffc83a"/><stop offset="1" stop-color="#e07a10"/></linearGradient>
  </defs>
  <ellipse cx="64" cy="68" rx="58" ry="52" fill="url(#halo)"/>
  <g filter="url(#s)" stroke="#0e1115" stroke-width="1.6" stroke-linejoin="round">
    <path d="M50 12 H58 V24 H50 Z M70 12 H78 V24 H70 Z" fill="url(#br)" stroke="#3e2a06"/>
    <path d="M44 22 H84 Q87 22 87 25 V32 H41 V25 Q41 22 44 22 Z" fill="url(#st)"/>
    <path d="M36 40 Q36 32 44 32 H84 Q92 32 92 40 V104 Q92 112 84 112 H44 Q36 112 36 104 Z" fill="url(#shell)"/>
  </g>
  <!-- gold bands -->
  <g stroke="#3e2a06" stroke-width="1.2">
    <path d="M36 40 H92 V46 H36 Z" fill="url(#br)"/>
    <path d="M36 100 H92 V106 H36 Z" fill="url(#br)"/>
  </g>
  <!-- glowing window -->
  <rect x="46" y="52" width="36" height="42" rx="5" fill="#0c0f12" stroke="#050607" stroke-width="1.6"/>
  <rect x="49" y="55" width="30" height="36" rx="3" fill="url(#glow)"/>
  <path d="M69 57 L54 76 H63 L58 90 L76 69 H66 L72 57 Z" fill="#3a2604" stroke="#5a3a08" stroke-width="1" stroke-linejoin="round"/>
  <path d="M49.5 56 H78" stroke="#fff" stroke-opacity=".7" stroke-width="1.4" stroke-linecap="round"/>
  <!-- highlights -->
  <g fill="none" stroke-linecap="round">
    <path d="M39 50 V98" stroke="#fff" stroke-opacity=".35" stroke-width="2.2"/>
    <path d="M46 25 H80" stroke="#fff" stroke-opacity=".7" stroke-width="1.3"/>
    <path d="M52 15 V22" stroke="#fff6c8" stroke-opacity=".8" stroke-width="1.4"/>
    <path d="M72 15 V22" stroke="#fff6c8" stroke-opacity=".8" stroke-width="1.4"/>
  </g>
  <!-- sparkle -->
  <path d="M104 24 L106.4 31.6 L114 34 L106.4 36.4 L104 44 L101.6 36.4 L94 34 L101.6 31.6 Z" fill="#fff3b8" stroke="#c8962e" stroke-width="1" stroke-linejoin="round"/>
