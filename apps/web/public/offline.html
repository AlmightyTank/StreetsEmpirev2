<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c0e" />
    <meta name="robots" content="noindex" />
    <title>Offline - StreetsEmpire</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
        background: #0b0c0e; color: #dbe0e7;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 26rem; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      .eyebrow { margin: 16px 0 4px; font-size: 0.75rem; letter-spacing: 0.18em; text-transform: uppercase; color: #98a1ad; }
      h1 { margin: 0 0 8px; font-size: 1.4rem; }
      p { margin: 0 0 12px; color: #b8bfcc; }
      button {
        min-height: 48px; min-width: 160px; margin-top: 8px; padding: 0 20px;
        border: 1px solid #b6ff3a; border-radius: 6px; background: #b6ff3a; color: #0b0c0e;
        font: 700 0.95rem/1 system-ui, sans-serif; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer;
      }
      button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <p class="eyebrow">StreetsEmpire</p>
      <h1>You're offline</h1>
      <p>Every move in StreetsEmpire happens on the game server, so there is nothing to play without a connection. Nothing is lost: your crew, cash and turns are where you left them.</p>
      <p>This page reloads by itself when the connection comes back.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      window.addEventListener('online', () => location.reload());
    </script>
  </body>
</html>
