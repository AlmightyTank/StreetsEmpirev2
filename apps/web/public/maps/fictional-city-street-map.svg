<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 700" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">Fictional city street and terrain map</title>
  <desc id="map-desc">A dense coastal city with irregular streets, a winding river, bridges, parks, rail yards, docks, and five connected turf districts.</desc>
  <defs>
    <path id="city-shape" d="M112 58H746L822 112V262L844 536L786 642H122L48 576V140Z"/>
    <clipPath id="city-footprint"><use href="#city-shape"/></clipPath>
    <linearGradient id="water-glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#162d33"/><stop offset=".55" stop-color="#10262d"/><stop offset="1" stop-color="#0b1c23"/></linearGradient>
    <linearGradient id="land-glow" x1=".1" y1="0" x2=".9" y2="1"><stop offset="0" stop-color="#303c35"/><stop offset="1" stop-color="#1e2926"/></linearGradient>
    <pattern id="water-lines" width="42" height="30" patternUnits="userSpaceOnUse"><path d="M-8 8C2 2 13 2 23 8S44 14 54 8M-8 22c10-6 21-6 31 0s21 6 31 0" fill="none" stroke="#6b9ca2" stroke-opacity=".13" stroke-width="1"/></pattern>
    <pattern id="street-grain" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".55" fill="#cbd0bf" opacity=".09"/><circle cx="9" cy="8" r=".4" fill="#cbd0bf" opacity=".06"/></pattern>
    <pattern id="dense-blocks" width="70" height="58" patternUnits="userSpaceOnUse">
      <rect x="5" y="5" width="25" height="18" rx="2" fill="#455047" stroke="#aeb7a4" stroke-opacity=".16"/><rect x="36" y="5" width="28" height="18" rx="1" fill="#39463f" stroke="#aeb7a4" stroke-opacity=".14"/>
      <rect x="5" y="29" width="19" height="23" rx="1" fill="#3a4740" stroke="#aeb7a4" stroke-opacity=".13"/><rect x="30" y="29" width="34" height="23" rx="2" fill="#465148" stroke="#aeb7a4" stroke-opacity=".15"/>
    </pattern>
    <pattern id="warehouse-blocks" width="96" height="74" patternUnits="userSpaceOnUse">
      <rect x="7" y="8" width="56" height="25" rx="2" fill="#3b4741" stroke="#aeb7a4" stroke-opacity=".14"/><rect x="68" y="8" width="20" height="25" rx="1" fill="#465148" stroke="#aeb7a4" stroke-opacity=".12"/>
      <rect x="7" y="41" width="34" height="25" rx="1" fill="#465148" stroke="#aeb7a4" stroke-opacity=".13"/><rect x="46" y="41" width="42" height="25" rx="2" fill="#35413c" stroke="#aeb7a4" stroke-opacity=".14"/>
    </pattern>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#05090b" flood-opacity=".65"/></filter>
  </defs>

  <!-- Water surrounds the city so the silhouette reads as a coastal place. -->
  <rect width="880" height="700" fill="url(#water-glow)"/><rect width="880" height="700" fill="url(#water-lines)"/>
  <g fill="none" stroke="#78a4a7" stroke-opacity=".12">
    <path d="M16 88C92 67 142 75 207 45M688 28c71 22 120 57 171 114M12 632c70 22 128 24 196 6M744 668c50-20 87-50 118-101"/>
    <path d="M9 104c78-20 133-11 206-43M674 14c81 28 138 68 190 132M7 651c74 17 134 17 202 1M735 686c58-22 99-58 129-112"/>
  </g>

  <!-- Landmass and district texture. -->
  <use href="#city-shape" fill="url(#land-glow)" stroke="#d5d7c9" stroke-opacity=".58" stroke-width="3" filter="url(#soft-shadow)"/>
  <g clip-path="url(#city-footprint)">
    <rect width="880" height="700" fill="url(#street-grain)"/>
    <path d="M35 44H449V320H35Z" fill="#37443c" opacity=".35"/><path d="M430 42H842V278H430Z" fill="#343e3b" opacity=".42"/>
    <path d="M34 298H455V662H34Z" fill="#2c3933" opacity=".48"/><path d="M425 438H665V660H425Z" fill="#364039" opacity=".52"/><path d="M425 248H860V660H425Z" fill="#273633" opacity=".42"/>

    <!-- Irregular building fabrics: dense uptown, broad industrial blocks south. -->
    <path d="M61 74H422V290H61Z" fill="url(#dense-blocks)" opacity=".9"/><path d="M451 73H805V244H451Z" fill="url(#dense-blocks)" opacity=".94"/>
    <path d="M61 329H421V623H61Z" fill="url(#warehouse-blocks)" opacity=".91"/><path d="M454 278H824V438H454Z" fill="url(#dense-blocks)" opacity=".86"/><path d="M454 470H805V626H454Z" fill="url(#warehouse-blocks)" opacity=".92"/>

    <!-- Local street network bends around the river and open land. -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#0c1517" stroke-width="7">
        <path d="M82 96L420 96M72 150L402 150M58 207L420 207M58 270L420 270M68 365L420 365M63 421L420 421M62 486L418 486M72 552L425 552M104 610L424 610"/>
        <path d="M101 64L102 294M166 62L162 294M238 62L246 296M316 60L307 298M382 60L386 300"/>
        <path d="M101 324L110 620M184 320L176 628M264 320L273 630M346 316L340 636M404 316L412 640"/>
        <path d="M456 103L785 103M452 158L806 158M450 216L817 216M454 300L826 300M458 370L832 370M454 425L836 425M458 493L830 493M460 555L819 555M466 610L793 610"/>
        <path d="M476 62L474 244M549 60L548 245M627 60L632 246M708 62L702 250M779 84L772 255"/>
        <path d="M480 267L475 438M551 260L559 441M638 260L629 443M719 260L726 446M795 262L786 454"/>
        <path d="M482 462L477 642M564 458L570 642M651 456L645 641M735 458L743 640"/>
      </g>
      <g stroke="#78837a" stroke-opacity=".62" stroke-width="1.35">
        <path d="M82 96L420 96M72 150L402 150M58 207L420 207M58 270L420 270M68 365L420 365M63 421L420 421M62 486L418 486M72 552L425 552M104 610L424 610"/>
        <path d="M101 64L102 294M166 62L162 294M238 62L246 296M316 60L307 298M382 60L386 300"/>
        <path d="M101 324L110 620M184 320L176 628M264 320L273 630M346 316L340 636M404 316L412 640"/>
        <path d="M456 103L785 103M452 158L806 158M450 216L817 216M454 300L826 300M458 370L832 370M454 425L836 425M458 493L830 493M460 555L819 555M466 610L793 610"/>
        <path d="M476 62L474 244M549 60L548 245M627 60L632 246M708 62L702 250M779 84L772 255"/>
        <path d="M480 267L475 438M551 260L559 441M638 260L629 443M719 260L726 446M795 262L786 454"/>
        <path d="M482 462L477 642M564 458L570 642M651 456L645 641M735 458L743 640"/>
      </g>
    </g>

    <!-- Parks and civic greenways interrupt the street grid. -->
    <g filter="url(#soft-shadow)">
      <path d="M116 112C145 91 205 88 247 103L260 169C234 194 158 197 121 178Z" fill="#284c38" stroke="#95b08d" stroke-opacity=".6" stroke-width="2"/>
      <path d="M130 155c32-28 71-37 114-26M154 101c8 29 26 60 54 85" fill="none" stroke="#9eb69a" stroke-opacity=".38" stroke-width="3"/>
      <circle cx="155" cy="137" r="8" fill="#1d3c2d"/><circle cx="202" cy="116" r="10" fill="#1d3c2d"/><circle cx="225" cy="163" r="8" fill="#1d3c2d"/>
      <path d="M400 276C433 256 477 255 509 278L507 348C477 369 431 366 400 345Z" fill="#2c513b" stroke="#9bb493" stroke-opacity=".58" stroke-width="2"/>
      <path d="M414 334c22-36 48-53 82-52M417 292c24 17 43 36 65 63" fill="none" stroke="#a5baa0" stroke-opacity=".36" stroke-width="3"/>
      <path d="M181 451L294 448L315 523L279 556L188 543L158 493Z" fill="#2a4b38" stroke="#98ad8f" stroke-opacity=".54" stroke-width="2"/>
      <path d="M177 493c34-17 79-22 124-13M210 459c11 38 29 68 58 91" fill="none" stroke="#a6b99d" stroke-opacity=".34" stroke-width="3"/>
    </g>

    <!-- Landmark-scale buildings make each side of town distinct. -->
    <g stroke="#b5bdad" stroke-opacity=".35">
      <path d="M282 111h91v72h-91z" fill="#4b5650"/><path d="M292 121h71v52h-71z" fill="#303c38"/>
      <path d="M604 91h78v91h-78z" fill="#4b5650"/><path d="M619 77h48v119h-48z" fill="#35423f"/>
      <path d="M696 112h59v79h-59z" fill="#45514b"/><path d="M709 95h34v113h-34z" fill="#303c39"/>
      <path d="M99 387h58v43H99zM297 386h89v44h-89z" fill="#455048"/>
      <path d="M101 570h118v48H101zM291 569h94v48h-94z" fill="#404b45"/>
      <path d="M682 490h82v48h-82zM682 557h106v39H682z" fill="#3b4844"/>
    </g>

    <!-- Main boulevards with dark casing and dashed lane detail. -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M440 53V648M48 310H438M442 262H826M442 455H657M54 238C228 230 329 245 438 238M443 505C572 494 696 512 823 503" stroke="#091214" stroke-width="19"/>
      <path d="M440 53V648M48 310H438M442 262H826M442 455H657M54 238C228 230 329 245 438 238M443 505C572 494 696 512 823 503" stroke="#8b9186" stroke-opacity=".84" stroke-width="9"/>
      <path d="M440 53V648M48 310H438M442 262H826M442 455H657M54 238C228 230 329 245 438 238M443 505C572 494 696 512 823 503" stroke="#303936" stroke-width="2" stroke-dasharray="11 8"/>
      <path d="M69 576C172 523 272 468 354 393S485 230 548 91" stroke="#0a1315" stroke-width="14"/><path d="M69 576C172 523 272 468 354 393S485 230 548 91" stroke="#7f877e" stroke-opacity=".8" stroke-width="6"/>
    </g>

    <!-- Rail yard and elevated tracks. -->
    <g fill="none" stroke-linecap="round">
      <path d="M58 590C166 566 274 576 421 542M57 606C164 582 279 591 424 557M64 622C172 599 288 604 427 573" stroke="#101719" stroke-width="6"/>
      <path d="M58 590C166 566 274 576 421 542M57 606C164 582 279 591 424 557M64 622C172 599 288 604 427 573" stroke="#8d8c7d" stroke-opacity=".65" stroke-width="2" stroke-dasharray="3 6"/>
      <path d="M77 584L89 623M122 577l12 39M169 574l11 39M216 575l10 37M263 578l9 32M311 577l7 24M358 564l7 24M400 551l8 27" stroke="#aaa895" stroke-opacity=".35" stroke-width="2"/>
    </g>

    <!-- The East Branch is wide enough to shape neighborhoods, not just decorate them. -->
    <path d="M570 46C542 115 548 168 565 220C579 262 557 302 570 346C583 389 620 413 621 457C622 506 602 544 628 584C647 613 676 636 704 660" fill="none" stroke="#08171c" stroke-opacity=".75" stroke-width="78"/>
    <path d="M570 46C542 115 548 168 565 220C579 262 557 302 570 346C583 389 620 413 621 457C622 506 602 544 628 584C647 613 676 636 704 660" fill="none" stroke="#17343c" stroke-width="67"/>
    <path d="M570 46C542 115 548 168 565 220C579 262 557 302 570 346C583 389 620 413 621 457C622 506 602 544 628 584C647 613 676 636 704 660" fill="none" stroke="url(#water-lines)" stroke-width="62"/>
    <path d="M543 47C518 117 526 173 539 222C551 266 531 300 544 352M597 47c-25 69-18 117-5 169 11 45-10 91 4 126" fill="none" stroke="#78a2a2" stroke-opacity=".22" stroke-width="2"/>

    <!-- Four named crossings stitch the street plan back together. -->
    <g fill="none" stroke-linecap="round">
      <path d="M501 150H613M504 238H626M511 369H649M563 505H684" stroke="#091214" stroke-width="22"/>
      <path d="M501 150H613M504 238H626M511 369H649M563 505H684" stroke="#9b9b8b" stroke-width="11"/>
      <path d="M501 150H613M504 238H626M511 369H649M563 505H684" stroke="#343d39" stroke-width="3" stroke-dasharray="10 7"/>
      <path d="M510 140v20m94-20v20M514 228v20m102-20v20M521 359v20m118-20v20M573 495v20m101-20v20" stroke="#d3d1bb" stroke-opacity=".42" stroke-width="2"/>
    </g>

    <!-- Working waterfront: bulkheads, piers, slips, and container rows. -->
    <path d="M815 278C801 333 826 396 819 454C813 505 824 549 788 622" fill="none" stroke="#9ba49b" stroke-opacity=".55" stroke-width="5"/>
    <g fill="#43504b" stroke="#aab3a5" stroke-opacity=".38"><path d="M785 305h67v18h-67zM792 343h63v17h-63zM796 384h61v18h-61zM790 430h69v18h-69zM786 476h66v17h-66zM780 521h67v18h-67z"/></g>
    <g fill="#758078" opacity=".42"><path d="M706 334h21v8h-21zM732 334h28v8h-28zM706 348h32v8h-32zM743 348h19v8h-19z"/><path d="M702 397h27v8h-27zM734 397h30v8h-30zM702 411h19v8h-19zM726 411h38v8h-38z"/></g>
  </g>

  <!-- Shoreline accents and cartographic labels. -->
  <use href="#city-shape" fill="none" stroke="#e2e2d2" stroke-opacity=".35" stroke-width="1.3"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#d9ddcf" letter-spacing="1.8">
    <text x="146" y="143" font-size="11" opacity=".76">NORTH COMMONS</text><text x="421" y="319" font-size="10" opacity=".75">RIVER PARK</text>
    <text x="193" y="505" font-size="10" opacity=".72">CIVIC GREEN</text><text x="94" y="600" font-size="10" opacity=".7">FREIGHT YARD</text>
    <text x="742" y="465" font-size="10" opacity=".7" transform="rotate(88 742 465)">EASTERN DOCKS</text><text x="603" y="326" font-size="11" opacity=".74" transform="rotate(83 603 326)">EAST BRANCH</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#d2d5c8" font-size="8" letter-spacing="1" opacity=".58">
    <text x="524" y="139">NORTH BRIDGE</text><text x="530" y="227">CANAL BRIDGE</text><text x="544" y="358">UNION CROSSING</text><text x="591" y="493">DOCK BRIDGE</text>
    <text x="290" y="225">CENTRAL AVE</text><text x="290" y="298">MARKET BLVD</text><text x="294" y="444">FOUNDRY AVE</text>
  </g>
  <g fill="#b6c0b3" opacity=".62"><circle cx="42" cy="124" r="2"/><circle cx="834" cy="266" r="2"/><circle cx="852" cy="540" r="2"/><circle cx="789" cy="650" r="2"/></g>
</svg>
