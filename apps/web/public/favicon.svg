<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="StreetsEmpire">
  <!--
    The app's gold tile, carrying one letter instead of the two it wears in the nav.
    A tab is read at sixteen pixels, where the crossbars of an E close up and "SE" turns to mush;
    a single S survives it. The nav keeps both letters, because there it has the room.

    Drawn on an opaque tile rather than as a bare letter, since a favicon sits on browser chrome we
    do not control, and a gold glyph on nothing disappears against a light tab strip.
  -->
  <rect width="64" height="64" rx="12" fill="#d9ae62" />
  <text
    x="32"
    y="33.5"
    fill="#0e1111"
    font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="46"
    font-weight="900"
    text-anchor="middle"
    dominant-baseline="central">S</text>
</svg>
