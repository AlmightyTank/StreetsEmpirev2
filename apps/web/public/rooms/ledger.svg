    <radialGradient id="lamp" cx=".5" cy=".86" r=".55"><stop offset="0" stop-color="#ffe9a0" stop-opacity=".45"/><stop offset=".5" stop-color="#d8b860" stop-opacity=".12"/><stop offset="1" stop-color="#d8b860" stop-opacity="0"/></radialGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2c18"/><stop offset="1" stop-color="#22140a"/></linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e7a4a"/><stop offset="1" stop-color="#14402a"/></linearGradient>
  </defs>
  <rect width="1200" height="480" fill="url(#wall)"/>
