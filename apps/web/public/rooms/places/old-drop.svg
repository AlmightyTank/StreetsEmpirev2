<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480">
  <!-- Vic's old drop in Urban Ghetto: an alley behind a laundromat, a dumpster, a notice taped to the door. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e0a14"/><stop offset="1" stop-color="#1e1222"/></linearGradient>
    <pattern id="brick" width="60" height="30" patternUnits="userSpaceOnUse"><rect width="60" height="30" fill="#2e1e24"/><path d="M0 29h60M30 0v15M0 15h60M60 15v15M0 15v15" stroke="#1a1014" stroke-width="3"/></pattern>
    <radialGradient id="cage" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#e0b0e0" stop-opacity=".4"/><stop offset="1" stop-color="#c878c8" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="480" fill="url(#sky)"/>
  <rect x="0" y="0" width="460" height="420" fill="url(#brick)"/><rect x="740" y="0" width="460" height="420" fill="url(#brick)"/>
  <!-- Fire escape, left -->
  <g stroke="#120c10" stroke-width="5" fill="none"><path d="M60 80h300M60 80v40M360 80v40M60 120h300M100 80l220 40M60 220h300M60 220v40M360 220v40M60 260h300M320 120l-220 100"/></g>
  <!-- Back door with a taped notice, right -->
  <rect x="860" y="190" width="140" height="230" fill="#3a2a30" stroke="#1a1014" stroke-width="8"/>
  <rect x="900" y="250" width="60" height="78" fill="#ece4d0"/><g stroke="#3a3428" stroke-opacity=".6" stroke-width="2"><path d="M908 266h44M908 278h40M908 290h44M908 302h30"/></g>
  <path d="M896 248l14-4M950 244l14 6" stroke="#d8d0a0" stroke-opacity=".8" stroke-width="5"/>
  <ellipse cx="930" cy="170" rx="90" ry="70" fill="url(#cage)"/><rect x="918" y="160" width="24" height="16" fill="#e8d8f0"/>
  <!-- Dumpster -->
  <path d="M1040 330h140v90h-140z" fill="#2a4a3a"/><path d="M1032 322h156l-8 14h-140z" fill="#1e3a2c"/>
  <!-- Laundromat vent glow, centre-back -->
  <rect x="460" y="120" width="280" height="300" fill="#140e16"/>
  <g fill="#ffcf6a" fill-opacity=".2"><rect x="520" y="200" width="20" height="30"/><rect x="660" y="160" width="20" height="30"/></g>
  <!-- Puddles and ground -->
  <rect y="420" width="1200" height="60" fill="#1c181c"/><rect y="416" width="1200" height="6" fill="#3a3238"/>
  <ellipse cx="330" cy="448" rx="110" ry="9" fill="#c878c8" fill-opacity=".12"/><ellipse cx="880" cy="456" rx="70" ry="6" fill="#c878c8" fill-opacity=".1"/>
</svg>
