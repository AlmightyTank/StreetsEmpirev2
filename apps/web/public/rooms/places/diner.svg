<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480">
  <!-- An all-night diner: a window on the empty avenue, a counter with stools, a pie case, three papers on the table. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1e1a"/><stop offset="1" stop-color="#1a120e"/></linearGradient>
    <radialGradient id="lamp" cx=".5" cy=".05" r=".55"><stop offset="0" stop-color="#fff0d0" stop-opacity=".42"/><stop offset="1" stop-color="#e0b080" stop-opacity="0"/></radialGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#1a1a2a"/></linearGradient>
    <pattern id="check" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#e8e0d0"/><rect width="20" height="20" fill="#1a1a1a"/><rect x="20" y="20" width="20" height="20" fill="#1a1a1a"/></pattern>
  </defs>
  <rect width="1200" height="480" fill="url(#wall)"/>
  <rect y="300" width="1200" height="120" fill="url(#check)" opacity=".25"/>
  <!-- Big window on the avenue, left, with reversed lettering -->
  <rect x="30" y="50" width="380" height="240" fill="url(#night)" stroke="#8a8a90" stroke-width="10"/>
  <g fill="#ffcf6a" fill-opacity=".35"><circle cx="90" cy="230" r="4"/><circle cx="200" cy="220" r="3"/><circle cx="330" cy="236" r="5"/></g>
  <text x="220" y="110" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#ff7a7a" fill-opacity=".55" transform="scale(-1 1) translate(-440 0)">OPEN 24 HRS</text>
  <!-- Pie case and coffee machine, right -->
  <rect x="860" y="190" width="160" height="110" rx="8" fill="#e8f4ff" fill-opacity=".18" stroke="#c8d0d8" stroke-width="4"/>
  <g fill="#e8b860"><path d="M880 250h50l-25-20z"/><path d="M940 250h50l-25-20z"/></g><path d="M870 260h140" stroke="#c8d0d8" stroke-width="3"/>
  <rect x="1050" y="170" width="100" height="130" fill="#8a8a90"/><rect x="1066" y="240" width="30" height="40" fill="#2a1a12"/><rect x="1106" y="240" width="30" height="40" fill="#2a1a12"/>
  <!-- Stools along a counter edge -->
  <rect x="440" y="300" width="380" height="18" fill="#c8c8c0"/>
  <g fill="#c83a3a"><ellipse cx="500" cy="340" rx="30" ry="9"/><ellipse cx="600" cy="340" rx="30" ry="9"/><ellipse cx="700" cy="340" rx="30" ry="9"/></g>
  <g fill="#8a8a90"><rect x="496" y="346" width="8" height="74"/><rect x="596" y="346" width="8" height="74"/><rect x="696" y="346" width="8" height="74"/></g>
  <!-- Pendant lamp -->
  <path d="M600 0v40" stroke="#120a06" stroke-width="3"/><path d="M570 40h60l-10 18h-40z" fill="#c83a3a"/>
  <rect width="1200" height="480" fill="url(#lamp)"/>
  <!-- Formica table: coffee and three papers -->
  <rect y="420" width="1200" height="60" fill="#c8b890"/><rect y="416" width="1200" height="6" fill="#a8a8a0"/>
  <g fill="#f4ecdc" stroke="#8a7a5a" stroke-width="1.5"><path d="M380 432l70-14 10 12-70 14z"/><path d="M520 432l80-6 4 14-80 6z"/><path d="M670 424l70 10-4 14-70-10z"/></g>
  <path d="M860 420c0-14 12-20 24-20s24 6 24 20z" fill="#f4f0e8"/><ellipse cx="884" cy="404" rx="18" ry="4" fill="#3a2010"/>
</svg>
