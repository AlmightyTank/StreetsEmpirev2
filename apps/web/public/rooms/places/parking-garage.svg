<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480">
  <!-- A parking garage, level three: concrete pillars, flickering tubes, one car with its lights off, an exit sign. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22222a"/><stop offset="1" stop-color="#14141a"/></linearGradient>
    <radialGradient id="tube" cx=".5" cy=".05" r=".6"><stop offset="0" stop-color="#e8e0ff" stop-opacity=".38"/><stop offset="1" stop-color="#b090d0" stop-opacity="0"/></radialGradient>
    <radialGradient id="exit" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5aff8a" stop-opacity=".35"/><stop offset="1" stop-color="#5aff8a" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="480" fill="url(#wall)"/>
  <!-- Ceiling beams receding -->
  <g fill="#1a1a20"><rect y="0" width="1200" height="30"/><path d="M0 30h1200l-80 30H80z"/></g>
  <g stroke="#2e2e36" stroke-width="3"><path d="M0 120h1200M0 200h1200"/></g>
  <!-- Pillars -->
  <g fill="#3a3a42"><rect x="120" y="30" width="70" height="390"/><rect x="1010" y="30" width="70" height="390"/><rect x="420" y="60" width="40" height="300"/><rect x="740" y="60" width="40" height="300"/></g>
  <g fill="#e8c840" fill-opacity=".7"><rect x="120" y="330" width="70" height="14"/><rect x="1010" y="330" width="70" height="14"/></g>
  <text x="155" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="44" fill="#e8e8f0" fill-opacity=".55">3C</text>
  <!-- A dark sedan, right of centre -->
  <path d="M800 400c8-40 30-56 90-60h90c30 0 50 24 80 32v28H800z" fill="#1a1a22"/><path d="M850 340l24-30h110l30 30z" fill="#0c0c10"/>
  <g fill="#060608"><circle cx="850" cy="404" r="22"/><circle cx="1010" cy="404" r="22"/></g>
  <!-- Exit sign, left -->
  <ellipse cx="300" cy="90" rx="110" ry="60" fill="url(#exit)"/><rect x="250" y="72" width="100" height="36" rx="4" fill="#0a1a0e"/>
  <text x="300" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="#5aff8a">EXIT</text>
  <!-- Tubes -->
  <rect x="520" y="44" width="160" height="6" rx="3" fill="#f0eaff"/><rect x="200" y="56" width="120" height="5" rx="3" fill="#f0eaff" fill-opacity=".4"/>
  <rect width="1200" height="480" fill="url(#tube)"/>
  <!-- Concrete floor with bay lines -->
  <rect y="420" width="1200" height="60" fill="#2a2a30"/><rect y="416" width="1200" height="6" fill="#4a4a52"/>
  <g fill="#e8e8e8" fill-opacity=".35"><rect x="380" y="430" width="8" height="50"/><rect x="820" y="430" width="8" height="50"/></g>
  <ellipse cx="600" cy="452" rx="90" ry="6" fill="#3a3a6a" fill-opacity=".3"/>
</svg>
