<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480">
  <!-- The bus depot: sodium lights over the bays, a parked coach, the departures board, a dispatch window. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1610"/><stop offset="1" stop-color="#0e0c08"/></linearGradient>
    <radialGradient id="sodium" cx=".5" cy=".1" r=".6"><stop offset="0" stop-color="#ffb860" stop-opacity=".42"/><stop offset=".5" stop-color="#e09040" stop-opacity=".12"/><stop offset="1" stop-color="#e09040" stop-opacity="0"/></radialGradient>
    <linearGradient id="bus" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8c8c0"/><stop offset="1" stop-color="#7a7a72"/></linearGradient>
  </defs>
  <rect width="1200" height="480" fill="url(#wall)"/>
  <!-- Roof trusses -->
  <g stroke="#2a241a" stroke-width="6"><path d="M0 40h1200M0 40l150 60 150-60 150 60 150-60 150 60 150-60 150 60 150-60M0 100h1200"/></g>
  <!-- Coach in the bay, left -->
  <rect x="20" y="190" width="420" height="190" rx="20" fill="url(#bus)"/><rect x="20" y="300" width="420" height="16" fill="#2a5a8a"/>
  <g fill="#1a2028"><rect x="50" y="210" width="80" height="70" rx="6"/><rect x="140" y="210" width="80" height="70" rx="6"/><rect x="230" y="210" width="80" height="70" rx="6"/><rect x="320" y="210" width="90" height="70" rx="6"/></g>
  <g fill="#0e0e0e"><circle cx="110" cy="384" r="30"/><circle cx="350" cy="384" r="30"/></g><g fill="#5a5a5a"><circle cx="110" cy="384" r="12"/><circle cx="350" cy="384" r="12"/></g>
  <rect x="330" y="196" width="80" height="12" fill="#ffb860" fill-opacity=".85"/>
  <!-- Departures board -->
  <rect x="820" y="120" width="320" height="140" fill="#0a0a08" stroke="#3a3428" stroke-width="6"/>
  <g font-family="Courier New, monospace" font-weight="700" font-size="17" fill="#ffb040"><text x="836" y="150">NO.7  NORTH RD   21:40</text><text x="836" y="178">NO.9  CLEVELAND  22:15</text><text x="836" y="206">NO.4  TOLEDO     23:05</text><text x="836" y="234">NO.2  FLINT   CANCELLED</text></g>
  <!-- Dispatch window -->
  <rect x="860" y="300" width="160" height="110" fill="#2a241a" stroke="#3a3428" stroke-width="6"/><rect x="876" y="314" width="128" height="60" fill="#ffd890" fill-opacity=".25"/>
  <text x="940" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#c8b890" letter-spacing="3">DISPATCH</text>
  <!-- Sodium lamps -->
  <g><path d="M450 100v20M750 100v20" stroke="#2a241a" stroke-width="3"/><path d="M430 120h40l-8 14h-24zM730 120h40l-8 14h-24z" fill="#3a3428"/><rect x="440" y="132" width="20" height="4" fill="#ffd090"/><rect x="740" y="132" width="20" height="4" fill="#ffd090"/></g>
  <rect width="1200" height="480" fill="url(#sodium)"/>
  <!-- Platform edge with painted bay line -->
  <rect y="420" width="1200" height="60" fill="#2a2a26"/><rect y="416" width="1200" height="6" fill="#e8c840" fill-opacity=".8"/>
  <text x="560" y="458" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="#e8c840" fill-opacity=".4" letter-spacing="6">BAY 9</text>
</svg>
