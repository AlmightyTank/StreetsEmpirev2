<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480">
  <!-- Pip's supplier's warehouse: pallet racks, a hanging lamp, the big back scale, one crate with no label. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#18201a"/><stop offset="1" stop-color="#0c120e"/></linearGradient>
    <radialGradient id="lamp" cx=".5" cy=".08" r=".55"><stop offset="0" stop-color="#e8ffe8" stop-opacity=".38"/><stop offset=".5" stop-color="#80c890" stop-opacity=".1"/><stop offset="1" stop-color="#80c890" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="480" fill="url(#wall)"/>
  <!-- Pallet racks, left -->
  <g fill="#c86a2a"><rect x="30" y="40" width="10" height="380"/><rect x="390" y="40" width="10" height="380"/><rect x="30" y="160" width="370" height="10"/><rect x="30" y="290" width="370" height="10"/></g>
  <g stroke="#3a2a14" stroke-width="3">
    <rect x="50" y="90" width="100" height="70" fill="#8a6a3a"/><rect x="160" y="100" width="90" height="60" fill="#7a5c30"/><rect x="270" y="80" width="110" height="80" fill="#8a6a3a"/>
    <rect x="50" y="210" width="120" height="80" fill="#7a5c30"/><rect x="180" y="230" width="90" height="60" fill="#8a6a3a"/><rect x="290" y="220" width="90" height="70" fill="#7a5c30"/>
  </g>
  <g fill="#e8e0c8" fill-opacity=".7"><rect x="70" y="110" width="40" height="14"/><rect x="290" y="100" width="40" height="14"/><rect x="70" y="230" width="40" height="14"/><rect x="200" y="246" width="40" height="14"/></g>
  <!-- The back scale, right: platform and dial -->
  <rect x="880" y="120" width="12" height="230" fill="#4a524c"/>
  <circle cx="886" cy="140" r="56" fill="#e8e8dc" stroke="#2a302c" stroke-width="8"/>
  <g stroke="#2a302c" stroke-width="2"><path d="M886 92v10M886 178v10M838 140h10M924 140h10M852 106l7 7M920 106l-7 7"/></g>
  <path d="M886 140l26-22" stroke="#a83a2a" stroke-width="4" stroke-linecap="round"/><circle cx="886" cy="140" r="5" fill="#2a302c"/>
  <path d="M820 350h220v30H820z" fill="#5a625c"/><path d="M810 344h240v10H810z" fill="#7a827c"/>
  <!-- Crate with no label -->
  <rect x="1060" y="290" width="120" height="120" fill="#6a5432" stroke="#3a2a14" stroke-width="4"/><path d="M1060 290l120 120M1180 290l-120 120" stroke="#3a2a14" stroke-width="4"/>
  <!-- Hanging lamp -->
  <path d="M600 0v40" stroke="#0a0e0c" stroke-width="3"/><path d="M566 40h68l-10 22h-48z" fill="#2a4a32"/><rect x="584" y="60" width="32" height="5" fill="#f0fff0"/>
  <rect width="1200" height="480" fill="url(#lamp)"/>
  <!-- Concrete floor, painted line -->
  <rect y="420" width="1200" height="60" fill="#262a26"/><rect y="416" width="1200" height="6" fill="#e8c840" fill-opacity=".6"/>
  <ellipse cx="300" cy="452" rx="100" ry="6" fill="#000" fill-opacity=".3"/>
</svg>
