<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480">
  <!-- The gas station Wheels picked: a lit canopy, two pumps, a coffee sign, no cameras. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e18"/><stop offset="1" stop-color="#1a2234"/></linearGradient>
    <radialGradient id="canopy" cx=".5" cy=".2" r=".6"><stop offset="0" stop-color="#e8f4ff" stop-opacity=".42"/><stop offset=".5" stop-color="#90b0e0" stop-opacity=".12"/><stop offset="1" stop-color="#90b0e0" stop-opacity="0"/></radialGradient>
    <radialGradient id="neon" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff9a40" stop-opacity=".45"/><stop offset="1" stop-color="#ff9a40" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="480" fill="url(#sky)"/>
  <!-- Canopy across the top -->
  <rect x="0" y="40" width="1200" height="50" fill="#e8e8e8"/><rect x="0" y="62" width="1200" height="12" fill="#c83a2a"/>
  <g fill="#fffbe8"><rect x="200" y="90" width="80" height="6"/><rect x="560" y="90" width="80" height="6"/><rect x="920" y="90" width="80" height="6"/></g>
  <rect width="1200" height="480" fill="url(#canopy)"/>
  <!-- Canopy posts -->
  <rect x="380" y="90" width="18" height="330" fill="#c8c8c8"/><rect x="802" y="90" width="18" height="330" fill="#c8c8c8"/>
  <!-- Pumps -->
  <g><rect x="240" y="250" width="90" height="170" rx="6" fill="#d8d8d0"/><rect x="252" y="268" width="66" height="34" fill="#1a2a1a"/><text x="285" y="292" text-anchor="middle" font-family="Courier New, monospace" font-size="16" font-weight="700" fill="#7fe0a0">3.89</text><rect x="240" y="330" width="90" height="14" fill="#c83a2a"/><path d="M330 300c30 0 30 60 10 80" stroke="#1a1a1a" stroke-width="5" fill="none"/></g>
  <g><rect x="870" y="250" width="90" height="170" rx="6" fill="#d8d8d0"/><rect x="882" y="268" width="66" height="34" fill="#1a2a1a"/><text x="915" y="292" text-anchor="middle" font-family="Courier New, monospace" font-size="16" font-weight="700" fill="#7fe0a0">3.89</text><rect x="870" y="330" width="90" height="14" fill="#c83a2a"/></g>
  <!-- Shop window and coffee sign, far right -->
  <rect x="1000" y="160" width="200" height="260" fill="#16202a"/><rect x="1016" y="200" width="168" height="120" fill="#ffe8b0" fill-opacity=".2"/>
  <ellipse cx="1100" cy="140" rx="100" ry="50" fill="url(#neon)"/>
  <text x="1100" y="150" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="30" fill="none" stroke="#ffb060" stroke-width="2">COFFEE</text>
  <!-- Ice chest, far left -->
  <rect x="30" y="300" width="150" height="120" fill="#e8f0f8"/><text x="105" y="370" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="28" fill="#3a6ac0">ICE</text>
  <!-- Forecourt -->
  <rect y="420" width="1200" height="60" fill="#2a2c30"/><rect y="416" width="1200" height="6" fill="#4a4c52"/>
  <ellipse cx="560" cy="448" rx="70" ry="7" fill="#7a5aa0" fill-opacity=".18"/>
</svg>
