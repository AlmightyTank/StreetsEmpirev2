<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480">
  <!-- A rooftop at night: the skyline, a water tower, a parapet, laundry on a line, and nowhere to hide a lie. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0a18"/><stop offset=".7" stop-color="#2a1830"/><stop offset="1" stop-color="#4a2030"/></linearGradient>
  </defs>
  <rect width="1200" height="480" fill="url(#sky)"/>
  <g fill="#fff" fill-opacity=".5"><circle cx="120" cy="40" r="1.4"/><circle cx="380" cy="70" r="1.2"/><circle cx="700" cy="30" r="1.3"/><circle cx="960" cy="60" r="1.5"/><circle cx="1120" cy="30" r="1.2"/></g>
  <!-- Skyline -->
  <g fill="#120e1a"><rect x="0" y="230" width="90" height="190"/><rect x="100" y="190" width="70" height="230"/><rect x="430" y="210" width="80" height="210"/><rect x="520" y="160" width="60" height="260"/><rect x="590" y="200" width="90" height="220"/><rect x="690" y="240" width="70" height="180"/><rect x="1080" y="200" width="120" height="220"/></g>
  <g fill="#ffcf6a" fill-opacity=".35"><rect x="20" y="260" width="8" height="10"/><rect x="120" y="220" width="8" height="10"/><rect x="140" y="280" width="8" height="10"/><rect x="450" y="240" width="8" height="10"/><rect x="540" y="190" width="8" height="10"/><rect x="610" y="230" width="8" height="10"/><rect x="1100" y="230" width="8" height="10"/><rect x="1150" y="270" width="8" height="10"/></g>
  <!-- Water tower, left -->
  <g fill="#3a2a22" stroke="#1a100c" stroke-width="4"><path d="M190 120h150v130H190z"/><path d="M180 120l85-50 85 50z"/></g>
  <g stroke="#1a100c" stroke-width="6"><path d="M200 250l-20 120M330 250l20 120M210 300h110"/></g>
  <g stroke="#2a1a14" stroke-width="2"><path d="M190 150h150M190 185h150M190 220h150"/></g>
  <!-- Laundry line, right -->
  <path d="M780 150c100 30 200 30 280 0" stroke="#8a8a90" stroke-width="2" fill="none"/>
  <g fill-opacity=".85"><rect x="820" y="160" width="40" height="60" fill="#e8e0d0"/><rect x="880" y="166" width="50" height="44" fill="#c86a6a"/><rect x="950" y="166" width="36" height="70" fill="#6a8ac8"/></g>
  <!-- Vent stack -->
  <rect x="1000" y="300" width="40" height="80" fill="#3a3a40"/><path d="M990 300h60l-6-16h-48z" fill="#4a4a52"/>
  <!-- Parapet across the bottom -->
  <rect y="400" width="1200" height="80" fill="#3a2e2a"/><rect y="396" width="1200" height="10" fill="#5a4a42"/>
  <g stroke="#2a201c" stroke-width="2"><path d="M0 430h1200M150 406v74M450 406v74M750 406v74M1050 406v74"/></g>
</svg>
