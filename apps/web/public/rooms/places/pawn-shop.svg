<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480">
  <!-- The apprentice's pawn shop: guitars on the wall, a glass case of watches, the three-ball sign, the old sale book. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22201a"/><stop offset="1" stop-color="#14120e"/></linearGradient>
    <radialGradient id="lamp" cx=".5" cy=".05" r=".6"><stop offset="0" stop-color="#fff0c0" stop-opacity=".4"/><stop offset="1" stop-color="#c8b070" stop-opacity="0"/></radialGradient>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8f4f8" stop-opacity=".22"/><stop offset="1" stop-color="#e8f4f8" stop-opacity=".08"/></linearGradient>
  </defs>
  <rect width="1200" height="480" fill="url(#wall)"/>
  <!-- Guitars, left -->
  <g>
    <path d="M90 300c-30 0-40-40-20-56 10-8 10-24 0-32-18-16 0-44 20-44s38 28 20 44c-10 8-10 24 0 32 20 16 10 56-20 56z" fill="#a85a2a"/><rect x="84" y="60" width="12" height="110" fill="#3a2414"/><circle cx="90" cy="250" r="10" fill="#1a100a"/>
    <path d="M220 300c-30 0-40-40-20-56 10-8 10-24 0-32-18-16 0-44 20-44s38 28 20 44c-10 8-10 24 0 32 20 16 10 56-20 56z" fill="#2a2a2a"/><rect x="214" y="60" width="12" height="110" fill="#1a1a1a"/><circle cx="220" cy="250" r="10" fill="#c8c8c8"/>
    <path d="M340 290c-24 0-34-34-16-48 8-6 8-20 0-26-14-14 0-36 16-36s30 22 16 36c-8 6-8 20 0 26 18 14 8 48-16 48z" fill="#c8a040"/><rect x="335" y="70" width="10" height="110" fill="#3a2414"/>
  </g>
  <!-- Three-ball sign, right -->
  <path d="M1000 40v60" stroke="#8a7a4a" stroke-width="5"/><path d="M960 100h80" stroke="#8a7a4a" stroke-width="5"/>
  <g fill="#e8c040" stroke="#6a5010" stroke-width="2"><circle cx="970" cy="122" r="18"/><circle cx="1030" cy="122" r="18"/><circle cx="1000" cy="160" r="18"/></g>
  <text x="1000" y="230" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#e8d8a0" fill-opacity=".6">WE BUY · WE LOAN</text>
  <!-- Wall of watches and rings on cards -->
  <g fill="#e8e0c8" fill-opacity=".7"><rect x="860" y="270" width="60" height="40"/><rect x="930" y="270" width="60" height="40"/><rect x="1000" y="270" width="60" height="40"/><rect x="1070" y="270" width="60" height="40"/></g>
  <g fill="none" stroke="#c8a040" stroke-width="3"><circle cx="890" cy="290" r="10"/><circle cx="960" cy="290" r="10"/><circle cx="1030" cy="290" r="8"/><circle cx="1100" cy="290" r="10"/></g>
  <rect width="1200" height="480" fill="url(#lamp)"/>
  <!-- Glass counter case along the bottom, with the sale book on top -->
  <rect y="400" width="1200" height="80" fill="url(#case)"/><rect y="396" width="1200" height="6" fill="#c8d0d8" fill-opacity=".6"/>
  <g fill="#c8a040" fill-opacity=".6"><circle cx="200" cy="440" r="8"/><circle cx="260" cy="446" r="6"/><circle cx="980" cy="440" r="8"/><rect x="1040" y="432" width="40" height="16" rx="4"/></g>
  <path d="M700 402l80-14 80 14z" fill="#3a5a3a"/><path d="M780 388v14" stroke="#1a2a1a" stroke-width="2"/>
</svg>
