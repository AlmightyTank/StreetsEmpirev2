<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480">
  <!-- Mrs. Alvarez's corner shop: half-stocked shelves, the old till, a hand-lettered sign in the window. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2418"/><stop offset="1" stop-color="#18140c"/></linearGradient>
    <radialGradient id="lamp" cx=".5" cy=".05" r=".6"><stop offset="0" stop-color="#ffe8b0" stop-opacity=".42"/><stop offset=".5" stop-color="#d8b070" stop-opacity=".1"/><stop offset="1" stop-color="#d8b070" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16202c"/><stop offset="1" stop-color="#0a0e14"/></linearGradient>
    <linearGradient id="counter" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a4a2a"/><stop offset="1" stop-color="#3a2614"/></linearGradient>
  </defs>
  <rect width="1200" height="480" fill="url(#wall)"/>
  <!-- Shop window with lettering, left -->
  <rect x="40" y="60" width="300" height="250" fill="url(#glass)" stroke="#3a2c1a" stroke-width="12"/>
  <text x="190" y="120" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="30" fill="#e8c878" fill-opacity=".75">Alvarez</text>
  <text x="190" y="152" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#e8c878" fill-opacity=".55" letter-spacing="4">GROCERY · DELI</text>
  <path d="M110 230h160v50h-160z" fill="#e8e0c8" fill-opacity=".8"/><text x="190" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#a83a2a">OPEN LATE</text>
  <!-- Shelves, right: some gaps -->
  <g fill="#3a2c1a"><rect x="840" y="80" width="320" height="10"/><rect x="840" y="170" width="320" height="10"/><rect x="840" y="260" width="320" height="10"/><rect x="840" y="350" width="320" height="10"/></g>
  <g fill-opacity=".8">
    <rect x="860" y="36" width="34" height="44" rx="3" fill="#c84a3a"/><rect x="900" y="40" width="34" height="40" rx="3" fill="#c84a3a"/><rect x="1010" y="32" width="50" height="48" rx="3" fill="#e8c860"/><rect x="1070" y="40" width="34" height="40" rx="3" fill="#5a8ac0"/>
    <rect x="860" y="124" width="60" height="46" rx="3" fill="#e8e0c8"/><rect x="960" y="130" width="40" height="40" rx="3" fill="#6aa060"/><rect x="1100" y="126" width="44" height="44" rx="3" fill="#e8e0c8"/>
    <rect x="880" y="220" width="26" height="40" rx="10" fill="#a8d0e0"/><rect x="912" y="220" width="26" height="40" rx="10" fill="#a8d0e0"/><rect x="944" y="220" width="26" height="40" rx="10" fill="#a8d0e0"/><rect x="1060" y="214" width="70" height="46" rx="3" fill="#c88a4a"/>
    <rect x="870" y="310" width="90" height="40" rx="3" fill="#8a5a3a"/><rect x="1040" y="306" width="50" height="44" rx="3" fill="#e8c860"/>
  </g>
  <!-- Calendar, wall clock -->
  <rect x="700" y="80" width="64" height="84" fill="#e8e0c8" fill-opacity=".7"/><rect x="700" y="80" width="64" height="18" fill="#3a6aa0"/>
  <circle cx="470" cy="100" r="30" fill="#e8e0c8" fill-opacity=".75" stroke="#3a2c1a" stroke-width="5"/><path d="M470 100v-18M470 100l12 6" stroke="#18140c" stroke-width="3" stroke-linecap="round"/>
  <!-- Fluorescent light -->
  <rect x="480" y="12" width="240" height="8" rx="4" fill="#fff6dc"/>
  <rect width="1200" height="480" fill="url(#lamp)"/>
  <!-- Counter with the old till and a bell -->
  <rect y="414" width="1200" height="66" fill="url(#counter)"/><rect y="410" width="1200" height="6" fill="#8a6440"/>
  <path d="M830 410l10-56h120l10 56z" fill="#8a7a5a"/><rect x="846" y="330" width="108" height="26" rx="3" fill="#5a4c34"/><rect x="858" y="336" width="54" height="14" fill="#c8e0a0" fill-opacity=".55"/>
  <path d="M330 410c0-20 16-30 30-30s30 10 30 30z" fill="#c8a040"/><circle cx="360" cy="376" r="4" fill="#c8a040"/>
</svg>
