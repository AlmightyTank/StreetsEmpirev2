<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Urban Ghost pistol: concrete slide with lightening cuts, tall sights, flared magwell, urban camo grip. -->
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".6"/></filter>
    <linearGradient id="slide" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d3d7db"/><stop offset=".4" stop-color="#9a9fa5"/><stop offset="1" stop-color="#5c6168"/></linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6f757d"/><stop offset="1" stop-color="#383c42"/></linearGradient>
    <linearGradient id="barrel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5d636b"/><stop offset="1" stop-color="#22252a"/></linearGradient>
    <clipPath id="gripclip"><path d="M32 58 H60 L51 101 L54 106 Q54 110 49 110 H21 Q16 110 17 105 L21 101 Z"/></clipPath>
  </defs>
  <g filter="url(#s)" stroke="#16181b" stroke-width="1.6" stroke-linejoin="round">
    <!-- grip with flared magwell -->
    <path d="M32 58 H60 L51 101 L54 106 Q54 110 49 110 H21 Q16 110 17 105 L21 101 Z" fill="#8d9298"/>
    <g clip-path="url(#gripclip)" stroke="none">
      <path d="M30 56 L46 60 L42 72 L28 70 Z" fill="#5f646b"/>
      <path d="M48 66 L62 64 L58 80 L46 78 Z" fill="#c6cacf"/>
      <path d="M24 80 L40 76 L44 90 L30 94 Z" fill="#3e4247"/>
      <path d="M42 88 L56 90 L52 104 L40 100 Z" fill="#62676e"/>
      <path d="M16 96 L30 98 L28 112 L14 110 Z" fill="#b4b8bd"/>
      <path d="M34 100 L46 102 L44 112 L32 112 Z" fill="#3e4247"/>
    </g>
    <path d="M18 103 H54" stroke-width="1.2"/>
    <!-- rounded trigger guard -->
    <path d="M58 63 Q58 81 73 81 H82 Q87 81 87 75 V63" fill="none" stroke-width="4.5"/>
    <path d="M58 63 Q58 81 73 81 H82 Q87 81 87 75 V63" fill="none" stroke="#7a8087" stroke-width="2"/>
    <path d="M70 63 Q67 70 72 76" fill="none" stroke-width="3"/>
    <!-- frame with rail -->
    <path d="M28 54 H108 V60 Q108 64 104 64 H30 Z" fill="url(#frame)"/>
    <!-- slide -->
    <path d="M20 37 H112 Q116 37 116 41 V52 Q116 55 113 55 H20 Q17 55 17 52 V40 Q17 37 20 37 Z" fill="url(#slide)"/>
    <!-- lightening cuts expose the barrel -->
    <rect x="64" y="39" width="12" height="7" rx="3" fill="url(#barrel)"/>
    <rect x="80" y="39" width="12" height="7" rx="3" fill="url(#barrel)"/>
    <rect x="96" y="39" width="12" height="7" rx="3" fill="url(#barrel)"/>
    <!-- tall sights -->
    <path d="M22 37 V31 H31 V37" fill="#3a3e44"/>
    <path d="M108 37 V31 H112 V37" fill="#3a3e44"/>
    <rect x="50" y="42" width="11" height="6" rx="1" fill="#2d3035"/>
  </g>
  <rect x="25.5" y="31" width="2" height="3" fill="#16181b"/>
  <circle cx="110" cy="33" r=".9" fill="#e6f4ff"/>
  <!-- wide cocking grooves -->
  <g stroke="#4a4f56" stroke-width="2.2"><path d="M24 41V52M29 41V52M34 41V52"/></g>
  <g stroke="#e9f0f6" stroke-opacity=".5" stroke-width=".8"><path d="M25.3 41V52M30.3 41V52M35.3 41V52"/></g>
  <!-- cold highlights -->
  <path d="M20 39.5 H62" stroke="#f2f8fd" stroke-opacity=".7" stroke-width="1.1"/>
  <path d="M66 40.5 H74M82 40.5 H90M98 40.5 H106" stroke="#c8d3dd" stroke-opacity=".55" stroke-width=".9"/>
  <path d="M30 56 H106" stroke="#aeb5bd" stroke-opacity=".5" stroke-width="1"/>
  <g fill="#8a9097" fill-opacity=".7"><rect x="70" y="56" width="4" height="2"/><rect x="78" y="56" width="4" height="2"/><rect x="86" y="56" width="4" height="2"/><rect x="94" y="56" width="4" height="2"/></g>
  <circle cx="44" cy="60" r="1.4" fill="#16181b"/>
  <circle cx="100" cy="60" r="1.4" fill="#16181b"/>
</svg>
