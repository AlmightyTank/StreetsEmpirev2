<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 128">
  <!-- Midnight Ops Tek-9: railed receiver with micro optic, slotted handguard, suppressor, extended ribbed magazine. -->
  <defs>
    <filter id="s" x="-10%" y="-20%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".65"/></filter>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#454a51"/><stop offset=".45" stop-color="#23262a"/><stop offset="1" stop-color="#0f1012"/></linearGradient>
    <linearGradient id="can" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3e4248"/><stop offset=".3" stop-color="#26292d"/><stop offset="1" stop-color="#0c0d0f"/></linearGradient>
    <linearGradient id="poly" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2c2f33"/><stop offset="1" stop-color="#0c0d0e"/></linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1a17"/><stop offset=".6" stop-color="#1f3a33"/><stop offset="1" stop-color="#4f8f7c"/></linearGradient>
    <pattern id="stipple" width="3" height="3" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r=".55" fill="#000" fill-opacity=".55"/><circle cx="0" cy="0" r=".4" fill="#5d636b" fill-opacity=".35"/></pattern>
  </defs>
  <g transform="translate(0 -4)">
  <g filter="url(#s)" stroke="#060708" stroke-width="1.6" stroke-linejoin="round">
    <!-- suppressor -->
    <path d="M204 44 H246 Q251 44 251 49 V59 Q251 64 246 64 H204 Z" fill="url(#can)"/>
    <!-- slotted handguard -->
    <rect x="158" y="45" width="50" height="18" rx="3" fill="url(#steel)"/>
    <!-- extended magazine -->
    <path d="M128 64 H148 L156.5 121 Q157 124 154 124 H136 Q133 124 133 121 Z" fill="url(#poly)"/>
    <!-- stippled grip -->
    <path d="M74 64 H100 L91 104 Q90 109 85 109 H69 Q63 109 64 103 Z" fill="url(#poly)"/>
    <path d="M76 68 H96 L89 100 Q88 103 85 103 H71 Q68 103 68 100 Z" fill="url(#stipple)" stroke="none"/>
    <!-- trigger guard -->
    <path d="M100 64 Q100 81 112 81 H124 Q128 81 128 76 V64" fill="none" stroke-width="4.5"/>
    <path d="M100 64 Q100 81 112 81 H124 Q128 81 128 76 V64" fill="none" stroke="#26292d" stroke-width="2"/>
    <path d="M112 64 Q109 71 114 76" fill="none" stroke-width="3"/>
    <!-- receiver -->
    <path d="M60 44 H162 V65 H62 Q56 65 56 59 V50 Q56 44 60 44 Z" fill="url(#steel)"/>
    <!-- QD sling plate -->
    <path d="M48 47 H58 V60 H48 Q45 60 45 57 V50 Q45 47 48 47 Z" fill="#1a1c1f"/>
    <!-- top rail and micro optic -->
    <rect x="70" y="40" width="88" height="5" rx="1" fill="#16181b"/>
    <path d="M92 40 V33 Q92 30 95 30 H110 Q116 30 117 35 L118 40 Z" fill="url(#steel)"/>
    <path d="M110 32 Q114 32 115 35 L115.6 39 H110 Z" fill="url(#lens)" stroke-width="1"/>
    <rect x="126" y="44" width="10" height="5" rx="1.5" fill="#1a1c1f"/>
  </g>
  <!-- handguard slots -->
  <g fill="#050506"><rect x="163" y="49" width="13" height="3.4" rx="1.7"/><rect x="180" y="49" width="13" height="3.4" rx="1.7"/><rect x="163" y="56" width="13" height="3.4" rx="1.7"/><rect x="180" y="56" width="13" height="3.4" rx="1.7"/></g>
  <!-- suppressor bands -->
  <path d="M214 44.8 V63.2M234 44.8 V63.2" stroke="#060708" stroke-width="1.4"/>
  <!-- rail teeth -->
  <g fill="#2e3135"><rect x="74" y="40.5" width="3" height="2"/><rect x="80" y="40.5" width="3" height="2"/><rect x="86" y="40.5" width="3" height="2"/><rect x="122" y="40.5" width="3" height="2"/><rect x="128" y="40.5" width="3" height="2"/><rect x="134" y="40.5" width="3" height="2"/><rect x="140" y="40.5" width="3" height="2"/><rect x="146" y="40.5" width="3" height="2"/><rect x="152" y="40.5" width="3" height="2"/></g>
  <!-- magazine ribs -->
  <path d="M136 72 H149M137 82 H150M138 92 H152M140 102 H153M141 112 H155M142 119 H155" stroke="#000" stroke-opacity=".55" stroke-width="1.4"/>
  <circle cx="51.5" cy="53.5" r="2.4" fill="none" stroke="#3e4248" stroke-width="1.2"/>
  <!-- low-reflective highlights -->
  <path d="M62 46.5 H160" stroke="#8a929c" stroke-opacity=".28" stroke-width="1.1"/>
  <path d="M160 47 H206" stroke="#8a929c" stroke-opacity=".25" stroke-width="1"/>
  <path d="M206 46.5 H246" stroke="#8a929c" stroke-opacity=".3" stroke-width="1.1"/>
  <circle cx="113" cy="35" r="1" fill="#7dffcf" fill-opacity=".6"/>
  </g>
</svg>
