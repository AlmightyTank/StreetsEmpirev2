<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 128">
  <!-- Cartel Gold Tek-9: lacquered receiver with gold scroll panel, engraved gold shroud, ebony grip with diamond inlay. -->
  <defs>
    <filter id="s" x="-10%" y="-20%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".6"/></filter>
    <linearGradient id="lacquer" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4d5262"/><stop offset=".35" stop-color="#1b1e27"/><stop offset="1" stop-color="#08090c"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3b8"/><stop offset=".35" stop-color="#e7b94a"/><stop offset=".7" stop-color="#9a6614"/><stop offset="1" stop-color="#f0c95f"/></linearGradient>
    <linearGradient id="ebony" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a2a26"/><stop offset=".5" stop-color="#1c1210"/><stop offset="1" stop-color="#0a0605"/></linearGradient>
    <radialGradient id="medal" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#fff5c4"/><stop offset=".6" stop-color="#d9a73a"/><stop offset="1" stop-color="#7c510e"/></radialGradient>
  </defs>
  <g filter="url(#s)" stroke="#07080b" stroke-width="1.6" stroke-linejoin="round">
    <!-- crowned gold barrel tip -->
    <rect x="220" y="49" width="18" height="10" rx="2" fill="url(#gold)"/>
    <!-- gold shroud -->
    <rect x="158" y="44" width="64" height="20" rx="6" fill="url(#gold)"/>
    <!-- magazine with gold baseplate -->
    <path d="M128 64 H148 L156 114 H133 Z" fill="url(#lacquer)"/>
    <path d="M132 113 H157 L158 119 Q158 121 155 121 H134 Q131 121 131 119 Z" fill="url(#gold)"/>
    <!-- ebony grip -->
    <path d="M74 64 H100 L91 104 Q90 109 85 109 H69 Q63 109 64 103 Z" fill="url(#ebony)"/>
    <!-- gold trigger guard and trigger -->
    <path d="M100 64 Q100 81 112 81 H124 Q128 81 128 76 V64" fill="none" stroke-width="4.5"/>
    <path d="M100 64 Q100 81 112 81 H124 Q128 81 128 76 V64" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <path d="M112 64 Q109 71 114 76" fill="none" stroke="url(#gold)" stroke-width="2.6"/>
    <!-- lacquered receiver -->
    <path d="M60 44 H162 V65 H62 Q56 65 56 59 V50 Q56 44 60 44 Z" fill="url(#lacquer)"/>
    <rect x="50" y="49" width="8" height="8" rx="2" fill="none" stroke="url(#gold)" stroke-width="2.2"/>
    <rect x="116" y="37" width="8" height="8" rx="4" fill="url(#gold)"/>
  </g>
  <!-- staggered shroud holes -->
  <g fill="#1a1205">
    <circle cx="166" cy="50" r="2.2"/><circle cx="175" cy="50" r="2.2"/><circle cx="184" cy="50" r="2.2"/><circle cx="193" cy="50" r="2.2"/><circle cx="202" cy="50" r="2.2"/><circle cx="211" cy="50" r="2.2"/>
    <circle cx="170.5" cy="58" r="2.2"/><circle cx="179.5" cy="58" r="2.2"/><circle cx="188.5" cy="58" r="2.2"/><circle cx="197.5" cy="58" r="2.2"/><circle cx="206.5" cy="58" r="2.2"/><circle cx="215.5" cy="58" r="2.2"/>
  </g>
  <path d="M222 51 H236" stroke="#fff6cf" stroke-opacity=".8" stroke-width="1"/>
  <circle cx="238" cy="54" r="1.6" fill="#1a1205"/>
  <!-- receiver scroll panel -->
  <rect x="64" y="47" width="54" height="14" rx="2" fill="none" stroke="#d9a73a" stroke-width=".8"/>
  <g fill="none" stroke="#f2cd6a" stroke-width=".8" stroke-linecap="round">
    <path d="M68 58 C68 50 75 50 75 54 C75 56.5 72 56.5 72 54.5"/>
    <path d="M77 50 C81 58 86 58 88 53 C89 51 87 50 86 52"/>
    <path d="M90 58 C90 50 97 50 97 54 C97 56.5 94 56.5 94 54.5"/>
    <path d="M99 50 C103 58 108 58 110 53 C111 51 109 50 108 52"/>
    <path d="M112 58 C113 54 115 52 115 50"/>
  </g>
  <path d="M120 49 H158M120 60 H158" stroke="#d9a73a" stroke-opacity=".6" stroke-width=".7"/>
  <!-- grip diamond inlay and screws -->
  <path d="M82 76 L88 84 L82 92 L76 84 Z" fill="url(#gold)" stroke="#5c3b08" stroke-width=".7"/>
  <path d="M82 79 L85.5 84 L82 89 L78.5 84 Z" fill="#fff3b8" fill-opacity=".55"/>
  <circle cx="79" cy="70" r="1.5" fill="url(#medal)" stroke="#5c3b08" stroke-width=".5"/>
  <circle cx="76" cy="100" r="1.5" fill="url(#medal)" stroke="#5c3b08" stroke-width=".5"/>
  <!-- mag gold pinstripes -->
  <path d="M135 70 H149M136.5 80 H150.5" stroke="#d9a73a" stroke-opacity=".7" stroke-width=".8"/>
  <!-- highlights -->
  <path d="M62 46.5 H160" stroke="#c5cbe0" stroke-opacity=".45" stroke-width="1.1"/>
  <path d="M164 46.5 H216" stroke="#fff6cf" stroke-opacity=".8" stroke-width="1.1"/>
</svg>
