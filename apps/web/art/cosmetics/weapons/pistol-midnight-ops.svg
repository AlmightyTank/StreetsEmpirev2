<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Midnight Ops pistol: compact optics-ready slide, compensator, weapon light, stippled grip. -->
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".65"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <linearGradient id="slide" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4f56"/><stop offset=".35" stop-color="#26292e"/><stop offset="1" stop-color="#121316"/></linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c2f34"/><stop offset="1" stop-color="#141518"/></linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b2e33"/><stop offset="1" stop-color="#0e0f11"/></linearGradient>
    <linearGradient id="optic" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3e44"/><stop offset="1" stop-color="#16181b"/></linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1a17"/><stop offset=".6" stop-color="#1f3a33"/><stop offset="1" stop-color="#4f8f7c"/></linearGradient>
    <pattern id="stipple" width="3" height="3" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r=".55" fill="#000" fill-opacity=".55"/><circle cx="0" cy="0" r=".4" fill="#5d636b" fill-opacity=".35"/></pattern>
  </defs>
  <g filter="url(#s)" stroke="#060708" stroke-width="1.6" stroke-linejoin="round">
    <!-- grip with extended magazine baseplate -->
    <path d="M32 58 H60 L51 103 Q50 107 45 107 H25 Q19 107 20 101 Z" fill="url(#grip)"/>
    <path d="M23 106 H48 L47 113 Q46 115 43 115 H25 Q22 115 22 112 Z" fill="#1a1c1f"/>
    <path d="M35 63 H56 L49 98 Q48 101 44 101 H29 Q26 101 27 98 Z" fill="url(#stipple)" stroke="none"/>
    <!-- squared, undercut trigger guard -->
    <path d="M58 63 V75 Q58 80 63 80 H84 Q88 80 88 76 V63" fill="none" stroke-width="4.5"/>
    <path d="M58 63 V75 Q58 80 63 80 H84 Q88 80 88 76 V63" fill="none" stroke="#2c2f34" stroke-width="2"/>
    <path d="M69 63 Q67 70 70 75 H72" fill="none" stroke-width="3"/>
    <!-- frame with accessory rail and mounted light -->
    <path d="M28 54 H104 V61 Q104 64 100 64 H30 Z" fill="url(#frame)"/>
    <path d="M90 63 H96 V66 H90 Z" fill="#1a1c1f"/>
    <path d="M88 65 H106 Q109 65 109 68 V73 Q109 76 106 76 H91 Q88 76 88 73 Z" fill="url(#optic)"/>
    <rect x="106" y="66" width="4" height="9" rx="1" fill="#9fb3bd"/>
    <!-- compensator -->
    <path d="M98 39 H113 Q116 39 116 42 V52 Q116 55 113 55 H98 Z" fill="#1d1f23"/>
    <!-- slide -->
    <path d="M24 38 H100 V55 H24 Q20 55 20 51 V42 Q20 38 24 38 Z" fill="url(#slide)"/>
    <!-- low-profile optic -->
    <path d="M44 38 V31 Q44 28 47 28 H58 Q63 28 64 33 L66 38 Z" fill="url(#optic)"/>
    <path d="M57 30 Q61 30 62 33 L63.5 37 H57 Z" fill="url(#lens)" stroke-width="1"/>
    <rect x="62" y="41" width="18" height="6" rx="1" fill="#0c0d0f"/>
  </g>
  <!-- angled serrations front and rear -->
  <g stroke="#08090a" stroke-width="1.3">
    <path d="M25 42 L27 51M29 42 L31 51M33 42 L35 51M37 42 L39 51"/>
    <path d="M84 42 L86 51M88 42 L90 51M92 42 L94 51"/>
  </g>
  <!-- compensator ports -->
  <g fill="#060708"><rect x="103" y="39.5" width="3" height="4" rx="1"/><rect x="108" y="39.5" width="3" height="4" rx="1"/></g>
  <!-- low-reflective highlights -->
  <path d="M24 40.5 H99" stroke="#8a929c" stroke-opacity=".28" stroke-width="1.1"/>
  <path d="M30 56 H102" stroke="#6b727b" stroke-opacity=".25" stroke-width="1"/>
  <path d="M47 30 H57" stroke="#8a929c" stroke-opacity=".3" stroke-width="1"/>
  <circle cx="61" cy="33.5" r="1" fill="#7dffcf" fill-opacity=".6"/>
  <!-- weapon light beam glint -->
  <circle cx="109" cy="70.5" r="3" fill="#dff4ff" fill-opacity=".55" filter="url(#glow)"/>
  <path d="M93 68 V74M96 68 V74M99 68 V74" stroke="#000" stroke-opacity=".5" stroke-width="1"/>
  <circle cx="44" cy="59" r="1.4" fill="#060708"/>
  <circle cx="96" cy="59" r="1.4" fill="#060708"/>
</svg>
