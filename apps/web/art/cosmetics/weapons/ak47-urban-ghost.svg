<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 128">
  <!-- Urban Ghost AK: camo fixed stock with cheek riser, long slotted handguard with light, smoke magazine, long flash hider. -->
  <defs>
    <filter id="s" x="-10%" y="-20%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".6"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <linearGradient id="concrete" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfd3d7"/><stop offset=".45" stop-color="#979ca2"/><stop offset="1" stop-color="#5c6168"/></linearGradient>
    <linearGradient id="graphite" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a8088"/><stop offset=".5" stop-color="#4c5158"/><stop offset="1" stop-color="#2b2e33"/></linearGradient>
    <linearGradient id="smoke" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5d6670" stop-opacity=".92"/><stop offset=".5" stop-color="#9aa6b2" stop-opacity=".85"/><stop offset="1" stop-color="#4a525b" stop-opacity=".92"/></linearGradient>
    <linearGradient id="gpoly" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6e747c"/><stop offset="1" stop-color="#33373c"/></linearGradient>
    <clipPath id="stockclip"><path d="M10 50 L72 44 V62 L52 64 L16 82 Q8 85 8 78 V56 Q8 51 10 50 Z"/></clipPath>
    <clipPath id="hgclip"><rect x="150" y="42" width="62" height="21" rx="3"/></clipPath>
    <clipPath id="magclip"><path d="M128 62 H152 Q158 88 176 106 L154 116 Q134 94 128 62 Z"/></clipPath>
  </defs>
  <g filter="url(#s)" stroke="#16181b" stroke-width="1.6" stroke-linejoin="round">
    <!-- barrel and long flash hider -->
    <rect x="210" y="49" width="16" height="6" fill="url(#graphite)"/>
    <rect x="224" y="47" width="26" height="10" rx="1.5" fill="url(#graphite)"/>
    <!-- smoke magazine -->
    <path d="M128 62 H152 Q158 88 176 106 L154 116 Q134 94 128 62 Z" fill="#2b2e33"/>
    <g clip-path="url(#magclip)" stroke="none">
      <path d="M128 62 H152 Q158 88 176 106 L154 116 Q134 94 128 62 Z" fill="url(#smoke)"/>
      <g fill="#c99a4a" fill-opacity=".55">
        <path d="M136 64 L146 64 L147 68 L137 68 Z"/><path d="M137 72 L148 71 L149 75 L138 76 Z"/><path d="M139 80 L151 79 L152 83 L140 84 Z"/><path d="M142 88 L155 86 L157 90 L144 92 Z"/>
      </g>
    </g>
    <path d="M128 62 H152 Q158 88 176 106 L154 116 Q134 94 128 62 Z" fill="none"/>
    <!-- pistol grip -->
    <path d="M88 62 H105 L98 92 Q97 96 92 96 L84 94 Q80 93 81 89 Z" fill="url(#gpoly)"/>
    <path d="M105 63 Q105 75 114 75 H128" fill="none" stroke-width="4"/>
    <path d="M105 63 Q105 75 114 75 H128" fill="none" stroke="#8a9097" stroke-width="1.8"/>
    <path d="M117 63 Q115 68 118 72" fill="none" stroke-width="2.6"/>
    <!-- camo fixed stock with cheek riser -->
    <path d="M10 50 L72 44 V62 L52 64 L16 82 Q8 85 8 78 V56 Q8 51 10 50 Z" fill="#8f949a"/>
    <g clip-path="url(#stockclip)" stroke="none">
      <path d="M6 48 L26 46 L22 60 L6 62 Z" fill="#c4c8cc"/>
      <path d="M30 48 L50 46 L48 58 L32 60 Z" fill="#5c6168"/>
      <path d="M54 44 L74 42 L74 56 L56 58 Z" fill="#b2b6bb"/>
      <path d="M12 64 L32 60 L32 76 L12 84 Z" fill="#3f4348"/>
      <path d="M36 62 L54 60 L50 70 L38 72 Z" fill="#6b7077"/>
    </g>
    <path d="M24 49 Q38 42 56 45" fill="url(#graphite)"/>
    <path d="M5 52 L10 51 V82 L5 83 Z" fill="#2b2e33"/>
    <!-- receiver -->
    <path d="M70 44 H150 V63 H70 Z" fill="url(#concrete)"/>
    <path d="M72 44 Q110 38 150 42 V46 H72 Z" fill="url(#graphite)"/>
    <rect x="148" y="40" width="8" height="6" fill="#3b3f45"/>
    <rect x="138" y="52" width="10" height="4" rx="1.5" fill="#2a2d32"/>
    <!-- long slotted handguard -->
    <rect x="150" y="42" width="62" height="21" rx="3" fill="#8f949a"/>
    <g clip-path="url(#hgclip)" stroke="none">
      <path d="M148 40 L168 40 L164 64 L148 64 Z" fill="#5c6168"/>
      <path d="M176 40 L194 40 L198 52 L180 56 Z" fill="#c4c8cc"/>
      <path d="M196 54 L214 50 L214 64 L198 64 Z" fill="#3f4348"/>
    </g>
    <!-- side light -->
    <path d="M190 61 H206 Q209 61 209 64 V67 Q209 70 206 70 H193 Q190 70 190 67 Z" fill="url(#graphite)"/>
    <rect x="208" y="61.5" width="3" height="8" rx="1" fill="#cfe2ee"/>
    <!-- front sight post -->
    <path d="M218 49 V40 H224 V49" fill="#3b3f45"/>
  </g>
  <!-- handguard slots -->
  <g fill="#1d2024"><rect x="156" y="50" width="11" height="3.4" rx="1.7"/><rect x="171" y="50" width="11" height="3.4" rx="1.7"/><rect x="186" y="50" width="11" height="3.4" rx="1.7"/><rect x="201" y="50" width="7" height="3.4" rx="1.7"/></g>
  <!-- flash hider slots -->
  <g fill="#16181b"><rect x="230" y="49" width="4" height="2.2" rx="1"/><rect x="237" y="49" width="4" height="2.2" rx="1"/><rect x="244" y="49" width="3.5" height="2.2" rx="1"/><rect x="230" y="53" width="4" height="2.2" rx="1"/><rect x="237" y="53" width="4" height="2.2" rx="1"/><rect x="244" y="53" width="3.5" height="2.2" rx="1"/></g>
  <circle cx="211" cy="65.5" r="2.6" fill="#e6f4ff" fill-opacity=".5" filter="url(#glow)"/>
  <!-- cold highlights -->
  <path d="M74 47 H148" stroke="#f2f8fd" stroke-opacity=".6" stroke-width="1.1"/>
  <path d="M152 44.5 H210" stroke="#eef6fc" stroke-opacity=".55" stroke-width="1"/>
  <path d="M14 52.5 L70 47" stroke="#f2f8fd" stroke-opacity=".45" stroke-width="1.1"/>
  <path d="M134 66 Q140 88 156 106" stroke="#eef6fc" stroke-opacity=".35" stroke-width="1.2" fill="none"/>
</svg>
