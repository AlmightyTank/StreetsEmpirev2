<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 128">
  <!-- Urban Ghost shotgun: camo full stock, railed concrete receiver, M-LOK forend, extended tube with clamp, ported brake. -->
  <defs>
    <filter id="s" x="-10%" y="-20%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".6"/></filter>
    <linearGradient id="concrete" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfd3d7"/><stop offset=".45" stop-color="#979ca2"/><stop offset="1" stop-color="#5c6168"/></linearGradient>
    <linearGradient id="graphite" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a8088"/><stop offset=".5" stop-color="#4c5158"/><stop offset="1" stop-color="#2b2e33"/></linearGradient>
    <linearGradient id="barrel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9b0b8"/><stop offset=".4" stop-color="#5a6068"/><stop offset="1" stop-color="#2a2d32"/></linearGradient>
    <clipPath id="stockclip"><path d="M14 50 Q46 46 82 45 V68 L58 70 Q50 71 44 74 L20 88 Q13 91 11 85 L10 55 Q10 50 14 50 Z"/></clipPath>
    <clipPath id="forendclip"><rect x="136" y="53" width="64" height="16" rx="3"/></clipPath>
  </defs>
  <g filter="url(#s)" stroke="#16181b" stroke-width="1.6" stroke-linejoin="round">
    <!-- extended magazine tube and long barrel -->
    <rect x="124" y="55" width="114" height="8" rx="1.5" fill="url(#graphite)"/>
    <rect x="236" y="54" width="5" height="10" rx="1.5" fill="#3b3f45"/>
    <rect x="124" y="45" width="110" height="9" rx="1.5" fill="url(#barrel)"/>
    <!-- ported muzzle brake -->
    <rect x="232" y="43" width="18" height="13" rx="2" fill="url(#graphite)"/>
    <!-- barrel clamp with sling loop -->
    <rect x="212" y="43" width="9" height="22" rx="2" fill="url(#graphite)"/>
    <path d="M214 65 Q216.5 72 219 65" fill="none" stroke-width="2.2"/>
    <!-- full fixed stock in urban camo -->
    <path d="M14 50 Q46 46 82 45 V68 L58 70 Q50 71 44 74 L20 88 Q13 91 11 85 L10 55 Q10 50 14 50 Z" fill="#8f949a"/>
    <g clip-path="url(#stockclip)" stroke="none">
      <path d="M10 46 L30 46 L26 60 L8 62 Z" fill="#c4c8cc"/>
      <path d="M34 48 L56 46 L52 58 L36 60 Z" fill="#5c6168"/>
      <path d="M60 46 L84 44 L84 56 L64 58 Z" fill="#b2b6bb"/>
      <path d="M22 64 L42 60 L44 74 L24 80 Z" fill="#3f4348"/>
      <path d="M50 60 L72 58 L70 72 L52 72 Z" fill="#6b7077"/>
      <path d="M8 72 L22 70 L22 92 L8 92 Z" fill="#62676e"/>
    </g>
    <path d="M5 52 H11 L12 88 Q9 90 5 88 Z" fill="#2b2e33"/>
    <!-- trigger guard -->
    <path d="M88 68 Q88 80 98 80 H108 Q112 80 112 74 V68" fill="none" stroke-width="4.5"/>
    <path d="M88 68 Q88 80 98 80 H108 Q112 80 112 74 V68" fill="none" stroke="#8a9097" stroke-width="2"/>
    <path d="M98 68 Q96 74 100 78" fill="none" stroke-width="3"/>
    <!-- receiver with top rail and charging handle -->
    <rect x="78" y="42" width="48" height="27" rx="3" fill="url(#concrete)"/>
    <rect x="82" y="38" width="40" height="5" rx="1" fill="url(#graphite)"/>
    <path d="M114 38 V32 H120 V38" fill="#3b3f45"/>
    <rect x="96" y="49" width="16" height="7" rx="1" fill="#2a2d32"/>
    <rect x="112" y="50" width="8" height="4" rx="2" fill="#3b3f45"/>
    <!-- slotted forend -->
    <rect x="136" y="53" width="64" height="16" rx="3" fill="#8f949a"/>
    <g clip-path="url(#forendclip)" stroke="none">
      <path d="M134 52 L152 52 L148 70 L134 70 Z" fill="#5c6168"/>
      <path d="M160 52 L176 52 L180 62 L164 66 Z" fill="#c4c8cc"/>
      <path d="M182 60 L200 56 L202 70 L186 70 Z" fill="#3f4348"/>
    </g>
  </g>
  <!-- forend M-LOK slots -->
  <g fill="#1d2024"><rect x="142" y="59" width="10" height="3.5" rx="1.75"/><rect x="157" y="59" width="10" height="3.5" rx="1.75"/><rect x="172" y="59" width="10" height="3.5" rx="1.75"/><rect x="187" y="59" width="8" height="3.5" rx="1.75"/></g>
  <!-- brake ports -->
  <g fill="#16181b"><rect x="236" y="45" width="3" height="4" rx="1"/><rect x="241" y="45" width="3" height="4" rx="1"/><rect x="246" y="45" width="2.5" height="4" rx="1"/></g>
  <!-- rail teeth -->
  <g fill="#2b2e33"><rect x="85" y="38" width="3" height="2"/><rect x="91" y="38" width="3" height="2"/><rect x="97" y="38" width="3" height="2"/><rect x="103" y="38" width="3" height="2"/><rect x="109" y="38" width="3" height="2"/></g>
  <circle cx="117" cy="34" r="1.4" fill="none" stroke="#e6f4ff" stroke-width=".8"/>
  <!-- cold highlights -->
  <path d="M126 47.5 H232" stroke="#eef6fc" stroke-opacity=".6" stroke-width="1.1"/>
  <path d="M80 44.5 H124" stroke="#f2f8fd" stroke-opacity=".65" stroke-width="1.1"/>
  <path d="M16 52 Q46 48.5 80 47.5" stroke="#f2f8fd" stroke-opacity=".5" stroke-width="1.1" fill="none"/>
  <path d="M138 55 H198" stroke="#e6eef5" stroke-opacity=".45" stroke-width="1"/>
</svg>
