<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Cartel Gold pistol: blued single-action frame, exposed hammer, engraved slide, pearl grips with medallion. -->
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".6"/></filter>
    <linearGradient id="blued" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a6274"/><stop offset=".4" stop-color="#262b38"/><stop offset="1" stop-color="#0d0f15"/></linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#363c4b"/><stop offset="1" stop-color="#14171e"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3b8"/><stop offset=".35" stop-color="#e7b94a"/><stop offset=".7" stop-color="#9a6614"/><stop offset="1" stop-color="#f0c95f"/></linearGradient>
    <linearGradient id="goldh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a26c17"/><stop offset=".5" stop-color="#ffe9a0"/><stop offset="1" stop-color="#b47c1c"/></linearGradient>
    <linearGradient id="pearl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset=".3" stop-color="#eadfca"/><stop offset=".55" stop-color="#f6efe2"/><stop offset=".8" stop-color="#cdbb9b"/><stop offset="1" stop-color="#e9dcc3"/></linearGradient>
    <radialGradient id="medal" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#fff5c4"/><stop offset=".6" stop-color="#d9a73a"/><stop offset="1" stop-color="#7c510e"/></radialGradient>
  </defs>
  <g filter="url(#s)" stroke="#07080b" stroke-width="1.6" stroke-linejoin="round">
    <!-- straight single-action grip frame with beavertail -->
    <path d="M28 55 H58 L52 104 Q51 108 46 108 H27 Q22 108 22 103 L24 66 Q18 62 14 56 Q20 55 28 55 Z" fill="url(#frame)"/>
    <path d="M23 107 H50 L49 112 H24 Z" fill="url(#gold)"/>
    <path d="M30 63 H54 L49 100 Q48 103 44 103 H31 Q27 103 27 99 Z" fill="url(#pearl)" stroke-width="1.2"/>
    <!-- trigger guard and flat trigger -->
    <path d="M58 63 Q58 80 72 80 H82 Q87 80 87 74 V63" fill="none" stroke-width="4.5"/>
    <path d="M58 63 Q58 80 72 80 H82 Q87 80 87 74 V63" fill="none" stroke="url(#goldh)" stroke-width="2"/>
    <path d="M67 62 V73 H71 V62" fill="url(#gold)" stroke-width="1.1"/>
    <!-- frame and dust cover -->
    <path d="M26 53 H106 V60 Q106 64 102 64 H30 Z" fill="url(#frame)"/>
    <!-- exposed spur hammer -->
    <path d="M16 45 L12 37 A5 5 0 1 1 20 34 L24 41 Z" fill="url(#gold)"/>
    <circle cx="15.6" cy="33.6" r="1.8" fill="#14171e" stroke-width="1"/>
    <!-- slide -->
    <path d="M22 38 H108 Q112 38 112 42 V51 Q112 54 109 54 H22 Q19 54 19 51 V41 Q19 38 22 38 Z" fill="url(#blued)"/>
    <!-- barrel bushing and sights -->
    <path d="M109 40 H115 Q117 40 117 42 V50 Q117 52 115 52 H109 Z" fill="url(#gold)"/>
    <path d="M24 38 V34 H31 V38" fill="url(#gold)" stroke-width="1.1"/>
    <path d="M102 38 L103 34 H106 L107 38" fill="url(#gold)" stroke-width="1.1"/>
    <!-- slide stop -->
    <path d="M60 55 H76 Q79 55 79 58 Q79 61 76 61 H66" fill="url(#gold)" stroke-width="1.1"/>
  </g>
  <!-- engraved scroll panel -->
  <rect x="46" y="40.5" width="48" height="11" rx="2" fill="none" stroke="#d9a73a" stroke-width=".7"/>
  <g fill="none" stroke="#f2cd6a" stroke-width=".75" stroke-linecap="round">
    <path d="M49 49 C49 43 55 43 55 46 C55 48 52 48 52 46.5"/>
    <path d="M57 43 C61 49 65 49 67 45 C68 43 66 42 65 44"/>
    <path d="M69 49 C69 43 75 43 75 46 C75 48 72 48 72 46.5"/>
    <path d="M77 43 C81 49 85 49 87 45 C88 43 86 42 85 44"/>
    <path d="M89 49 C90 45 92 44 92 42"/>
    <path d="M52 46.5 C54 49 58 49 60 47M72 46.5 C74 49 78 49 80 47"/>
  </g>
  <!-- rear cocking serrations in gold inlay -->
  <g stroke="#e7b94a" stroke-width="1"><path d="M24 41V51M27.5 41V51M31 41V51M34.5 41V51M38 41V51"/></g>
  <!-- grip medallion and screws -->
  <circle cx="40" cy="80" r="5.2" fill="url(#medal)" stroke="#5c3b08" stroke-width=".9"/>
  <path d="M40 76.6 L41 79.2 L43.6 79.4 L41.6 81 L42.3 83.6 L40 82.2 L37.7 83.6 L38.4 81 L36.4 79.4 L39 79.2 Z" fill="#7c510e" fill-opacity=".85"/>
  <circle cx="33" cy="67" r="1.5" fill="url(#medal)" stroke="#5c3b08" stroke-width=".6"/>
  <circle cx="45" cy="97" r="1.5" fill="url(#medal)" stroke="#5c3b08" stroke-width=".6"/>
  <path d="M34 66 Q40 74 36 90 M46 70 Q50 84 44 96" stroke="#fff" stroke-opacity=".45" stroke-width="1" fill="none"/>
  <!-- polished highlights -->
  <path d="M22 40.5 H107" stroke="#c5cbe0" stroke-opacity=".45" stroke-width="1.1"/>
  <path d="M110 42 H116" stroke="#fff6cf" stroke-opacity=".8" stroke-width="1"/>
  <path d="M28 55.5 H104" stroke="#e7b94a" stroke-opacity=".6" stroke-width=".8"/>
  <circle cx="98" cy="59" r="1.6" fill="url(#medal)" stroke="#07080b" stroke-width=".6"/>
</svg>
