<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 128">
  <!-- Urban Ghost Tek-9: camo receiver, triangle-cut shroud, vertical foregrip, birdcage flash hider. -->
  <defs>
    <filter id="s" x="-10%" y="-20%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".6"/></filter>
    <linearGradient id="concrete" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfd3d7"/><stop offset=".45" stop-color="#979ca2"/><stop offset="1" stop-color="#5c6168"/></linearGradient>
    <linearGradient id="graphite" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a8088"/><stop offset=".5" stop-color="#4c5158"/><stop offset="1" stop-color="#2b2e33"/></linearGradient>
    <linearGradient id="gpoly" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6e747c"/><stop offset="1" stop-color="#33373c"/></linearGradient>
    <clipPath id="recclip"><path d="M60 44 H162 V65 H62 Q56 65 56 59 V50 Q56 44 60 44 Z"/></clipPath>
    <clipPath id="gripclip"><path d="M74 64 H100 L91 104 Q90 109 85 109 H69 Q63 109 64 103 Z"/></clipPath>
  </defs>
  <g filter="url(#s)" stroke="#16181b" stroke-width="1.6" stroke-linejoin="round">
    <!-- birdcage flash hider -->
    <rect x="226" y="49" width="20" height="10" rx="1.5" fill="url(#graphite)"/>
    <!-- triangle-cut shroud -->
    <rect x="158" y="44" width="70" height="20" rx="4" fill="url(#concrete)"/>
    <!-- vertical foregrip -->
    <path d="M184 63 H198 L197 92 Q197 96 193 96 H189 Q185 96 185 92 Z" fill="url(#gpoly)"/>
    <!-- magazine -->
    <path d="M128 64 H148 L156 116 Q156 119 153 119 H136 Q133 119 133 116 Z" fill="url(#gpoly)"/>
    <!-- camo grip -->
    <path d="M74 64 H100 L91 104 Q90 109 85 109 H69 Q63 109 64 103 Z" fill="#8f949a"/>
    <g clip-path="url(#gripclip)" stroke="none">
      <path d="M72 62 L92 62 L86 76 L70 78 Z" fill="#5c6168"/>
      <path d="M88 76 L102 72 L98 90 L86 88 Z" fill="#c4c8cc"/>
      <path d="M62 86 L80 82 L82 98 L64 102 Z" fill="#3f4348"/>
      <path d="M78 98 L94 98 L92 112 L76 112 Z" fill="#b2b6bb"/>
    </g>
    <!-- trigger guard -->
    <path d="M100 64 Q100 81 112 81 H124 Q128 81 128 76 V64" fill="none" stroke-width="4.5"/>
    <path d="M100 64 Q100 81 112 81 H124 Q128 81 128 76 V64" fill="none" stroke="#8a9097" stroke-width="2"/>
    <path d="M112 64 Q109 71 114 76" fill="none" stroke-width="3"/>
    <!-- camo receiver -->
    <path d="M60 44 H162 V65 H62 Q56 65 56 59 V50 Q56 44 60 44 Z" fill="#9a9fa5"/>
    <g clip-path="url(#recclip)" stroke="none">
      <path d="M54 42 L78 42 L74 56 L54 58 Z" fill="#c9cdd1"/>
      <path d="M82 50 L104 46 L106 60 L86 64 Z" fill="#5c6168"/>
      <path d="M110 42 L132 42 L128 54 L112 52 Z" fill="#b2b6bb"/>
      <path d="M134 52 L156 48 L164 66 L138 66 Z" fill="#3f4348"/>
      <path d="M60 58 L80 56 L80 68 L58 68 Z" fill="#6b7077"/>
    </g>
    <!-- rear sling ring and cocking knob -->
    <rect x="50" y="49" width="8" height="8" rx="2" fill="none" stroke-width="2.5"/>
    <rect x="116" y="37" width="8" height="8" rx="2" fill="url(#graphite)"/>
  </g>
  <!-- shroud triangle cuts -->
  <g fill="#1d2024">
    <path d="M164 48 L172 48 L168 54 Z"/><path d="M176 48 L184 48 L180 54 Z"/><path d="M188 48 L196 48 L192 54 Z"/><path d="M200 48 L208 48 L204 54 Z"/><path d="M212 48 L220 48 L216 54 Z"/>
    <path d="M170 61 L178 61 L174 55 Z"/><path d="M182 61 L190 61 L186 55 Z"/><path d="M194 61 L202 61 L198 55 Z"/><path d="M206 61 L214 61 L210 55 Z"/>
  </g>
  <!-- birdcage slots -->
  <g fill="#16181b"><rect x="231" y="51" width="3" height="6" rx="1"/><rect x="236" y="51" width="3" height="6" rx="1"/><rect x="241" y="51" width="3" height="6" rx="1"/></g>
  <!-- foregrip and mag ribs -->
  <path d="M187 70 H195M187 76 H195M187 82 H195M187 88 H195" stroke="#16181b" stroke-opacity=".6" stroke-width="1.2"/>
  <path d="M136 70 H149M137 80 H150M138 90 H151M139 100 H152M140 110 H153" stroke="#16181b" stroke-opacity=".5" stroke-width="1.2"/>
  <!-- cold highlights -->
  <path d="M62 46.5 H160" stroke="#f2f8fd" stroke-opacity=".55" stroke-width="1.1"/>
  <path d="M162 46.5 H224" stroke="#eef6fc" stroke-opacity=".7" stroke-width="1.1"/>
  <path d="M228 50.5 H244" stroke="#e6eef5" stroke-opacity=".5" stroke-width=".9"/>
</svg>
