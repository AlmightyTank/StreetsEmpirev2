<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Midnight Ops thug: hood up over a black hoodie, wraparound teal-tint shades, slim plate carrier, dog tags. -->
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".6"/></filter>
    <radialGradient id="skin" cx=".42" cy=".35" r=".75"><stop offset="0" stop-color="#a0673f"/><stop offset=".7" stop-color="#734326"/><stop offset="1" stop-color="#4d2b16"/></radialGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3e44"/><stop offset=".5" stop-color="#202226"/><stop offset="1" stop-color="#0e0f11"/></linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c2f34"/><stop offset="1" stop-color="#0c0d0f"/></linearGradient>
    <linearGradient id="vest" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2e2a"/><stop offset="1" stop-color="#111311"/></linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f3a33"/><stop offset=".5" stop-color="#070b0a"/><stop offset="1" stop-color="#1b4a3e"/></linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b8c0c8"/><stop offset=".5" stop-color="#5d636b"/><stop offset="1" stop-color="#8a929c"/></linearGradient>
  </defs>
  <g filter="url(#s)" stroke="#060708" stroke-width="1.6" stroke-linejoin="round">
    <!-- hoodie body and raised hood -->
    <path d="M8 128 Q10 98 30 90 L48 84 Q64 90 80 84 L98 90 Q118 98 120 128 Z" fill="url(#hoodie)"/>
    <path d="M38 76 Q28 52 34 34 Q44 14 64 13 Q84 14 94 34 Q100 52 90 76 Q84 86 64 88 Q44 86 38 76 Z" fill="url(#hood)"/>
    <path d="M56 70 H72 V88 Q64 92 56 88 Z" fill="url(#skin)"/>
    <ellipse cx="64" cy="55" rx="19" ry="23" fill="url(#skin)"/>
    <!-- wraparound shades -->
    <path d="M44 50 Q64 45 84 50 Q85 57 78 59 Q70 59.5 64 56 Q58 59.5 50 59 Q43 57 44 50 Z" fill="url(#lens)"/>
    <!-- slim plate carrier -->
    <path d="M42 96 L46 86 H54 L53 96 Z M86 96 L82 86 H74 L75 96 Z" fill="url(#vest)"/>
    <path d="M36 102 Q36 96 42 96 H86 Q92 96 92 102 V128 H36 Z" fill="url(#vest)"/>
  </g>
  <!-- hood opening frames the face -->
  <path d="M41 74 Q36 52 42 38 Q50 25 64 25 Q78 25 86 38 Q92 52 87 74" fill="none" stroke="#060708" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M41 74 Q36 52 42 38 Q50 25 64 25 Q78 25 86 38 Q92 52 87 74" fill="none" stroke="#2c2f34" stroke-width="3" stroke-linecap="round"/>
  <path d="M40 34 Q50 20 64 18" stroke="#8a929c" stroke-opacity=".35" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- drawstrings with teal aglets -->
  <g stroke-linecap="round"><path d="M57 88 Q55 92 56 96" stroke="#3a3e44" stroke-width="1.8" fill="none"/><path d="M71 88 Q73 92 72 96" stroke="#3a3e44" stroke-width="1.8" fill="none"/></g>
  <!-- webbing and patch -->
  <g stroke="#060708" stroke-width="1.6"><path d="M38 108 H90M38 115 H90M38 122 H90"/><path d="M50 104 V126M64 104 V126M78 104 V126" stroke-width="1.2" stroke-opacity=".6"/></g>
  <rect x="55" y="98" width="18" height="5" rx="1" fill="#4fd1a8" stroke="#0d2e26" stroke-width=".6"/>
  <!-- dog tags on a ball chain -->
  <path d="M54 84 Q56 94 62 98" fill="none" stroke="#8a929c" stroke-width="1" stroke-dasharray="1 .8"/>
  <path d="M74 84 Q72 94 66 98" fill="none" stroke="#8a929c" stroke-width="1" stroke-dasharray="1 .8"/>
  <!-- lens glints and face -->
  <path d="M48 52 L58 50.5M70 50.5 L79 52" stroke="#7dffcf" stroke-opacity=".55" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M62 60 Q64 63 66 60" stroke="#4d2b16" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M56 67 Q64 64 72 67 Q70 69 64 68 Q58 69 56 67 Z" fill="#1b100a"/>
  <path d="M59 71 H69" stroke="#3a1f10" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M60 74 Q64 79 68 74 Q66 78 64 78 Q62 78 60 74 Z" fill="#1b100a"/>
  <g filter="url(#s)" stroke="#2b2e33" stroke-width=".8"><rect x="59" y="96" width="7" height="10" rx="2" fill="url(#tag)" transform="rotate(-8 62 101)"/><rect x="63" y="97" width="7" height="10" rx="2" fill="url(#tag)" transform="rotate(10 66 102)"/></g>
</svg>
