<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Urban Ghost thug: backwards graphite cap, clear round frames, camo neck gaiter, camo puffer vest over a grey hoodie. -->
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".6"/></filter>
    <radialGradient id="skin" cx=".42" cy=".35" r=".75"><stop offset="0" stop-color="#a0673f"/><stop offset=".7" stop-color="#734326"/><stop offset="1" stop-color="#4d2b16"/></radialGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9cdd1"/><stop offset="1" stop-color="#7a8088"/></linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a8088"/><stop offset=".6" stop-color="#4c5158"/><stop offset="1" stop-color="#2b2e33"/></linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#a3abb4"/><stop offset="1" stop-color="#5d646d"/></linearGradient>
