<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Cartel Gold medicine: amber apothecary bottle, fluted gold cap, black-and-gold label, gold-and-onyx capsules. -->
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".6"/></filter>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5a2405"/><stop offset=".3" stop-color="#d77e22"/><stop offset=".6" stop-color="#9a4810"/><stop offset="1" stop-color="#3d1702"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3b8"/><stop offset=".35" stop-color="#e7b94a"/><stop offset=".7" stop-color="#9a6614"/><stop offset="1" stop-color="#f0c95f"/></linearGradient>
    <linearGradient id="goldh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a5a10"/><stop offset=".35" stop-color="#ffe9a0"/><stop offset=".7" stop-color="#c58f2a"/><stop offset="1" stop-color="#7a4e0c"/></linearGradient>
    <linearGradient id="onyx" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4d5262"/><stop offset="1" stop-color="#0a0b0f"/></linearGradient>
    <g id="capsule">
      <path d="M0 -5 H9 A5 5 0 0 1 9 5 H0 Z" fill="url(#onyx)" stroke="#07080b" stroke-width="1"/>
      <path d="M0 -5 H-9 A5 5 0 0 0 -9 5 H0 Z" fill="url(#gold)" stroke="#3a2406" stroke-width="1"/>
      <path d="M-11 -2.4 H8" stroke="#fff" stroke-opacity=".55" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>
  <g filter="url(#s)">
    <path d="M42 40 H82 V46 Q98 50 98 66 V100 Q98 108 90 108 H34 Q26 108 26 100 V66 Q26 50 42 46 Z" fill="url(#amber)" stroke="#2a0f02" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
  <path d="M33 66 Q33 56 42 52" stroke="#ffd59a" stroke-opacity=".55" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M32 72 V100" stroke="#ffd59a" stroke-opacity=".4" stroke-width="3" stroke-linecap="round"/>
  <!-- fluted cap -->
  <g filter="url(#s)"><rect x="38" y="20" width="48" height="22" rx="3" fill="url(#goldh)" stroke="#3a2406" stroke-width="1.4"/></g>
  <path d="M43 22 V40M48 22 V40M53 22 V40M58 22 V40M63 22 V40M68 22 V40M73 22 V40M78 22 V40M83 22 V40" stroke="#7a4e0c" stroke-width="1"/>
  <path d="M40 23 H84" stroke="#fff6cf" stroke-width="1"/>
  <!-- label -->
  <rect x="34" y="62" width="56" height="34" rx="2" fill="#0d0e12" stroke="url(#gold)" stroke-width="2"/>
  <rect x="38" y="66" width="48" height="26" rx="1" fill="none" stroke="#d9a73a" stroke-width=".7"/>
  <path d="M59 70 H65 V76 H71 V82 H65 V88 H59 V82 H53 V76 H59 Z" fill="url(#gold)" stroke="#5c3b08" stroke-width=".7"/>
  <path d="M44 79 C44 74 49 74 49 77M75 77 C75 74 80 74 80 79" fill="none" stroke="#e7b94a" stroke-width=".8" stroke-linecap="round"/>
  <!-- capsules -->
  <g filter="url(#s)">
    <use href="#capsule" transform="translate(106 92) rotate(-38)"/>
    <use href="#capsule" transform="translate(108 110) rotate(12)"/>
  </g>
</svg>
