<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Midnight Ops medicine: black rip-away trauma pouch, webbing straps, teal cross patch, paracord zip pulls. -->
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".65"/></filter>
    <linearGradient id="nylon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3e44"/><stop offset=".4" stop-color="#22252a"/><stop offset="1" stop-color="#0e0f11"/></linearGradient>
    <pattern id="weave" width="3" height="3" patternUnits="userSpaceOnUse"><path d="M0 0 L3 3M3 0 L0 3" stroke="#000" stroke-opacity=".25" stroke-width=".5"/></pattern>
    <linearGradient id="web" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c2f34"/><stop offset="1" stop-color="#141518"/></linearGradient>
  </defs>
  <!-- grab handle -->
  <path d="M52 30 Q64 12 76 30" fill="none" stroke="#060708" stroke-width="7" stroke-linecap="round"/>
  <path d="M52 30 Q64 12 76 30" fill="none" stroke="#2c2f34" stroke-width="4" stroke-linecap="round"/>
  <g filter="url(#s)" stroke="#060708" stroke-width="1.6" stroke-linejoin="round">
    <path d="M26 34 Q26 26 34 26 H94 Q102 26 102 34 V96 Q102 106 92 106 H36 Q26 106 26 96 Z" fill="url(#nylon)"/>
  </g>
  <path d="M26 34 Q26 26 34 26 H94 Q102 26 102 34 V96 Q102 106 92 106 H36 Q26 106 26 96 Z" fill="url(#weave)"/>
  <!-- zipper track -->
  <path d="M30 36 Q30 31 36 31 H92 Q98 31 98 36" fill="none" stroke="#060708" stroke-width="2.4"/>
  <path d="M30 36 Q30 31 36 31 H92 Q98 31 98 36" fill="none" stroke="#5d636b" stroke-width=".8" stroke-dasharray="1.2 1.2"/>
  <!-- paracord pulls -->
  <g stroke="#060708" stroke-width="1" stroke-linejoin="round">
    <rect x="31" y="29" width="5" height="7" rx="1" fill="#3a3e44"/>
    <rect x="92" y="29" width="5" height="7" rx="1" fill="#3a3e44"/>
  </g>
  <path d="M33.5 36 q-6 8 0 14 q4 2 2 -4" fill="none" stroke="#2f9c7c" stroke-width="2" stroke-linecap="round"/>
  <path d="M94.5 36 q6 8 0 14 q-4 2 -2 -4" fill="none" stroke="#2f9c7c" stroke-width="2" stroke-linecap="round"/>
  <!-- hook-and-loop cross patch -->
  <rect x="48" y="40" width="32" height="26" rx="3" fill="#1a1c1f" stroke="#060708" stroke-width="1.2"/>
  <path d="M60 44 H68 V49 H73 V57 H68 V62 H60 V57 H55 V49 H60 Z" fill="#4fd1a8" stroke="#0d2e26" stroke-width="1"/>
  <!-- webbing rows -->
  <g stroke="#060708" stroke-width="1.2">
    <rect x="26" y="74" width="76" height="9" fill="url(#web)"/>
    <rect x="26" y="88" width="76" height="9" fill="url(#web)"/>
  </g>
  <g stroke="#060708" stroke-width="1.6"><path d="M44 74 V83M64 74 V83M84 74 V83M44 88 V97M64 88 V97M84 88 V97"/></g>
  <path d="M30 28.5 H98" stroke="#8a929c" stroke-opacity=".3" stroke-width="1"/>
  <path d="M29 40 V96" stroke="#8a929c" stroke-opacity=".22" stroke-width="2" stroke-linecap="round"/>
</svg>
