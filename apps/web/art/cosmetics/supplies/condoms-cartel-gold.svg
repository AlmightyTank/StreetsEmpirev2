<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Cartel Gold condoms: a draped strip of three gold-foil packets with onyx borders, crown and ring emboss. -->
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".6"/></filter>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff8d2"/><stop offset=".35" stop-color="#e2b04a"/><stop offset=".6" stop-color="#9a6614"/><stop offset=".85" stop-color="#f5d684"/><stop offset="1" stop-color="#b47c1c"/></linearGradient>
    <radialGradient id="ring" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#fff3b8"/><stop offset=".7" stop-color="#d9a73a"/><stop offset="1" stop-color="#7c510e"/></radialGradient>
    <path id="crown" d="M-4 2 V-2 L-2 0 L0 -3 L2 0 L4 -2 V2 Z"/>
    <g id="packet">
      <rect x="-19" y="-19" width="38" height="38" rx="2" fill="#0d0e12" stroke="#07080b" stroke-width="1.4"/>
      <rect x="-15.5" y="-15.5" width="31" height="31" rx="1.5" fill="url(#foil)" stroke="#3a2406" stroke-width=".9"/>
      <rect x="-17.2" y="-17.2" width="34.4" height="34.4" rx="1.5" fill="none" stroke="#d9a73a" stroke-width="1.4" stroke-dasharray="1.2 1.2"/>
      <circle r="9" fill="url(#ring)" stroke="#5c3b08" stroke-width="1"/>
      <circle r="5.5" fill="none" stroke="#7a4e0c" stroke-width="1"/>
      <use href="#crown" transform="translate(10 -11) scale(.8)" fill="#5c3b08"/>
      <path d="M-12 -9 L-3 -13" stroke="#fffbe6" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </defs>
  <g filter="url(#s)">
    <use href="#packet" transform="translate(34 32) rotate(-14)"/>
    <use href="#packet" transform="translate(62 62) rotate(8)"/>
    <use href="#packet" transform="translate(92 94) rotate(-10)"/>
  </g>
  <!-- perforated joins -->
  <path d="M40 52 L52 42" stroke="#d9a73a" stroke-width="1.2" stroke-dasharray="1.6 1.6"/>
  <path d="M70 82 L82 76" stroke="#d9a73a" stroke-width="1.2" stroke-dasharray="1.6 1.6"/>
  <path d="M106 26 l1.6 -4.5 l1.6 4.5 l4.5 1.6 l-4.5 1.6 l-1.6 4.5 l-1.6 -4.5 l-4.5 -1.6 Z" fill="#fff3b8"/>
</svg>
