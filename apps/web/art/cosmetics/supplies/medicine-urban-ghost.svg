<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Urban Ghost medicine: concrete hard-shell kit with carry handle, twin latches, cross roundel and camo band. -->
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".6"/></filter>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfd3d7"/><stop offset=".5" stop-color="#9a9fa5"/><stop offset="1" stop-color="#5c6168"/></linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6eaee"/><stop offset="1" stop-color="#a9aeb3"/></linearGradient>
    <linearGradient id="graphite" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a8088"/><stop offset="1" stop-color="#2b2e33"/></linearGradient>
    <clipPath id="bandclip"><rect x="18" y="88" width="78" height="16"/></clipPath>
  </defs>
  <!-- handle -->
  <path d="M48 40 V30 Q48 26 52 26 H76 Q80 26 80 30 V40" fill="none" stroke="#16181b" stroke-width="7" stroke-linejoin="round"/>
  <path d="M48 40 V30 Q48 26 52 26 H76 Q80 26 80 30 V40" fill="none" stroke="url(#graphite)" stroke-width="4" stroke-linejoin="round"/>
  <g filter="url(#s)" stroke="#16181b" stroke-width="1.6" stroke-linejoin="round">
    <path d="M96 48 L110 36 V92 L96 104 Z" fill="#5c6168"/>
    <path d="M18 48 L32 36 H110 L96 48 Z" fill="url(#top)"/>
    <rect x="18" y="48" width="78" height="56" rx="3" fill="url(#front)"/>
  </g>
  <!-- camo band -->
  <g clip-path="url(#bandclip)">
    <rect x="18" y="88" width="78" height="16" fill="#8f949a"/>
    <path d="M16 86 L34 86 L30 106 L16 106 Z" fill="#3f4348"/>
    <path d="M42 86 L60 86 L64 106 L46 106 Z" fill="#c4c8cc"/>
    <path d="M70 86 L90 86 L94 106 L74 106 Z" fill="#5c6168"/>
  </g>
  <rect x="18" y="48" width="78" height="56" rx="3" fill="none" stroke="#16181b" stroke-width="1.6"/>
  <path d="M18 88 H96" stroke="#16181b" stroke-width="1.2"/>
  <!-- lid seam and latches -->
  <path d="M18 58 H96 L110 46" fill="none" stroke="#16181b" stroke-width="1.2"/>
  <g fill="url(#graphite)" stroke="#16181b" stroke-width="1"><rect x="28" y="54" width="10" height="9" rx="1.5"/><rect x="76" y="54" width="10" height="9" rx="1.5"/></g>
  <!-- cross roundel -->
  <circle cx="57" cy="73" r="12" fill="#f4f7fa" stroke="#16181b" stroke-width="1.4"/>
  <path d="M54 64 H60 V70 H66 V76 H60 V82 H54 V76 H48 V70 H54 Z" fill="#3f4348"/>
  <path d="M20 50.5 H94" stroke="#f2f8fd" stroke-opacity=".7" stroke-width="1"/>
  <path d="M22 38 L32 38.5" stroke="#fff" stroke-opacity=".5" stroke-width="1"/>
</svg>
