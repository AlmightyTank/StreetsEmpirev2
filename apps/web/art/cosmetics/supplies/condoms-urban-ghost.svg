<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Urban Ghost condoms: brushed steel pocket tin with camo lid flipped open, silver foils standing inside. -->
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".6"/></filter>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d3d7db"/><stop offset=".5" stop-color="#979ca2"/><stop offset="1" stop-color="#5c6168"/></linearGradient>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f7fa"/><stop offset=".5" stop-color="#a9b0b8"/><stop offset="1" stop-color="#d6dbe0"/></linearGradient>
    <clipPath id="lidclip"><path d="M30 60 L110 60 L114 22 L34 22 Z"/></clipPath>
  </defs>
  <g filter="url(#s)" stroke="#16181b" stroke-width="1.6" stroke-linejoin="round">
    <!-- open camo lid -->
    <path d="M30 60 L110 60 L114 22 L34 22 Z" fill="#8f949a"/>
  </g>
  <g clip-path="url(#lidclip)">
    <path d="M30 20 L56 20 L52 38 L30 40 Z" fill="#c4c8cc"/>
    <path d="M60 30 L84 26 L88 46 L62 48 Z" fill="#3f4348"/>
    <path d="M90 18 L116 20 L114 40 L94 36 Z" fill="#5c6168"/>
    <path d="M34 46 L56 44 L58 62 L32 62 Z" fill="#5c6168"/>
    <path d="M86 48 L112 46 L112 62 L90 62 Z" fill="#b2b6bb"/>
  </g>
  <path d="M30 60 L110 60 L114 22 L34 22 Z" fill="none" stroke="#16181b" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M36 25 H111" stroke="#f2f8fd" stroke-opacity=".6" stroke-width="1"/>
  <!-- foils standing in the tin -->
  <g filter="url(#s)" stroke="#5c6168" stroke-width="1.1">
    <rect x="34" y="50" width="22" height="24" rx="2" fill="url(#foil)" transform="rotate(-6 45 62)"/>
    <rect x="58" y="48" width="22" height="26" rx="2" fill="url(#foil)"/>
    <rect x="82" y="50" width="22" height="24" rx="2" fill="url(#foil)" transform="rotate(6 93 62)"/>
  </g>
  <g fill="none" stroke="#6b7077" stroke-width="1"><circle cx="45" cy="60" r="5"/><circle cx="69" cy="58" r="5"/><circle cx="93" cy="60" r="5"/></g>
  <!-- tin base -->
  <g filter="url(#s)" stroke="#16181b" stroke-width="1.6" stroke-linejoin="round">
    <path d="M100 74 L110 62 L110 88 L100 100 Z" fill="#5c6168"/>
    <path d="M18 74 H100 V100 H18 Z" fill="url(#steel)"/>
  </g>
  <path d="M18 74 L28 62 H110 L100 74 Z" fill="#3f4348" fill-opacity=".35"/>
  <path d="M20 77 H98" stroke="#f2f8fd" stroke-opacity=".75" stroke-width="1.2"/>
  <path d="M24 83 H94M24 88 H94M24 93 H94" stroke="#f2f8fd" stroke-opacity=".25" stroke-width=".8"/>
  <!-- stencil ghost on the tin -->
  <path d="M-6 5 V-1 A6 6 0 0 1 6 -1 V5 L4 3.2 L2 5 L0 3.2 L-2 5 L-4 3.2 Z" transform="translate(59 87)" fill="none" stroke="#3f4348" stroke-width="1.4"/>
</svg>
