<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Urban Ghost crack: brushed concrete tin, camo lid propped open, rocks packed inside. -->
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".6"/></filter>
    <linearGradient id="tin" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6b7077"/><stop offset=".3" stop-color="#d3d7db"/><stop offset=".6" stop-color="#9a9fa5"/><stop offset="1" stop-color="#5c6168"/></linearGradient>
    <linearGradient id="inside" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2e33"/><stop offset="1" stop-color="#4c5158"/></linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#e4dcc6"/><stop offset="1" stop-color="#a59a7e"/></linearGradient>
    <clipPath id="lidclip"><ellipse cx="0" cy="0" rx="34" ry="20"/></clipPath>
    <clipPath id="openclip"><ellipse cx="64" cy="72" rx="32" ry="11"/></clipPath>
  </defs>
  <!-- propped lid behind the tin -->
  <g transform="translate(58 44) rotate(-14)" filter="url(#s)">
    <ellipse rx="36" ry="22" fill="#4c5158" stroke="#16181b" stroke-width="1.6"/>
    <g clip-path="url(#lidclip)">
      <ellipse rx="34" ry="20" fill="#8f949a"/>
      <path d="M-36 -22 L-10 -20 L-14 -4 L-36 -2 Z" fill="#c4c8cc"/>
      <path d="M-4 -14 L20 -18 L24 0 L0 4 Z" fill="#3f4348"/>
      <path d="M-30 4 L-8 2 L-6 22 L-30 22 Z" fill="#5c6168"/>
      <path d="M8 6 L36 2 L36 22 L12 22 Z" fill="#b2b6bb"/>
    </g>
    <ellipse rx="34" ry="20" fill="none" stroke="#e8eef3" stroke-opacity=".6" stroke-width="1"/>
    <ellipse rx="27" ry="15" fill="none" stroke="#16181b" stroke-opacity=".45" stroke-width="1"/>
  </g>
  <!-- tin body -->
  <g filter="url(#s)" stroke="#16181b" stroke-width="1.6" stroke-linejoin="round">
    <path d="M30 72 V94 A34 12 0 0 0 98 94 V72 Z" fill="url(#tin)"/>
    <ellipse cx="64" cy="72" rx="34" ry="12" fill="#c9cdd1"/>
  </g>
  <ellipse cx="64" cy="72" rx="32" ry="11" fill="url(#inside)"/>
  <g clip-path="url(#openclip)" stroke="#6e6450" stroke-width="1.1" stroke-linejoin="round">
    <path d="M36 74 L44 66 L54 70 L54 80 L42 82 Z" fill="url(#rock)"/>
    <path d="M52 68 L64 62 L74 68 L72 78 L58 80 Z" fill="url(#rock)"/>
    <path d="M70 72 L82 64 L94 70 L92 82 L76 82 Z" fill="url(#rock)"/>
    <path d="M58 76 L68 74 L72 84 L60 86 Z" fill="url(#rock)"/>
  </g>
  <!-- rolled rim and cold highlights -->
  <ellipse cx="64" cy="72" rx="33" ry="11.5" fill="none" stroke="#f2f8fd" stroke-opacity=".7" stroke-width="1"/>
  <path d="M38 80 V96" stroke="#f2f8fd" stroke-opacity=".7" stroke-width="2" stroke-linecap="round"/>
  <path d="M31 88 A34 12 0 0 0 97 88" fill="none" stroke="#16181b" stroke-opacity=".5" stroke-width="1"/>
  <path d="M46 66 L50 68M66 64 L70 63" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
</svg>
