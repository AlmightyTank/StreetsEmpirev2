<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Cartel Gold crack: black lacquer jewel case, gold trim and clasp, rocks on red velvet. -->
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".6"/></filter>
    <linearGradient id="lacquer" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4d5262"/><stop offset=".35" stop-color="#1b1e27"/><stop offset="1" stop-color="#08090c"/></linearGradient>
    <linearGradient id="velvet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b5203a"/><stop offset="1" stop-color="#4a0614"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3b8"/><stop offset=".35" stop-color="#e7b94a"/><stop offset=".7" stop-color="#9a6614"/><stop offset="1" stop-color="#f0c95f"/></linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset=".6" stop-color="#ecdcb4"/><stop offset="1" stop-color="#b09461"/></linearGradient>
  </defs>
  <g filter="url(#s)" stroke="#07080b" stroke-width="1.6" stroke-linejoin="round">
    <!-- open lid -->
    <path d="M30 62 L108 62 L112 20 L34 20 Z" fill="url(#lacquer)"/>
    <path d="M37 58 L104 58 L107 25 L39 25 Z" fill="url(#velvet)" stroke-width="1.1"/>
    <!-- base -->
    <path d="M100 76 L112 62 L112 88 L100 102 Z" fill="#14161c"/>
    <path d="M18 76 H100 V102 H18 Z" fill="url(#lacquer)"/>
    <path d="M18 76 L30 62 H112 L100 76 Z" fill="url(#velvet)"/>
  </g>
  <!-- rocks resting on the velvet -->
  <g filter="url(#s)" stroke="#6e5a33" stroke-width="1.1" stroke-linejoin="round">
    <path d="M34 72 L42 62 L54 64 L56 74 L44 78 Z" fill="url(#rock)"/>
    <path d="M54 70 L64 58 L78 62 L78 74 L62 78 Z" fill="url(#rock)"/>
    <path d="M76 70 L86 60 L98 64 L96 74 L82 76 Z" fill="url(#rock)"/>
  </g>
  <!-- gold trim, hinge line and clasp -->
  <g fill="none" stroke="url(#gold)" stroke-width="1.6" stroke-linejoin="round">
    <path d="M18 76 H100 L112 62"/>
    <path d="M18 101 H100 L112 87"/>
    <path d="M30 62 L34 20 H112 L108 62"/>
  </g>
  <path d="M22 80 H96 M22 97 H96" stroke="#d9a73a" stroke-opacity=".7" stroke-width=".7"/>
  <path d="M54 76 H64 V84 Q59 88 54 84 Z" fill="url(#gold)" stroke="#5c3b08" stroke-width=".8"/>
  <circle cx="59" cy="80.5" r="1.4" fill="#5c3b08"/>
  <!-- velvet pleats and lacquer gloss -->
  <path d="M50 27 L48 56M72 26 L71 56M94 26 L95 56" stroke="#e45a72" stroke-opacity=".35" stroke-width="1.2"/>
  <path d="M38 23 H106" stroke="#c5cbe0" stroke-opacity=".5" stroke-width="1"/>
  <path d="M22 79 L40 79" stroke="#c5cbe0" stroke-opacity=".5" stroke-width="1"/>
  <path d="M46 64 L50 66M66 61 L70 62M88 62 L91 63" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M84 40 l1.5 -4 l1.5 4 l4 1.5 l-4 1.5 l-1.5 4 l-1.5 -4 l-4 -1.5 Z" fill="#fff3b8"/>
</svg>
