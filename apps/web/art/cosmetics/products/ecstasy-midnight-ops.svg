<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Midnight Ops ecstasy: black-card blister pack of charcoal pills with teal chevron stamps, one bubble popped. -->
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".65"/></filter>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3e44"/><stop offset=".4" stop-color="#1e2024"/><stop offset="1" stop-color="#0e0f11"/></linearGradient>
    <radialGradient id="pill" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#5a6068"/><stop offset=".6" stop-color="#2a2d32"/><stop offset="1" stop-color="#111214"/></radialGradient>
    <radialGradient id="dome" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffffff" stop-opacity=".45"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".08"/><stop offset="1" stop-color="#ffffff" stop-opacity=".2"/></radialGradient>
    <g id="cell">
      <circle r="11.5" fill="url(#pill)" stroke="#060708" stroke-width="1.2"/>
      <path d="M-5 2 L0 -3 L5 2" fill="none" stroke="#4fd1a8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle r="13" fill="url(#dome)" stroke="#c7ced6" stroke-opacity=".5" stroke-width="1"/>
      <path d="M-7 -7 A10 10 0 0 1 2 -10" stroke="#fff" stroke-opacity=".6" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </g>
  </defs>
  <g transform="rotate(-9 64 64)">
    <g filter="url(#s)">
      <rect x="28" y="16" width="72" height="98" rx="5" fill="url(#card)" stroke="#060708" stroke-width="1.6"/>
    </g>
    <rect x="28" y="16" width="5" height="98" fill="#4fd1a8"/>
    <rect x="28" y="16" width="72" height="98" rx="5" fill="none" stroke="#060708" stroke-width="1.6"/>
    <!-- perforations -->
    <path d="M64 20 V110M34 49 H98M34 81 H98" stroke="#5d636b" stroke-width="1" stroke-dasharray="2 2"/>
    <use href="#cell" transform="translate(49 34)"/>
    <use href="#cell" transform="translate(81 34)"/>
    <use href="#cell" transform="translate(49 65)"/>
    <use href="#cell" transform="translate(49 97)"/>
    <use href="#cell" transform="translate(81 97)"/>
    <!-- popped bubble with torn foil -->
    <circle cx="81" cy="65" r="11.5" fill="#0a0b0d"/>
    <path d="M71 62 L74 58 L77 62 L80 56 L83 61 L87 57 L89 63 L91 66 L86 70 L88 74 L82 72 L77 75 L75 70 L70 69 Z" fill="#9aa3ad" stroke="#3a3e44" stroke-width=".8"/>
    <path d="M73 63 L80 60 L86 63" stroke="#e8eef3" stroke-opacity=".7" stroke-width=".8" fill="none"/>
    <path d="M32 20 H96" stroke="#8a929c" stroke-opacity=".35" stroke-width="1"/>
  </g>
</svg>
