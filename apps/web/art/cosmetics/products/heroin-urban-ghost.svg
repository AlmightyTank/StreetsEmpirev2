<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Urban Ghost heroin: three knotted latex balloons in concrete, graphite and pale camo. -->
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".6"/></filter>
    <radialGradient id="concrete" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#e6eaee"/><stop offset=".55" stop-color="#9a9fa5"/><stop offset="1" stop-color="#5c6168"/></radialGradient>
    <radialGradient id="graphite" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#8a9098"/><stop offset=".55" stop-color="#4c5158"/><stop offset="1" stop-color="#25282d"/></radialGradient>
    <radialGradient id="pale" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#f4f7fa"/><stop offset=".6" stop-color="#c4c8cc"/><stop offset="1" stop-color="#8f949a"/></radialGradient>
    <path id="balloon" d="M0 -20 C12 -20 18 -10 17 0 C16 10 8 16 2 17 L3 21 L-3 21 L-2 17 C-8 16 -16 10 -17 0 C-18 -10 -12 -20 0 -20 Z"/>
    <clipPath id="camoclip"><use href="#balloon" transform="translate(88 70) rotate(18)"/></clipPath>
  </defs>
  <g filter="url(#s)" stroke="#16181b" stroke-width="1.4" stroke-linejoin="round">
    <use href="#balloon" transform="translate(42 62) rotate(-22)" fill="url(#graphite)"/>
    <use href="#balloon" transform="translate(88 70) rotate(18)" fill="url(#pale)"/>
  </g>
  <g clip-path="url(#camoclip)">
    <path d="M68 48 L88 46 L84 62 L66 64 Z" fill="#5c6168" opacity=".75"/>
    <path d="M90 62 L110 60 L108 78 L92 76 Z" fill="#3f4348" opacity=".7"/>
    <path d="M70 76 L88 74 L90 94 L72 92 Z" fill="#8f949a" opacity=".8"/>
  </g>
  <!-- back knot tails tuck behind the front balloon -->
  <g fill="none" stroke="#16181b" stroke-width="2.2" stroke-linecap="round">
    <path d="M50 82 q5 4 2 9 q-3 4 2 8"/>
    <path d="M81 91 q-6 2 -6 8"/>
  </g>
  <g filter="url(#s)" stroke="#16181b" stroke-width="1.4" stroke-linejoin="round">
    <use href="#balloon" transform="translate(62 92) rotate(-4)" fill="url(#concrete)"/>
  </g>
  <path d="M63 114 q-6 3 -12 0" fill="none" stroke="#16181b" stroke-width="2.2" stroke-linecap="round"/>
  <!-- latex sheen -->
  <g fill="none" stroke="#fff" stroke-linecap="round">
    <path d="M30 52 Q32 44 40 42" stroke-opacity=".45" stroke-width="2.4"/>
    <path d="M82 54 Q88 50 94 52" stroke-opacity=".7" stroke-width="2.4"/>
    <path d="M50 82 Q52 74 60 72" stroke-opacity=".7" stroke-width="2.6"/>
  </g>
</svg>
