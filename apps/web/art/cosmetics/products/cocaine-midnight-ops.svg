<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Midnight Ops cocaine: vacuum-sealed matte black brick, teal strapping tape, stencil stamp and code bars. -->
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".65"/></filter>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a4f56"/><stop offset="1" stop-color="#202226"/></linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2d32"/><stop offset="1" stop-color="#0e0f11"/></linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1e21"/><stop offset="1" stop-color="#08090a"/></linearGradient>
    <linearGradient id="tape" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fe8c8"/><stop offset="1" stop-color="#2f9c7c"/></linearGradient>
    <clipPath id="frontclip"><path d="M14 58 L84 76 V108 L14 90 Z"/></clipPath>
    <clipPath id="topclip"><path d="M14 58 L48 40 L116 56 L84 76 Z"/></clipPath>
  </defs>
  <g filter="url(#s)" stroke="#060708" stroke-width="1.6" stroke-linejoin="round">
    <path d="M14 58 L84 76 V108 L14 90 Z" fill="url(#front)"/>
    <path d="M84 76 L116 56 V86 L84 108 Z" fill="url(#side)"/>
    <path d="M14 58 L48 40 L116 56 L84 76 Z" fill="url(#top)"/>
  </g>
  <!-- strapping tape -->
  <g clip-path="url(#topclip)"><path d="M54 40 L70 44 L44 72 L28 68 Z" fill="url(#tape)"/></g>
  <g clip-path="url(#frontclip)"><path d="M28 60 L44 64 V102 L28 98 Z" fill="url(#tape)"/></g>
  <path d="M84 76 L116 56" stroke="#060708" stroke-width="1.2"/>
  <!-- vacuum wrinkles -->
  <g fill="none" stroke="#7d858f" stroke-opacity=".35" stroke-width="1.1" stroke-linecap="round">
    <path d="M58 52 Q70 50 82 56M76 46 Q90 48 100 54M22 60 Q34 58 44 50"/>
    <path d="M52 76 Q58 86 54 98M66 82 Q70 90 68 100"/>
    <path d="M92 76 Q98 72 106 70M90 92 Q98 86 108 82"/>
  </g>
  <!-- stencil stamp and code bars -->
  <g transform="translate(52 80) skewY(14)" fill="none" stroke="#4fd1a8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <rect width="18" height="14" rx="1"/>
    <path d="M5 4 L9 9 L14 2"/>
  </g>
  <g fill="#4fd1a8" transform="translate(92 84) skewY(-32)"><rect width="2" height="9"/><rect x="4" width="1" height="9"/><rect x="7" width="3" height="9"/><rect x="12" width="1" height="9"/><rect x="15" width="2" height="9"/></g>
  <path d="M18 58 L48 42 L112 57" stroke="#8a929c" stroke-opacity=".45" stroke-width="1" fill="none"/>
</svg>
