<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Urban Ghost cocaine: camo-wrapped brick in silver duct tape, ghost stamp, lines cut on a concrete slab. -->
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".6"/></filter>
    <linearGradient id="duct" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef2f5"/><stop offset=".5" stop-color="#aab1b9"/><stop offset="1" stop-color="#6e757d"/></linearGradient>
    <linearGradient id="slab" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a9fa5"/><stop offset="1" stop-color="#4c5158"/></linearGradient>
    <clipPath id="frontclip"><path d="M20 44 L76 58 V82 L20 68 Z"/></clipPath>
    <clipPath id="topclip"><path d="M20 44 L48 30 L104 42 L76 58 Z"/></clipPath>
    <path id="ghost" d="M-6 5 V-1 A6 6 0 0 1 6 -1 V5 L4 3.2 L2 5 L0 3.2 L-2 5 L-4 3.2 Z"/>
  </defs>
  <!-- concrete slab with lines -->
  <g filter="url(#s)"><path d="M22 96 L92 80 L112 98 L42 116 Z" fill="url(#slab)" stroke="#16181b" stroke-width="1.6" stroke-linejoin="round"/></g>
  <g stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"><path d="M40 104 L64 98M50 110 L78 103M66 93 L86 88"/></g>
  <g fill="#3f4348" fill-opacity=".5"><circle cx="30" cy="100" r="1.4"/><circle cx="100" cy="98" r="1.2"/><circle cx="84" cy="106" r="1.5"/></g>
  <path d="M86 98 L104 94 L106 97 L88 101 Z" fill="#d3d7db" stroke="#16181b" stroke-width="1"/>
  <!-- brick -->
  <g filter="url(#s)" stroke="#16181b" stroke-width="1.6" stroke-linejoin="round">
    <path d="M20 44 L76 58 V82 L20 68 Z" fill="#8f949a"/>
    <path d="M76 58 L104 42 V66 L76 82 Z" fill="#5c6168"/>
    <path d="M20 44 L48 30 L104 42 L76 58 Z" fill="#b2b6bb"/>
  </g>
  <g clip-path="url(#frontclip)">
    <path d="M16 44 L36 48 L32 62 L16 60 Z" fill="#3f4348"/>
    <path d="M44 52 L64 54 L66 72 L46 70 Z" fill="#c4c8cc"/>
    <path d="M62 58 L80 62 L80 84 L66 80 Z" fill="#5c6168"/>
  </g>
  <g clip-path="url(#topclip)">
    <path d="M20 44 L40 34 L52 40 L32 50 Z" fill="#6b7077"/>
    <path d="M60 36 L84 40 L74 50 L54 46 Z" fill="#3f4348"/>
    <path d="M78 48 L104 42 L96 56 L80 56 Z" fill="#c4c8cc"/>
  </g>
  <!-- duct tape wrap -->
  <g clip-path="url(#topclip)"><path d="M54 30 L66 33 L38 58 L26 55 Z" fill="url(#duct)"/></g>
  <g clip-path="url(#frontclip)"><path d="M26 44 L38 47 V74 L26 71 Z" fill="url(#duct)"/></g>
  <path d="M26 55 L38 58M26 71 L38 74" stroke="#16181b" stroke-width=".8"/>
  <path d="M76 58 L104 42" stroke="#16181b" stroke-width="1.2"/>
  <!-- ghost stamp -->
  <use href="#ghost" transform="translate(58 70) skewY(14)" fill="none" stroke="#f2f8fd" stroke-width="1.4"/>
  <path d="M24 44 L48 32 L100 43" stroke="#f2f8fd" stroke-opacity=".6" stroke-width="1" fill="none"/>
</svg>
