<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Cartel Gold ecstasy: engraved lacquer pill compact, open on velvet, gold-foiled pills with crown stamps. -->
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".6"/></filter>
    <linearGradient id="lacquer" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4d5262"/><stop offset=".35" stop-color="#1b1e27"/><stop offset="1" stop-color="#08090c"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3b8"/><stop offset=".35" stop-color="#e7b94a"/><stop offset=".7" stop-color="#9a6614"/><stop offset="1" stop-color="#f0c95f"/></linearGradient>
    <radialGradient id="foil" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#fff8d2"/><stop offset=".5" stop-color="#e2b04a"/><stop offset="1" stop-color="#8a5a10"/></radialGradient>
    <radialGradient id="velvet" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#2a2f3e"/><stop offset="1" stop-color="#0a0b10"/></radialGradient>
    <path id="crown" d="M-4 2 V-2 L-2 0 L0 -3 L2 0 L4 -2 V2 Z"/>
    <g id="pill">
      <ellipse rx="10" ry="6.5" fill="url(#foil)" stroke="#5c3b08" stroke-width="1"/>
      <use href="#crown" fill="#8a5a10"/>
      <path d="M-6 -3 Q-2 -5.5 3 -5" stroke="#fff8d2" stroke-width="1" fill="none" stroke-linecap="round"/>
    </g>
  </defs>
  <!-- lid, hinged open behind -->
  <g filter="url(#s)">
    <ellipse cx="64" cy="44" rx="40" ry="26" fill="url(#lacquer)" stroke="url(#gold)" stroke-width="3"/>
  </g>
  <ellipse cx="64" cy="44" rx="31" ry="19" fill="none" stroke="#d9a73a" stroke-width=".8"/>
  <g fill="none" stroke="#f2cd6a" stroke-width=".9" stroke-linecap="round">
    <path d="M44 48 C44 36 56 36 56 42 C56 46 51 46 51 43"/>
    <path d="M60 36 C64 50 74 50 76 42 C77 38 73 37 72 41"/>
    <path d="M80 50 C82 44 86 42 86 36"/>
  </g>
  <path d="M38 34 Q56 22 82 26" stroke="#c5cbe0" stroke-opacity=".5" stroke-width="1.2" fill="none"/>
  <!-- hinge -->
  <rect x="56" y="66" width="16" height="6" rx="2" fill="url(#gold)" stroke="#3a2406" stroke-width=".8"/>
  <!-- base with velvet bed -->
  <g filter="url(#s)">
    <path d="M24 84 V92 A40 18 0 0 0 104 92 V84 Z" fill="url(#lacquer)" stroke="#07080b" stroke-width="1.6"/>
    <ellipse cx="64" cy="84" rx="40" ry="18" fill="url(#gold)" stroke="#3a2406" stroke-width="1.2"/>
  </g>
  <ellipse cx="64" cy="84" rx="35" ry="14.5" fill="url(#velvet)"/>
  <path d="M25 92 A40 18 0 0 0 103 92" fill="none" stroke="#e7b94a" stroke-width="1"/>
  <use href="#pill" transform="translate(48 82) rotate(-10)"/>
  <use href="#pill" transform="translate(74 78) rotate(14)"/>
  <use href="#pill" transform="translate(66 92) rotate(-4)"/>
  <!-- loose pill in front -->
  <g filter="url(#s)"><use href="#pill" transform="translate(102 108) rotate(20)"/></g>
  <path d="M100 18 l1.5 -4 l1.5 4 l4 1.5 l-4 1.5 l-1.5 4 l-1.5 -4 l-4 -1.5 Z" fill="#fff3b8"/>
</svg>
