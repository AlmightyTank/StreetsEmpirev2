<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Midnight Ops heroin: fanned bundle of black glassine packets, teal reticle stamp, banded together. -->
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".65"/></filter>
    <linearGradient id="glassine" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#44484f"/><stop offset=".35" stop-color="#1f2125"/><stop offset=".7" stop-color="#2c2f34"/><stop offset="1" stop-color="#0e0f11"/></linearGradient>
    <g id="packet">
      <rect x="-20" y="-26" width="40" height="52" rx="1.5" fill="url(#glassine)" stroke="#060708" stroke-width="1.4"/>
      <path d="M-20 -16 H20" stroke="#060708" stroke-width="1.2"/>
      <path d="M-20 -15 H20" stroke="#6b727b" stroke-opacity=".4" stroke-width=".7"/>
      <path d="M-15 -22 L-6 4" stroke="#fff" stroke-opacity=".12" stroke-width="4" stroke-linecap="round"/>
    </g>
  </defs>
  <g filter="url(#s)">
    <use href="#packet" transform="translate(44 66) rotate(-18)"/>
    <use href="#packet" transform="translate(84 66) rotate(16)"/>
    <use href="#packet" transform="translate(64 62) rotate(-2)"/>
  </g>
  <!-- reticle stamp on the top packet -->
  <g transform="translate(64 68) rotate(-2)" fill="none" stroke="#4fd1a8" stroke-width="1.6">
    <circle r="9"/>
    <circle r="3"/>
    <path d="M0 -13 V-6M0 6 V13M-13 0 H-6M6 0 H13" stroke-linecap="round"/>
  </g>
  <!-- rubber band -->
  <g filter="url(#s)">
    <path d="M22 84 Q64 74 106 84 L105 90 Q64 80 23 90 Z" fill="#15171a" stroke="#060708" stroke-width="1.2"/>
  </g>
  <path d="M26 85.6 Q64 76 102 85.6" stroke="#4fd1a8" stroke-width="1.2" fill="none"/>
  <path d="M48 42 H80" stroke="#8a929c" stroke-opacity=".35" stroke-width="1" transform="rotate(-2 64 62)"/>
</svg>
