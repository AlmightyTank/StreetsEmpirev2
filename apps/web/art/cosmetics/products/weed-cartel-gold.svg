<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Cartel Gold weed: glass apothecary jar of top-shelf buds, fluted gold lid, black-and-gold leaf medallion. -->
  <defs>
    <g id="budA">
      <path d="M-2 -15 L1 -24 L4 -14 Z" fill="#3f7a2a" stroke="#173d10" stroke-width=".9"/>
      <path d="M7 -6 L16 -11 L14 -7 L19 -7 L14 -3 L17 0 L9 -1 Z" fill="#3f7a2a" stroke="#173d10" stroke-width=".9"/>
      <path d="M-7 4 L-17 1 L-13 -1 L-17 -5 L-11 -4 L-11 -8 L-6 -2 Z" fill="#3f7a2a" stroke="#173d10" stroke-width=".9"/>
      <g fill="url(#budg)" stroke="#173d10" stroke-width="1">
        <circle cx="0" cy="12" r="5.5"/><circle cx="-5" cy="6" r="6.5"/><circle cx="5.5" cy="6" r="6"/>
        <circle cx="-5.5" cy="-3" r="6.5"/><circle cx="5.5" cy="-3" r="6.5"/><circle cx="0" cy="-11" r="6"/>
      </g>
      <g fill="none" stroke="#e58a2e" stroke-width=".9" stroke-linecap="round"><path d="M-2 -13 q2 -3 4 0M3 -4 q3 -2 4 1M-8 -4 q-1 -3 2 -4M-3 6 q2 -3 4 -1M2 12 q3 1 2 4M6 5 q2 -2 3 1"/></g>
      <g fill="#f4fbec" fill-opacity=".85"><circle cx="-4" cy="-6" r=".7"/><circle cx="2" cy="-12" r=".6"/><circle cx="7" cy="-1" r=".7"/><circle cx="-7" cy="5" r=".6"/><circle cx="1" cy="10" r=".6"/><circle cx="4" cy="4" r=".6"/></g>
    </g>
    <g id="budB">
      <path d="M-2 -15 L1 -24 L4 -14 Z" fill="#4a3a6a" stroke="#1a0f28" stroke-width=".9"/>
      <path d="M7 -6 L16 -11 L14 -7 L19 -7 L14 -3 L17 0 L9 -1 Z" fill="#4a3a6a" stroke="#1a0f28" stroke-width=".9"/>
      <path d="M-7 4 L-17 1 L-13 -1 L-17 -5 L-11 -4 L-11 -8 L-6 -2 Z" fill="#4a3a6a" stroke="#1a0f28" stroke-width=".9"/>
      <g fill="url(#budp)" stroke="#1a0f28" stroke-width="1">
        <circle cx="0" cy="12" r="5.5"/><circle cx="-5" cy="6" r="6.5"/><circle cx="5.5" cy="6" r="6"/>
        <circle cx="-5.5" cy="-3" r="6.5"/><circle cx="5.5" cy="-3" r="6.5"/><circle cx="0" cy="-11" r="6"/>
      </g>
      <g fill="none" stroke="#e58a2e" stroke-width=".9" stroke-linecap="round"><path d="M-2 -13 q2 -3 4 0M3 -4 q3 -2 4 1M-8 -4 q-1 -3 2 -4M-3 6 q2 -3 4 -1M2 12 q3 1 2 4M6 5 q2 -2 3 1"/></g>
      <g fill="#f4fbec" fill-opacity=".85"><circle cx="-4" cy="-6" r=".7"/><circle cx="2" cy="-12" r=".6"/><circle cx="7" cy="-1" r=".7"/><circle cx="-7" cy="5" r=".6"/><circle cx="1" cy="10" r=".6"/><circle cx="4" cy="4" r=".6"/></g>
    </g>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".6"/></filter>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3b8"/><stop offset=".35" stop-color="#e7b94a"/><stop offset=".7" stop-color="#9a6614"/><stop offset="1" stop-color="#f0c95f"/></linearGradient>
    <radialGradient id="medal" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#fff5c4"/><stop offset=".6" stop-color="#d9a73a"/><stop offset="1" stop-color="#7c510e"/></radialGradient>
    <radialGradient id="budg" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#b6e08c"/><stop offset=".55" stop-color="#5f9a3a"/><stop offset="1" stop-color="#2c4f1a"/></radialGradient>
    <radialGradient id="budp" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#c7a3e0"/><stop offset=".55" stop-color="#6a4a8a"/><stop offset="1" stop-color="#2f1f44"/></radialGradient>
    <clipPath id="jarclip"><rect x="30" y="40" width="68" height="68" rx="13"/></clipPath>
    <path id="leaflet" d="M0 0 C2 -4 3 -9 0 -16 C-3 -9 -2 -4 0 0 Z"/>
  </defs>
  <g filter="url(#s)">
    <rect x="30" y="40" width="68" height="68" rx="13" fill="#1a2418" fill-opacity=".55" stroke="#0a0b0d" stroke-width="1.6"/>
  </g>
  <!-- buds inside the glass -->
  <g clip-path="url(#jarclip)">
    <use href="#budA" transform="translate(44 96) rotate(-20) scale(1.05)"/>
    <use href="#budB" transform="translate(76 98) rotate(70) scale(1.1)"/>
    <use href="#budA" transform="translate(90 80) rotate(20)"/>
    <use href="#budB" transform="translate(48 70) rotate(-60) scale(.95)"/>
    <use href="#budA" transform="translate(68 76) rotate(100)"/>
  </g>
  <!-- glass reflections -->
  <rect x="30" y="40" width="68" height="68" rx="13" fill="none" stroke="#e8f4e0" stroke-opacity=".75" stroke-width="1.4"/>
  <path d="M37 52 V96" stroke="#fff" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
  <path d="M91 50 V60" stroke="#fff" stroke-opacity=".35" stroke-width="2" stroke-linecap="round"/>
  <!-- fluted gold lid -->
  <g filter="url(#s)" stroke="#3a2406" stroke-width="1.4">
    <rect x="34" y="26" width="60" height="16" rx="3" fill="url(#gold)"/>
    <rect x="40" y="18" width="48" height="9" rx="3" fill="url(#gold)"/>
  </g>
  <path d="M40 28 V40M46 28 V40M52 28 V40M58 28 V40M64 28 V40M70 28 V40M76 28 V40M82 28 V40M88 28 V40" stroke="#8a5a10" stroke-width="1.1"/>
  <path d="M42 20 H86" stroke="#fff6cf" stroke-width="1"/>
  <!-- medallion label -->
  <ellipse cx="64" cy="66" rx="19" ry="14" fill="#0d0e12" stroke="url(#gold)" stroke-width="2"/>
  <ellipse cx="64" cy="66" rx="15.5" ry="10.5" fill="none" stroke="#d9a73a" stroke-width=".7"/>
  <g transform="translate(64 74)" fill="url(#medal)" stroke="#5c3b08" stroke-width=".5">
    <use href="#leaflet"/>
    <use href="#leaflet" transform="rotate(-36) scale(.8)"/>
    <use href="#leaflet" transform="rotate(36) scale(.8)"/>
    <use href="#leaflet" transform="rotate(-70) scale(.55)"/>
    <use href="#leaflet" transform="rotate(70) scale(.55)"/>
  </g>
</svg>
