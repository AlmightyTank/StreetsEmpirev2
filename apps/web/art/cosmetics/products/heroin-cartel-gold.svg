<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Cartel Gold heroin: black envelope sealed with a gold wax crest, ornate engraved gold spoon across it. -->
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".6"/></filter>
    <linearGradient id="env" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3f4e"/><stop offset=".5" stop-color="#1b1e27"/><stop offset="1" stop-color="#0a0b0f"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3b8"/><stop offset=".35" stop-color="#e7b94a"/><stop offset=".7" stop-color="#9a6614"/><stop offset="1" stop-color="#f0c95f"/></linearGradient>
    <linearGradient id="goldh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a5a10"/><stop offset=".35" stop-color="#ffe9a0"/><stop offset=".7" stop-color="#c58f2a"/><stop offset="1" stop-color="#7a4e0c"/></linearGradient>
    <radialGradient id="wax" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#ffe9a0"/><stop offset=".6" stop-color="#c58f2a"/><stop offset="1" stop-color="#6a430a"/></radialGradient>
    <radialGradient id="tar" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#8a5a2a"/><stop offset=".6" stop-color="#4a2a10"/><stop offset="1" stop-color="#1e0f05"/></radialGradient>
  </defs>
  <!-- envelope -->
  <g transform="rotate(-8 56 54)">
    <g filter="url(#s)">
      <rect x="16" y="26" width="76" height="54" rx="2" fill="url(#env)" stroke="#07080b" stroke-width="1.6"/>
    </g>
    <path d="M16 28 L54 58 L92 28" fill="none" stroke="#07080b" stroke-width="1.4"/>
    <path d="M17 29 L54 57 L91 29" fill="none" stroke="#e7b94a" stroke-width=".9"/>
    <rect x="19" y="29" width="70" height="48" rx="1" fill="none" stroke="#d9a73a" stroke-opacity=".7" stroke-width=".7"/>
    <!-- wax seal -->
    <path d="M54 48 l4 1 l3 -2 l2 4 l4 1 l-1 4 l2 3 l-4 2 l-1 4 l-4 -1 l-3 2 l-2 -4 l-4 -1 l1 -4 l-2 -3 l4 -2 Z" transform="translate(-6 -2)" fill="url(#wax)" stroke="#5c3b08" stroke-width=".8"/>
    <circle cx="54" cy="57" r="5" fill="none" stroke="#7a4e0c" stroke-width=".9"/>
    <path d="M51 59 V55.5 L52.5 57 L54 54.5 L55.5 57 L57 55.5 V59 Z" fill="#7a4e0c"/>
  </g>
  <!-- ornate gold spoon -->
  <g transform="translate(70 86) rotate(-28)" filter="url(#s)">
    <path d="M-6 -3 L40 -2.2 Q46 -4 48 0 Q46 4 40 2.2 L-6 3 Z" fill="url(#goldh)" stroke="#3a2406" stroke-width="1.1" stroke-linejoin="round"/>
    <ellipse cx="-20" cy="0" rx="18" ry="12" fill="url(#gold)" stroke="#3a2406" stroke-width="1.2"/>
    <ellipse cx="-20" cy="0" rx="13" ry="8" fill="url(#tar)" stroke="#7a4e0c" stroke-width=".8"/>
    <path d="M-28 -4 Q-22 -7 -14 -5" stroke="#d9a76a" stroke-opacity=".7" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <circle cx="44" cy="0" r="3" fill="url(#wax)" stroke="#3a2406" stroke-width=".8"/>
    <path d="M6 0 C10 -3 14 3 18 0 C22 -3 26 3 30 0 C34 -3 36 1 38 0" fill="none" stroke="#7a4e0c" stroke-width=".8"/>
    <path d="M-34 -6 Q-28 -11 -18 -11" stroke="#fff6cf" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  </g>
  <path d="M104 26 l1.5 -4 l1.5 4 l4 1.5 l-4 1.5 l-1.5 4 l-1.5 -4 l-4 -1.5 Z" fill="#fff3b8"/>
</svg>
