<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Midnight Ops weed: smell-proof black zip pouch with one-way valve and teal leaf stencil, buds in front. -->
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".65"/></filter>
    <linearGradient id="pouch" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#17181b"/><stop offset=".3" stop-color="#34383d"/><stop offset=".6" stop-color="#1c1e21"/><stop offset="1" stop-color="#101113"/></linearGradient>
    <radialGradient id="budg" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#a9d982"/><stop offset=".55" stop-color="#5d9a3c"/><stop offset="1" stop-color="#2a5418"/></radialGradient>
    <path id="leaflet" d="M0 0 C3 -6 4 -14 0 -26 C-4 -14 -3 -6 0 0 Z"/>
    <g id="bud">
      <path d="M-2 -15 L1 -24 L4 -14 Z" fill="#3f7a2a" stroke="#173d10" stroke-width=".9"/>
      <path d="M7 -6 L16 -11 L14 -7 L19 -7 L14 -3 L17 0 L9 -1 Z" fill="#3f7a2a" stroke="#173d10" stroke-width=".9"/>
      <path d="M-7 4 L-17 1 L-13 -1 L-17 -5 L-11 -4 L-11 -8 L-6 -2 Z" fill="#3f7a2a" stroke="#173d10" stroke-width=".9"/>
      <g fill="url(#budg)" stroke="#173d10" stroke-width="1">
        <circle cx="0" cy="12" r="5.5"/><circle cx="-5" cy="6" r="6.5"/><circle cx="5.5" cy="6" r="6"/>
        <circle cx="-5.5" cy="-3" r="6.5"/><circle cx="5.5" cy="-3" r="6.5"/><circle cx="0" cy="-11" r="6"/>
      </g>
      <g fill="none" stroke="#e58a2e" stroke-width=".9" stroke-linecap="round"><path d="M-2 -13 q2 -3 4 0M3 -4 q3 -2 4 1M-8 -4 q-1 -3 2 -4M-3 6 q2 -3 4 -1M2 12 q3 1 2 4M6 5 q2 -2 3 1"/></g>
      <g fill="#f4fbec" fill-opacity=".85"><circle cx="-4" cy="-6" r=".7"/><circle cx="2" cy="-12" r=".6"/><circle cx="7" cy="-1" r=".7"/><circle cx="-7" cy="5" r=".6"/><circle cx="1" cy="10" r=".6"/><circle cx="4" cy="4" r=".6"/></g>
    </g>
  </defs>
  <g transform="rotate(4 64 64)">
    <g filter="url(#s)" stroke="#060708" stroke-width="1.6" stroke-linejoin="round">
      <path d="M30 20 H90 L92 98 Q92 104 86 104 H34 Q28 104 28 98 Z" fill="url(#pouch)"/>
    </g>
    <rect x="30" y="20" width="60" height="7" fill="#26292d"/>
    <path d="M30 31 H91" stroke="#0b0c0e" stroke-width="2.2"/>
    <path d="M30 32.6 H91" stroke="#5d636b" stroke-opacity=".5" stroke-width=".8"/>
    <!-- one-way degassing valve -->
    <circle cx="78" cy="42" r="5" fill="#1a1c1f" stroke="#060708" stroke-width="1.2"/>
    <circle cx="78" cy="42" r="2.4" fill="none" stroke="#4fd1a8" stroke-width="1"/>
    <!-- leaf stencil -->
    <g transform="translate(58 82)" fill="none" stroke="#4fd1a8" stroke-width="2.2" stroke-linejoin="round">
      <use href="#leaflet" transform="scale(1.05)"/>
      <use href="#leaflet" transform="rotate(-32) scale(.85)"/>
      <use href="#leaflet" transform="rotate(32) scale(.85)"/>
      <use href="#leaflet" transform="rotate(-64) scale(.62)"/>
      <use href="#leaflet" transform="rotate(64) scale(.62)"/>
    </g>
    <path d="M58 82 V90" stroke="#4fd1a8" stroke-width="2.2" stroke-linecap="round"/>
    <g fill="#4fd1a8"><rect x="36" y="38" width="16" height="3" rx="1"/><rect x="36" y="44" width="10" height="3" rx="1"/></g>
    <path d="M35 36 Q37 66 34 98" stroke="#8a929c" stroke-opacity=".28" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  </g>
  <g filter="url(#s)">
    <use href="#bud" transform="translate(98 96) rotate(20)"/>
    <use href="#bud" transform="translate(84 108) rotate(-30) scale(.7)"/>
  </g>
</svg>
