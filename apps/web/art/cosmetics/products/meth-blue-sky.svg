<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Blue Sky Meth (Easter egg, Heisenberg): deep sky-blue glass in a clear zip bag, a blue 99.1% sticker with a pork-pie hat. -->
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".6"/></filter>
    <linearGradient id="bag" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset=".5" stop-color="#dff4ff" stop-opacity=".28"/><stop offset="1" stop-color="#ffffff" stop-opacity=".45"/></linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d6f3ff"/><stop offset=".45" stop-color="#3fb4ff"/><stop offset="1" stop-color="#0b5fcf"/></linearGradient>
    <linearGradient id="b" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd6ff"/><stop offset="1" stop-color="#083f9a"/></linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f8cff"/><stop offset="1" stop-color="#0d4fb8"/></linearGradient>
    <clipPath id="inside"><path d="M30 30 H98 L102 108 Q64 114 26 108 Z"/></clipPath>
  </defs>
  <g transform="rotate(-7 64 66)">
    <g filter="url(#s)">
      <!-- the bag -->
      <path d="M28 20 H100 L104 110 Q64 117 24 110 Z" fill="url(#bag)" stroke="#5b7f99" stroke-width="1.4" stroke-linejoin="round"/>
      <!-- zip -->
      <path d="M28 20 H100 V28 H28 Z" fill="#e8f6ff" fill-opacity=".7" stroke="#5b7f99" stroke-width="1.2"/>
      <path d="M29.5 24 H98.5" stroke="#1f6fe0" stroke-width="2.2"/>
    </g>
    <!-- crystal shards filling the lower bag -->
    <g clip-path="url(#inside)" stroke="#06305f" stroke-width="1.1" stroke-linejoin="round">
      <path d="M24 112 L30 74 L42 70 L46 112 Z" fill="url(#b)"/>
      <path d="M30 74 L36 52 L48 50 L42 70 Z" fill="url(#a)"/>
      <path d="M42 70 L48 50 L58 72 L50 112 Z" fill="url(#b)"/>
      <path d="M50 112 L58 72 L68 42 L76 70 L70 112 Z" fill="url(#a)"/>
      <path d="M68 42 L82 58 L76 70 Z" fill="url(#b)"/>
      <path d="M76 70 L82 58 L96 78 L92 112 L70 112 Z" fill="url(#b)"/>
      <path d="M82 58 L100 54 L96 78 Z" fill="url(#a)"/>
      <path d="M22 100 Q64 88 106 100 L106 116 H22 Z" fill="#1f86e8"/>
      <path d="M30 100 L36 93 L42 100 M56 98 L63 90 L69 98 M84 99 L90 92 L97 99" fill="#a8e6ff"/>
    </g>
    <g stroke="#fff" stroke-linecap="round" stroke-width="1.5" opacity=".85">
      <path d="M40 56 L37 66M66 48 L62 70M90 62 L92 72"/>
    </g>
    <!-- bag sheen -->
    <path d="M34 34 Q31 66 33 100" stroke="#fff" stroke-opacity=".6" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <!-- the sticker -->
    <g transform="rotate(4 74 39)">
      <rect x="52" y="31" width="44" height="17" rx="3" fill="url(#tag)" stroke="#06305f" stroke-width="1.1"/>
      <path d="M55.5 42 H66.5 M58 42 Q58 35.5 61 35.5 Q64 35.5 64 42" fill="#06244f" stroke="#e8f6ff" stroke-width="1.1" stroke-linejoin="round"/>
      <text x="81.5" y="43" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="900" fill="#ffffff">99.1%</text>
    </g>
  </g>
  <path d="M106 18 V28 M101 23 H111" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M18 40 V46 M15 43 H21" stroke="#9fe6ff" stroke-width="1.4" stroke-linecap="round" opacity=".9"/>
</svg>
