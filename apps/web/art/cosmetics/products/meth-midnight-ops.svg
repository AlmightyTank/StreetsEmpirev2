<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Midnight Ops meth: open black hard case, egg-crate lid foam, teal-tinted shards seated in cut foam. -->
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".65"/></filter>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3e44"/><stop offset=".4" stop-color="#1e2024"/><stop offset="1" stop-color="#0c0d0f"/></linearGradient>
    <linearGradient id="foam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c2f34"/><stop offset="1" stop-color="#16181b"/></linearGradient>
    <linearGradient id="shard" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6fff8"/><stop offset=".45" stop-color="#7fe0c4"/><stop offset="1" stop-color="#1f7f6a"/></linearGradient>
    <pattern id="crate" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.8" fill="#000" fill-opacity=".45"/><circle cx="2.4" cy="2.4" r=".8" fill="#5d636b" fill-opacity=".35"/></pattern>
  </defs>
  <g filter="url(#s)" stroke="#060708" stroke-width="1.6" stroke-linejoin="round">
    <!-- lid -->
    <path d="M28 60 L112 60 L108 18 L32 18 Z" fill="url(#shell)"/>
    <path d="M35 56 L106 56 L103 23 L37 23 Z" fill="url(#foam)" stroke-width="1"/>
    <!-- base -->
    <path d="M100 74 L112 60 L112 88 L100 102 Z" fill="#141518"/>
    <path d="M16 74 H100 V102 H16 Z" fill="url(#shell)"/>
    <path d="M16 74 L28 60 H112 L100 74 Z" fill="url(#foam)"/>
  </g>
  <path d="M35 56 L106 56 L103 23 L37 23 Z" fill="url(#crate)"/>
  <!-- foam cut-outs -->
  <g fill="#060708"><ellipse cx="42" cy="68" rx="11" ry="3.5"/><ellipse cx="66" cy="67" rx="11" ry="3.5"/><ellipse cx="90" cy="66" rx="10" ry="3.5"/></g>
  <!-- shards -->
  <g stroke="#0c3a30" stroke-width="1.1" stroke-linejoin="round" filter="url(#s)">
    <path d="M34 68 L36 46 L42 38 L46 50 L50 68 Z" fill="url(#shard)"/>
    <path d="M42 68 L48 52 L52 68 Z" fill="url(#shard)"/>
    <path d="M58 68 L60 40 L66 30 L70 44 L74 67 Z" fill="url(#shard)"/>
    <path d="M66 67 L72 50 L78 66 Z" fill="url(#shard)"/>
    <path d="M82 66 L86 48 L92 42 L96 54 L98 66 Z" fill="url(#shard)"/>
  </g>
  <path d="M38 48 L41 41M62 42 L65 34M88 50 L91 44" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
  <!-- latches and edge highlights -->
  <g fill="#26292d" stroke="#060708" stroke-width="1"><rect x="30" y="74" width="10" height="7" rx="1.5"/><rect x="76" y="74" width="10" height="7" rx="1.5"/></g>
  <circle cx="35" cy="77.5" r="1.2" fill="#4fd1a8"/><circle cx="81" cy="77.5" r="1.2" fill="#4fd1a8"/>
  <path d="M20 85 H96 M20 92 H96" stroke="#060708" stroke-opacity=".6" stroke-width="1"/>
  <path d="M34 21 H106" stroke="#8a929c" stroke-opacity=".3" stroke-width="1"/>
  <path d="M18 77 H32" stroke="#8a929c" stroke-opacity=".3" stroke-width="1"/>
</svg>
