<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Midnight Ops crack: matte black mylar stand-up pouch, smoked window, tear notch, teal stencil band. -->
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".65"/></filter>
    <linearGradient id="mylar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1a1c1f"/><stop offset=".25" stop-color="#3a3e44"/><stop offset=".5" stop-color="#1e2024"/><stop offset=".8" stop-color="#2c2f34"/><stop offset="1" stop-color="#121315"/></linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3138"/><stop offset="1" stop-color="#0c0f12"/></linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4ecd6"/><stop offset=".6" stop-color="#cbb98f"/><stop offset="1" stop-color="#8a7448"/></linearGradient>
    <clipPath id="winclip"><rect x="42" y="56" width="44" height="36" rx="8"/></clipPath>
  </defs>
  <g transform="rotate(-6 64 64)">
    <g filter="url(#s)" stroke="#060708" stroke-width="1.6" stroke-linejoin="round">
      <path d="M32 22 H96 V96 Q96 104 100 108 H28 Q32 104 32 96 Z" fill="url(#mylar)"/>
    </g>
    <!-- crimped heat seal and zip -->
    <rect x="32" y="22" width="64" height="8" fill="#26292d"/>
    <path d="M34 22 V30M38 22 V30M42 22 V30M46 22 V30M50 22 V30M54 22 V30M58 22 V30M62 22 V30M66 22 V30M70 22 V30M74 22 V30M78 22 V30M82 22 V30M86 22 V30M90 22 V30M94 22 V30" stroke="#0b0c0e" stroke-width="1.2"/>
    <path d="M32 36 H96" stroke="#0b0c0e" stroke-width="2.2"/>
    <path d="M32 37.6 H96" stroke="#5d636b" stroke-opacity=".5" stroke-width=".8"/>
    <path d="M96 31 L91 34 L96 37 Z" fill="#060708"/>
    <!-- teal stencil band -->
    <rect x="42" y="42" width="30" height="6" rx="1" fill="#4fd1a8"/>
    <g fill="#0d2e26"><rect x="45" y="43.5" width="3" height="3"/><rect x="50" y="43.5" width="3" height="3"/><rect x="55" y="43.5" width="8" height="3"/></g>
    <rect x="76" y="42" width="10" height="6" rx="1" fill="none" stroke="#4fd1a8" stroke-width="1.2"/>
    <!-- smoked window with rocks -->
    <rect x="42" y="56" width="44" height="36" rx="8" fill="url(#win)" stroke="#060708" stroke-width="1.4"/>
    <g clip-path="url(#winclip)" stroke="#5c4a28" stroke-width="1.1" stroke-linejoin="round">
      <path d="M44 80 L52 72 L62 76 L62 88 L50 92 L42 88 Z" fill="url(#rock)"/>
      <path d="M60 70 L72 64 L82 70 L80 82 L68 84 L62 78 Z" fill="url(#rock)"/>
      <path d="M66 86 L78 82 L88 88 L86 96 L68 96 Z" fill="url(#rock)"/>
      <path d="M46 64 L56 60 L60 68 L52 72 Z" fill="url(#rock)"/>
    </g>
    <rect x="42" y="56" width="44" height="36" rx="8" fill="#9adfff" fill-opacity=".07"/>
    <path d="M47 59 L56 59" stroke="#fff" stroke-opacity=".45" stroke-width="1.6" stroke-linecap="round"/>
    <!-- low sheen -->
    <path d="M38 40 Q40 70 37 98" stroke="#8a929c" stroke-opacity=".3" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M34 98 H94" stroke="#5d636b" stroke-opacity=".4" stroke-width=".9"/>
  </g>
</svg>
