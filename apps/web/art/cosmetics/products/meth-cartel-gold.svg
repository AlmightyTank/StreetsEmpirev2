<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Cartel Gold meth: sapphire-cut crystal cluster mounted on an engraved gold pedestal. -->
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".6"/></filter>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3b8"/><stop offset=".35" stop-color="#e7b94a"/><stop offset=".7" stop-color="#9a6614"/><stop offset="1" stop-color="#f0c95f"/></linearGradient>
    <linearGradient id="goldh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a5a10"/><stop offset=".35" stop-color="#ffe9a0"/><stop offset=".7" stop-color="#c58f2a"/><stop offset="1" stop-color="#7a4e0c"/></linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8f8ff"/><stop offset=".4" stop-color="#5ab8ec"/><stop offset="1" stop-color="#173f78"/></linearGradient>
    <linearGradient id="gemd" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fdcff"/><stop offset="1" stop-color="#123266"/></linearGradient>
  </defs>
  <!-- pedestal -->
  <g filter="url(#s)" stroke="#3a2406" stroke-width="1.4" stroke-linejoin="round">
    <path d="M30 104 V98 A34 8 0 0 1 98 98 V104 A34 8 0 0 1 30 104 Z" fill="url(#goldh)"/>
    <path d="M48 98 L54 82 H74 L80 98 Z" fill="url(#goldh)"/>
    <ellipse cx="64" cy="82" rx="24" ry="6" fill="url(#gold)"/>
  </g>
  <ellipse cx="64" cy="98" rx="34" ry="8" fill="none" stroke="#fff3b8" stroke-opacity=".6" stroke-width=".9"/>
  <g fill="none" stroke="#7a4e0c" stroke-width=".8" stroke-linecap="round">
    <path d="M38 103 C40 99 44 99 44 102M50 105 C54 100 58 100 60 104M68 105 C70 100 76 100 78 104M84 103 C86 99 90 99 90 102"/>
  </g>
  <!-- crystal cluster -->
  <g filter="url(#s)" stroke="#0d2448" stroke-width="1.2" stroke-linejoin="round">
    <path d="M44 82 L40 52 L46 44 L52 56 L54 82 Z" fill="url(#gemd)"/>
    <path d="M74 82 L80 48 L88 40 L90 54 L84 82 Z" fill="url(#gemd)"/>
    <path d="M52 82 L54 36 L64 16 L74 36 L76 82 Z" fill="url(#gem)"/>
    <path d="M64 16 L64 82" stroke-width=".9"/>
    <path d="M54 36 L64 44 L74 36" fill="none" stroke-width=".9"/>
    <path d="M60 82 L58 62 L64 56 L70 62 L68 82 Z" fill="url(#gemd)" stroke-width="1"/>
  </g>
  <path d="M57 38 L62 22" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M42 54 L45 47M82 50 L86 44" stroke="#fff" stroke-opacity=".85" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M46 82 H82" stroke="#3a2406" stroke-width="1"/>
  <!-- gold prongs -->
  <g fill="url(#gold)" stroke="#3a2406" stroke-width=".8"><path d="M50 82 L52 74 L55 82 Z"/><path d="M73 82 L76 74 L78 82 Z"/></g>
  <path d="M96 30 l1.6 -4.5 l1.6 4.5 l4.5 1.6 l-4.5 1.6 l-1.6 4.5 l-1.6 -4.5 l-4.5 -1.6 Z" fill="#fff3b8"/>
  <path d="M30 52 l1.1 -3 l1.1 3 l3 1.1 l-3 1.1 l-1.1 3 l-1.1 -3 l-3 -1.1 Z" fill="#cfefff"/>
</svg>
