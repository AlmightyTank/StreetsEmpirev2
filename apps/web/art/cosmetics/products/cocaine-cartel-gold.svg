<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Cartel Gold cocaine: oval mirror in a beaded gold frame, cut lines, powder mound, gold razor and straw. -->
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".6"/></filter>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3b8"/><stop offset=".35" stop-color="#e7b94a"/><stop offset=".7" stop-color="#9a6614"/><stop offset="1" stop-color="#f0c95f"/></linearGradient>
    <linearGradient id="goldh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a5a10"/><stop offset=".35" stop-color="#ffe9a0"/><stop offset=".7" stop-color="#c58f2a"/><stop offset="1" stop-color="#7a4e0c"/></linearGradient>
    <linearGradient id="mirror" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a5468"/><stop offset=".45" stop-color="#1a1f2b"/><stop offset=".55" stop-color="#2e3647"/><stop offset="1" stop-color="#10131b"/></linearGradient>
    <radialGradient id="powder" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d7dbe2"/></radialGradient>
  </defs>
  <!-- mirror -->
  <g filter="url(#s)">
    <ellipse cx="62" cy="68" rx="52" ry="36" fill="url(#gold)" stroke="#3a2406" stroke-width="1.4"/>
  </g>
  <ellipse cx="62" cy="68" rx="45" ry="30" fill="url(#mirror)" stroke="#3a2406" stroke-width="1.2"/>
  <g fill="#fff3b8" stroke="#7a4e0c" stroke-width=".5">
    <circle cx="62" cy="34.5" r="1.6"/><circle cx="86" cy="38" r="1.6"/><circle cx="104" cy="50" r="1.6"/><circle cx="111" cy="68" r="1.6"/><circle cx="104" cy="86" r="1.6"/><circle cx="86" cy="98" r="1.6"/><circle cx="62" cy="101.5" r="1.6"/><circle cx="38" cy="98" r="1.6"/><circle cx="20" cy="86" r="1.6"/><circle cx="13" cy="68" r="1.6"/><circle cx="20" cy="50" r="1.6"/><circle cx="38" cy="38" r="1.6"/>
  </g>
  <path d="M28 58 Q34 48 46 44" stroke="#c5cbe0" stroke-opacity=".45" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- lines and mound -->
  <g stroke="url(#powder)" stroke-width="3.6" stroke-linecap="round"><path d="M32 72 L60 66M36 82 L66 76M44 91 L70 86"/></g>
  <path d="M74 76 Q82 62 92 76 Z" fill="url(#powder)" stroke="#aab1bb" stroke-width=".8"/>
  <!-- gold razor -->
  <g transform="translate(84 60) rotate(-20)" filter="url(#s)">
    <rect x="-14" y="-6" width="28" height="12" rx="1.5" fill="url(#gold)" stroke="#3a2406" stroke-width="1"/>
    <rect x="-8" y="-1.5" width="16" height="3" rx="1.5" fill="#1a1f2b"/>
    <path d="M-12 -4 H12" stroke="#fff6cf" stroke-width=".8"/>
  </g>
  <!-- gold straw -->
  <g transform="translate(54 52) rotate(-8)" filter="url(#s)">
    <rect x="-20" y="-3.2" width="40" height="6.4" rx="3.2" fill="url(#goldh)" stroke="#3a2406" stroke-width="1"/>
    <ellipse cx="20" cy="0" rx="1.6" ry="3.2" fill="#3a2406"/>
    <path d="M-16 -1.4 H14" stroke="#fff6cf" stroke-width=".9"/>
  </g>
  <path d="M106 22 l1.5 -4 l1.5 4 l4 1.5 l-4 1.5 l-1.5 4 l-1.5 -4 l-4 -1.5 Z" fill="#fff3b8"/>
</svg>
