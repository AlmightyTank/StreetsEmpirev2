<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Urban Ghost weed: knurled camo grinder with a frosted, cold-cured bud on top. -->
  <defs>
    <g id="bud">
      <path d="M-2 -15 L1 -24 L4 -14 Z" fill="#5d8a4a" stroke="#20361c" stroke-width=".9"/>
      <path d="M7 -6 L16 -11 L14 -7 L19 -7 L14 -3 L17 0 L9 -1 Z" fill="#5d8a4a" stroke="#20361c" stroke-width=".9"/>
      <path d="M-7 4 L-17 1 L-13 -1 L-17 -5 L-11 -4 L-11 -8 L-6 -2 Z" fill="#5d8a4a" stroke="#20361c" stroke-width=".9"/>
      <g fill="url(#budg)" stroke="#20361c" stroke-width="1">
        <circle cx="0" cy="12" r="5.5"/><circle cx="-5" cy="6" r="6.5"/><circle cx="5.5" cy="6" r="6"/>
        <circle cx="-5.5" cy="-3" r="6.5"/><circle cx="5.5" cy="-3" r="6.5"/><circle cx="0" cy="-11" r="6"/>
      </g>
      <g fill="none" stroke="#e58a2e" stroke-width=".9" stroke-linecap="round"><path d="M-2 -13 q2 -3 4 0M3 -4 q3 -2 4 1M-8 -4 q-1 -3 2 -4M-3 6 q2 -3 4 -1M2 12 q3 1 2 4M6 5 q2 -2 3 1"/></g>
      <g fill="#f4fbec" fill-opacity=".85"><circle cx="-4" cy="-6" r=".7"/><circle cx="2" cy="-12" r=".6"/><circle cx="7" cy="-1" r=".7"/><circle cx="-7" cy="5" r=".6"/><circle cx="1" cy="10" r=".6"/><circle cx="4" cy="4" r=".6"/></g>
    </g>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".6"/></filter>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5c6168"/><stop offset=".3" stop-color="#d3d7db"/><stop offset=".6" stop-color="#9a9fa5"/><stop offset="1" stop-color="#4c5158"/></linearGradient>
    <radialGradient id="budg" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#c8e6b0"/><stop offset=".5" stop-color="#78a463"/><stop offset="1" stop-color="#3a5c32"/></radialGradient>
    <clipPath id="bodyclip"><path d="M24 70 V96 A30 10 0 0 0 84 96 V70 Z"/></clipPath>
  </defs>
  <!-- grinder -->
  <g filter="url(#s)" stroke="#16181b" stroke-width="1.6" stroke-linejoin="round">
    <path d="M24 70 V96 A30 10 0 0 0 84 96 V70 Z" fill="url(#metal)"/>
  </g>
  <g clip-path="url(#bodyclip)">
    <path d="M20 80 L40 78 L42 92 L20 96 Z" fill="#3f4348" opacity=".8"/>
    <path d="M46 84 L66 80 L70 98 L48 102 Z" fill="#c4c8cc" opacity=".8"/>
    <path d="M70 76 L88 74 L88 92 L72 94 Z" fill="#5c6168" opacity=".8"/>
  </g>
  <path d="M24 84 A30 10 0 0 0 84 84" fill="none" stroke="#16181b" stroke-width="1.4"/>
  <path d="M24 86 A30 10 0 0 0 84 86" fill="none" stroke="#f2f8fd" stroke-opacity=".5" stroke-width=".8"/>
  <path d="M28 76 V82M33 78 V84M38 79 V85M43 80 V86M48 80 V86M53 80 V86M58 80 V86M63 80 V86M68 79 V85M73 78 V84M78 77 V83" stroke="#2b2e33" stroke-width="1.2"/>
  <ellipse cx="54" cy="70" rx="30" ry="10" fill="#c9cdd1" stroke="#16181b" stroke-width="1.6"/>
  <ellipse cx="54" cy="70" rx="20" ry="6.5" fill="none" stroke="#5c6168" stroke-width="1.2"/>
  <ellipse cx="54" cy="70" rx="29" ry="9.4" fill="none" stroke="#f2f8fd" stroke-opacity=".7" stroke-width=".8"/>
  <!-- leaf stencil on the lid -->
  <g transform="translate(54 72) scale(1 .34)" fill="none" stroke="#5c6168" stroke-width="2.4" stroke-linejoin="round">
    <path d="M0 0 C3 -6 4 -14 0 -26 C-4 -14 -3 -6 0 0 Z"/>
    <path d="M0 0 C3 -6 4 -14 0 -26 C-4 -14 -3 -6 0 0 Z" transform="rotate(-38) scale(.8)"/>
    <path d="M0 0 C3 -6 4 -14 0 -26 C-4 -14 -3 -6 0 0 Z" transform="rotate(38) scale(.8)"/>
  </g>
  <!-- frosted, cold-cured bud -->
  <g filter="url(#s)"><use href="#bud" transform="translate(88 50) rotate(14) scale(1.65)"/></g>
</svg>
