<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 128">
  <!-- Urban Ghost Low-Rider: concrete satin with graphite top, camo rocker wrap, sun visor, pillar spotlight, steelies with dog-dish caps. -->
  <defs>
    <filter id="s" x="-10%" y="-20%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".6"/></filter>
    <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9cdd1"/><stop offset=".4" stop-color="#9a9fa5"/><stop offset="1" stop-color="#5e6369"/></linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6c7178"/><stop offset="1" stop-color="#3a3e44"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4c5866"/><stop offset=".6" stop-color="#232a33"/><stop offset=".8" stop-color="#5f7f99"/><stop offset="1" stop-color="#a9c6dc"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f7fa"/><stop offset=".45" stop-color="#a3abb4"/><stop offset=".55" stop-color="#6a7078"/><stop offset="1" stop-color="#cfd5db"/></linearGradient>
    <linearGradient id="graphite" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a6068"/><stop offset="1" stop-color="#25282d"/></linearGradient>
    <radialGradient id="rim" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#8a9098"/><stop offset=".6" stop-color="#4b5058"/><stop offset="1" stop-color="#2b2e33"/></radialGradient>
    <radialGradient id="cap" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#b3bac3"/><stop offset="1" stop-color="#5d646d"/></radialGradient>
    <clipPath id="bodyclip"><path d="M12 66 Q44 62 75 61 C84 54 92 47 102 46 L152 46 C158 47 166 56 172 63 L178 63 C205 64 235 67 248 70 L250 72 Q251 80 249 90 L232 95 A18 18 0 0 0 195 95 L95 96 A18 18 0 0 0 59 96 L14 94 Q10 92 10 86 L10 70 Q10 66 12 66 Z"/></clipPath>
    <g id="wheel">
      <circle r="15" fill="#151617" stroke="#050505" stroke-width="1.4"/>
      <circle r="12.4" fill="none" stroke="#3b3f45" stroke-width="1"/>
      <circle r="11" fill="url(#rim)" stroke="#1d2024" stroke-width="1"/>
      <g fill="#1a1c1f"><circle cx="0" cy="-8" r="1.5"/><circle cx="5.66" cy="-5.66" r="1.5"/><circle cx="8" cy="0" r="1.5"/><circle cx="5.66" cy="5.66" r="1.5"/><circle cx="0" cy="8" r="1.5"/><circle cx="-5.66" cy="5.66" r="1.5"/><circle cx="-8" cy="0" r="1.5"/><circle cx="-5.66" cy="-5.66" r="1.5"/></g>
      <circle r="5.4" fill="url(#cap)" stroke="#3a3e45" stroke-width=".8"/>
      <circle r="1.4" fill="#6b727b"/>
    </g>
  </defs>
  <g transform="translate(0 -9)">
    <ellipse cx="128" cy="106" rx="120" ry="4.5" fill="#000" opacity=".45"/>
    <!-- single whip antenna -->
    <path d="M61 62 L40 41" stroke="#d8dde3" stroke-width="1.1" stroke-linecap="round"/><circle cx="40" cy="41" r="1" fill="#d8dde3"/>
    <g filter="url(#s)">
      <path d="M12 66 Q44 62 75 61 C84 54 92 47 102 46 L152 46 C158 47 166 56 172 63 L178 63 C205 64 235 67 248 70 L250 72 Q251 80 249 90 L232 95 A18 18 0 0 0 195 95 L95 96 A18 18 0 0 0 59 96 L14 94 Q10 92 10 86 L10 70 Q10 66 12 66 Z" fill="url(#paint)" stroke="#202327" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- tube bumpers -->
      <path d="M6 80 H20 V92 H9 Q6 92 6 89 Z" fill="url(#graphite)" stroke="#16181b" stroke-width="1.1"/>
      <path d="M236 87 L251 83 Q254 83 254 86 V90 Q254 94 250 94 H238 Z" fill="url(#graphite)" stroke="#16181b" stroke-width="1.1"/>
    </g>
    <!-- graphite top -->
    <path d="M75 61 C84 54 92 47 102 46 L152 46 C158 47 166 56 172 63 Z" fill="url(#roof)"/>
    <path d="M100 63 C99 56 101 50 106 49 L150 49 C155 50 160 55 164 63 Z" fill="url(#glass)" stroke="#202327" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M126 49 V63" stroke="url(#steel)" stroke-width="1.4"/>
    <path d="M112 60 L122 50 M140 60 L148 52" stroke="#fff" stroke-opacity=".3" stroke-width="2.4"/>
    <!-- sun visor over the windshield -->
    <path d="M150 45.5 L168 50 Q170.5 51.2 168.5 52.6 L152 49.4 Z" fill="url(#graphite)" stroke="#16181b" stroke-width="1"/>
    <g clip-path="url(#bodyclip)">
      <!-- graphite hood and deck panels -->
      <path d="M172 63 L178 63 C205 64 235 67 248 70 L250 72 L250 74 L178 70 Z" fill="#4b5058" opacity=".85"/>
      <path d="M12 66 Q44 62 75 61 L75 66 L10 70 Z" fill="#4b5058" opacity=".85"/>
      <!-- urban camo rocker wrap -->
      <g opacity=".8">
        <path d="M8 82 L30 80 L34 100 L8 100 Z" fill="#3f4348"/>
        <path d="M34 82 L56 80 L52 100 L32 100 Z" fill="#a9aeb3"/>
        <path d="M96 80 L118 82 L114 100 L98 100 Z" fill="#5c6168"/>
        <path d="M118 82 L142 80 L146 100 L116 100 Z" fill="#474b51"/>
        <path d="M142 80 L164 82 L160 100 L146 100 Z" fill="#a3a8ad"/>
        <path d="M164 82 L186 80 L190 100 L160 100 Z" fill="#6b7077"/>
        <path d="M232 80 L252 82 L252 100 L232 100 Z" fill="#3f4348"/>
      </g>
      <path d="M8 80 L252 82" stroke="#e8eef3" stroke-width="1"/>
      <path d="M14 67 Q44 63.5 76 62.5 M180 64.5 C206 65.5 232 68 246 71" stroke="#eef6fc" stroke-opacity=".5" stroke-width="1.2" fill="none"/>
    </g>
    <path d="M178 63 V96 M123 64 V97" stroke="#2b2e33" stroke-width="1.2"/>
    <path d="M14 70 L244 73" stroke="url(#steel)" stroke-width="1.6"/>
    <rect x="127" y="67" width="7" height="2" rx="1" fill="url(#steel)"/>
    <!-- A-pillar spotlight -->
    <path d="M168 62 V58" stroke="#2b2e33" stroke-width="1.2"/>
    <path d="M164 55 H172 Q174 55 174 57 V58 Q174 60 172 60 H164 Q162 60 162 58 V57 Q162 55 164 55 Z" fill="url(#steel)" stroke="#202327" stroke-width=".8"/>
    <rect x="173" y="55.5" width="1.6" height="4" rx=".6" fill="#e6f4ff"/>
    <rect x="10" y="67" width="2.4" height="7" fill="#c2222e"/>
    <path d="M233 67 L234.5 61.5 L238 64 Z" fill="#d9e2ea" stroke="#3a3e45" stroke-width=".6"/>
    <use href="#wheel" transform="translate(213 91)"/>
    <use href="#wheel" transform="translate(77 91)"/>
  </g>
</svg>
