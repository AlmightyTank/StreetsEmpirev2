    <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a1f33"/><stop offset=".35" stop-color="#4f0b1a"/><stop offset=".75" stop-color="#2a0410"/><stop offset="1" stop-color="#16020a"/></linearGradient>
