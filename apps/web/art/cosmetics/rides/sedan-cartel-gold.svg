    <clipPath id="bodyclip"><path d="M18 96 Q11 95 10 87 L10 72 Q10 64 16 62 L46 60 Q54 59.5 60 56 C80 42 104 35 130 35 C154 35 172 42 194 59 Q226 61.5 240 68 Q248 72 249 80 L249 88 Q248 95 240 96 L211 96 A19 19 0 0 0 173 96 L85 96 A19 19 0 0 0 47 96 Z"/></clipPath>
