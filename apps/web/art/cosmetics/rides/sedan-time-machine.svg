<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 128">
  <!-- Time Machine Sedan (Easter egg, Back to the Future Day): brushed stainless wedge, gull-wing door, black louvers and lower trim, rear reactor and vent stack, copper flux cabling down the flank, turbine wheels. -->
  <defs>
    <filter id="s" x="-10%" y="-20%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".6"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"/></filter>
    <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef1f3"/><stop offset=".35" stop-color="#c3c9cf"/><stop offset=".62" stop-color="#9aa1a8"/><stop offset="1" stop-color="#6f767d"/></linearGradient>
    <pattern id="brush" width="48" height="2.2" patternUnits="userSpaceOnUse"><path d="M0 .5 H31 M36 1.6 H48" stroke="#fff" stroke-opacity=".22" stroke-width=".35"/><path d="M8 1.6 H24" stroke="#4a5158" stroke-opacity=".18" stroke-width=".35"/></pattern>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4c5866"/><stop offset=".6" stop-color="#1f252d"/><stop offset=".82" stop-color="#5f7f99"/><stop offset="1" stop-color="#a9c6dc"/></linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#c3cad2"/><stop offset=".55" stop-color="#6d747c"/><stop offset="1" stop-color="#e3e7ec"/></linearGradient>
    <linearGradient id="trim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3d42"/><stop offset="1" stop-color="#16181b"/></linearGradient>
    <linearGradient id="gunmetal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8c939a"/><stop offset=".5" stop-color="#5a6067"/><stop offset="1" stop-color="#33373c"/></linearGradient>
    <linearGradient id="reactor" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b9bec4"/><stop offset=".35" stop-color="#ffffff"/><stop offset=".7" stop-color="#dfe3e7"/><stop offset="1" stop-color="#9ba1a8"/></linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb071"/><stop offset=".5" stop-color="#c9561c"/><stop offset="1" stop-color="#7a2c0a"/></linearGradient>
    <linearGradient id="lamp" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e8eef3"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8e1018"/><stop offset="1" stop-color="#e0303c"/></linearGradient>
    <radialGradient id="rim" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#b3bac3"/><stop offset="1" stop-color="#5d646d"/></radialGradient>
    <clipPath id="bodyclip"><path d="M16 94 Q12 94 12 90 L12 66 Q12 61.5 17 61.2 L42 59 L102 45.6 Q106 44 112 44 L148 44 L183 60.5 Q222 66 243 71 Q250 72.6 250 78 L250 86 Q250 89.5 246 90 L231 93 L216 95 A20 20 0 0 0 176 95 L86 95 A20 20 0 0 0 46 95 Z"/></clipPath>
    <!-- turbine rim: a solid silver disc with dark slots cut between the vanes -->
    <path id="slot" d="M-.9 -4.2 L.9 -4.2 L1.7 -9.4 L-1.7 -9.4 Z" fill="#1f2328"/>
    <g id="wheel">
      <circle r="15" fill="#141414" stroke="#050505" stroke-width="1.4"/>
      <circle r="11" fill="url(#rim)" stroke="#5d646d" stroke-width="1.2"/>
      <use href="#slot"/><use href="#slot" transform="rotate(36)"/><use href="#slot" transform="rotate(72)"/><use href="#slot" transform="rotate(108)"/><use href="#slot" transform="rotate(144)"/><use href="#slot" transform="rotate(180)"/><use href="#slot" transform="rotate(216)"/><use href="#slot" transform="rotate(252)"/><use href="#slot" transform="rotate(288)"/><use href="#slot" transform="rotate(324)"/>
      <circle r="3.4" fill="url(#rim)" stroke="#3a3e45" stroke-width=".8"/>
      <circle r="1.2" fill="#6b727b"/>
    </g>
  </defs>
  <g transform="translate(0 -7)">
    <ellipse cx="128" cy="109" rx="120" ry="4.5" fill="#000" opacity=".45"/>

    <!-- body -->
    <g filter="url(#s)">
      <path d="M16 94 Q12 94 12 90 L12 66 Q12 61.5 17 61.2 L42 59 L102 45.6 Q106 44 112 44 L148 44 L183 60.5 Q222 66 243 71 Q250 72.6 250 78 L250 86 Q250 89.5 246 90 L231 93 L216 95 A20 20 0 0 0 176 95 L86 95 A20 20 0 0 0 46 95 Z" fill="url(#paint)" stroke="#0a0b0d" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
    <g clip-path="url(#bodyclip)">
      <rect x="0" y="40" width="256" height="60" fill="url(#brush)"/>
      <!-- black lower trim and urethane bumpers -->
      <path d="M0 84.5 Q128 86.5 256 83.5 V100 H0 Z" fill="url(#trim)"/>
      <path d="M0 85 Q128 87 256 84" stroke="#6a7077" stroke-width=".6" fill="none"/>
      <!-- rear louvers over the fastback -->
      <path d="M44 59.4 L102 46.6 L104.5 49.6 L47 61.6 Z" fill="#15171a"/>
      <path d="M52 57.2 l1.2 2.6 M58 55.9 l1.2 2.6 M64 54.6 l1.2 2.6 M70 53.3 l1.2 2.6 M76 52 l1.2 2.6 M82 50.7 l1.2 2.6 M88 49.4 l1.2 2.6 M94 48.1 l1.2 2.6 M100 46.9 l1.1 2.4" stroke="#7d848b" stroke-width=".9"/>
    </g>

    <!-- shoulder crease and highlights -->
    <path d="M14 67.5 L183 64 Q220 68.5 247 76" stroke="#fff" stroke-opacity=".75" stroke-width="1" fill="none"/>
    <path d="M14 68.9 L183 65.4 Q220 69.9 247 77.4" stroke="#4a5158" stroke-opacity=".6" stroke-width="1" fill="none"/>
    <path d="M113 45.4 L147.5 45.4 L181 61.2" stroke="#fff" stroke-opacity=".7" stroke-width="1" fill="none"/>
    <path d="M185 61.6 Q220 66.6 242 72" stroke="#fff" stroke-opacity=".6" stroke-width="1" fill="none"/>

    <!-- gull-wing door: side glass with the toll-window split -->
    <path d="M117 47 L145.5 47 L175.5 61 L117 61.5 Z" fill="#141518" stroke="#0a0b0d" stroke-width="1" stroke-linejoin="round"/>
    <path d="M119.5 49 L144.8 49 L170 60 L119.5 60 Z" fill="url(#glass)"/>
    <path d="M148 53.6 V60.2 M148 53.6 H159.5" stroke="#141518" stroke-width="1.3" fill="none"/>
    <path d="M126 58 L134 50 M150 58 L156 53.5" stroke="#fff" stroke-opacity=".2" stroke-width="2.4"/>
    <!-- door shut lines, handle slot, mirror -->
    <path d="M114.5 46 V84.5 M181 62 Q182.5 74 180 84.5" stroke="#4a5158" stroke-width="1.1" fill="none"/>
    <path d="M118 72 h10" stroke="#2a2e33" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M178.5 60.5 L184 56.5 Q187 55.5 187.5 58 L186.5 61.6 Z" fill="#1d2024" stroke="#0a0b0d" stroke-width=".8" stroke-linejoin="round"/>

    <!-- lamps and markers -->
    <path d="M239 72.4 Q246 73.6 249.2 75.6 L249.2 79 L238 77.2 Z" fill="url(#lamp)" stroke="#0a0b0d" stroke-width=".9" stroke-linejoin="round"/>
    <rect x="233" y="78.3" width="6" height="3" rx=".8" fill="#ff9a2a" stroke="#0a0b0d" stroke-width=".6"/>
    <path d="M12.3 64 Q12.5 62 15 61.8 L15 77 L12.3 77 Z" fill="url(#tail)" stroke="#0a0b0d" stroke-width=".8"/>
    <rect x="19" y="74" width="6" height="3" rx=".8" fill="#c4202c" stroke="#0a0b0d" stroke-width=".6"/>

    <!-- copper flux cabling: out of the reactor bay, along the flank, over the front arch -->
    <g fill="none" stroke-linecap="round">
      <path d="M38 64 C34 72 34 80 40 82 L176 82.5 C182 82 184 76 196 73.5 C210 71 222 74 230 77" stroke="#4a1a06" stroke-width="2.6"/>
      <path d="M38 64 C34 72 34 80 40 82 L176 82.5 C182 82 184 76 196 73.5 C210 71 222 74 230 77" stroke="url(#copper)" stroke-width="1.7"/>
      <path d="M44 63 C42 70 43 76 48 78.6 L112 79" stroke="#7a1414" stroke-width="1.3"/>
    </g>
    <g fill="#d8dde2" stroke="#2a2e33" stroke-width=".5">
      <rect x="62" y="80.8" width="2.4" height="3.4" rx=".5"/><rect x="100" y="80.9" width="2.4" height="3.4" rx=".5"/><rect x="138" y="81.1" width="2.4" height="3.4" rx=".5"/><rect x="170" y="81.2" width="2.4" height="3.4" rx=".5"/><rect x="214" y="72.6" width="2.4" height="3.4" rx=".5"/>
    </g>

    <!-- rear hardware: vent stack off the tail -->
    <g filter="url(#s)">
      <path d="M5 50 L30 50 L32 52 L32 64 L5 64 Q3 64 3 62 L3 52 Q3 50 5 50 Z" fill="url(#gunmetal)" stroke="#0a0b0d" stroke-width="1.1" stroke-linejoin="round"/>
    </g>
    <path d="M3.5 53 H31 M3.5 56.5 H31 M3.5 60 H31" stroke="#1a1c1f" stroke-width="1.4"/>
    <path d="M3.5 52.2 H31 M3.5 55.7 H31 M3.5 59.2 H31" stroke="#fff" stroke-opacity=".35" stroke-width=".5"/>
    <rect x="1" y="51.5" width="3" height="11" rx="1" fill="#c4202c" stroke="#0a0b0d" stroke-width=".6"/>
    <circle cx="1.5" cy="57" r="2.2" fill="#9fd8ff" opacity=".7" filter="url(#glow)"/>

    <!-- reactor on the rear deck -->
    <path d="M28 59.5 L50 57.8 L50 52.5 L28 52.5 Z" fill="url(#gunmetal)" stroke="#0a0b0d" stroke-width="1" stroke-linejoin="round"/>
    <path d="M31 52.5 V35.5 Q31 33.5 33 33.5 L43 33.5 Q45 33.5 45 35.5 V52.5 Z" fill="url(#reactor)" stroke="#0a0b0d" stroke-width="1.1" stroke-linejoin="round"/>
    <path d="M31.5 40 H44.5 M31.5 47 H44.5" stroke="#8a9198" stroke-width=".8"/>
    <path d="M34 33.5 L35 30.5 L41 30.5 L42 33.5 Z" fill="url(#chrome)" stroke="#0a0b0d" stroke-width=".8" stroke-linejoin="round"/>
    <path d="M33 30.5 Q38 27 43 30.5 Z" fill="#2a2e33" stroke="#0a0b0d" stroke-width=".8" stroke-linejoin="round"/>
    <!-- coil housing on the louvers -->
    <path d="M52 57.4 L66 54.4 L66 49 L52 49 Z" fill="#2a2e33" stroke="#0a0b0d" stroke-width="1" stroke-linejoin="round"/>
    <path d="M54 50.5 v4.8 M56.6 50.5 v4.3 M59.2 50.5 v3.8 M61.8 50.5 v3.3 M64.2 50.5 v2.8" stroke="url(#copper)" stroke-width="1.5"/>
    <path d="M45 44 C52 42 56 44 58 49" stroke="#7a1414" stroke-width="1.3" fill="none" stroke-linecap="round"/>

    <use href="#wheel" transform="translate(196 94)"/>
    <use href="#wheel" transform="translate(66 94)"/>
  </g>
</svg>
