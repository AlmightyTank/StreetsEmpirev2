    <radialGradient id="steel" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#fff5c4"/><stop offset=".55" stop-color="#d9a73a"/><stop offset="1" stop-color="#7c510e"/></radialGradient>
    <clipPath id="bodyclip"><path d="M10 92 L10 34 Q10 26 18 26 L182 26 Q189 26 193 31 L213 58 L240 64 Q247 66 248 72 L249 92 Q249 97 244 97 L222 97 A19 19 0 0 0 184 97 L86 97 A19 19 0 0 0 48 97 L15 97 Q10 97 10 92 Z"/></clipPath>
