      <circle r="3.4" fill="#fff5c4" stroke="#7c510e" stroke-width=".8"/>
    </g>
  <pattern id="flake" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".35" fill="#ffd36b" fill-opacity=".45"/><circle cx="3.5" cy="3" r=".3" fill="#ff8aa0" fill-opacity=".35"/></pattern><linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6c8"/><stop offset=".45" stop-color="#e2b04a"/><stop offset=".55" stop-color="#8f5c10"/><stop offset="1" stop-color="#f5d684"/></linearGradient>
  </defs>
