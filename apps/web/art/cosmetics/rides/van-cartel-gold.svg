<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 128">
  <!-- Cartel Gold Van: black-cherry candy with gold flake, gold-framed scroll panel, gold beltline, gold steel wheels. -->
  <defs>
    <filter id="s" x="-10%" y="-20%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".6"/></filter>
    <filter id="soft" x="-10%" y="-20%" width="120%" height="140%"><feGaussianBlur stdDeviation=".8"/></filter>
    <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a1f33"/><stop offset=".4" stop-color="#4f0b1a"/><stop offset="1" stop-color="#16020a"/></linearGradient>
    <linearGradient id="trim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3e43"/><stop offset="1" stop-color="#16181b"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2f2a"/><stop offset=".6" stop-color="#1a1210"/><stop offset=".8" stop-color="#8a5a1a"/><stop offset="1" stop-color="#e2b04a"/></linearGradient>
