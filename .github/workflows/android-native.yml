name: Android Native

on:
  pull_request:
    branches: [main, beta]
    paths:
      - "android/**"
      - ".github/workflows/android-native.yml"
  push:
    branches: [main, beta]
    paths:
      - "android/**"
      - ".github/workflows/android-native.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install API 35 SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Use runner Android SDK path
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile native Android beta APK
        working-directory: android
        run: bash ./gradlew :app:assembleBetaDebug --no-daemon --stacktrace
