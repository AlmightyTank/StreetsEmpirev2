name: StreetsEmpire Windows Portable

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-windows.yml"

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install isolated desktop dependencies
        run: npm install --prefix desktop --no-audit --no-fund
      - name: Test activity mapping
        run: npm test --prefix desktop
      - name: Check JavaScript syntax
        run: npm run check --prefix desktop
      - name: Build portable Windows executable
        env:
          STREETSEMPIRE_DISCORD_CLIENT_ID: ${{ vars.STREETSEMPIRE_DISCORD_CLIENT_ID }}
        run: npm run dist:portable --prefix desktop
      - name: Upload portable Windows executable for testing
        uses: actions/upload-artifact@v4
        with:
          name: StreetsEmpire-Windows-Portable
          path: desktop/dist/StreetsEmpire-Portable-*.exe
          if-no-files-found: error
