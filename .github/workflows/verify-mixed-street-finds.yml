name: Verify mixed street finds

on:
  push:
    branches:
      - feature-mixed-street-finds
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: streets_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d streets_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/streets_test
      SESSION_SECRET: mixed-finds-session-secret-0123456789abcdef0123456789abcdef
      PRODUCT_INTEGRATION: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npx vitest run apps/server/src/services/__tests__/product-finds.test.ts apps/server/src/services/__tests__/street-finds.integration.test.ts
      - run: npm run qa:products -- --samples 4000 --quiet
      - run: npm run build
