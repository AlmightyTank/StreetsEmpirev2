name: Public Platform

on:
  push:
    branches:
      - main
      - beta
      - feature/1.2.0-d-roulette-street-dice
  pull_request:
    branches:
      - main
      - beta

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: streets
          POSTGRES_PASSWORD: streets
          POSTGRES_DB: streets_empire_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U streets -d streets_empire_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://streets:streets@127.0.0.1:5432/streets_empire_ci?schema=public
      SESSION_SECRET: ci-only-session-secret-change-me-32-characters

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply CI database migrations
        run: npx prisma migrate deploy

      - name: Seed CI database
        run: npm run db:seed

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Run public release integration
        env:
          RELEASE_INTEGRATION: "1"
        run: npx vitest run apps/server/src/services/__tests__/release.integration.test.ts

      - name: Build API, game, public site and bot
        run: npm run build

  deploy:
    name: Deploy ${{ github.ref_name }}
    needs: validate
    if: github.event_name == 'push' && (github.ref_name == 'beta' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: streets-empire-deploy-${{ github.ref_name }}
      cancel-in-progress: false
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'beta' }}
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
    steps:
      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_SSH_PRIVATE_KEY VPS_SSH_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required environment secret: $name"
              exit 1
            fi
          done

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/streets-empire-deploy"
          chmod 600 "$HOME/.ssh/streets-empire-deploy"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy beta
        if: github.ref_name == 'beta'
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/streets-empire-deploy" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'cd /opt/streets-empire/StreetsEmpirev2-beta && bash scripts/ops/deploy-beta.sh'

      - name: Deploy production
        if: github.ref_name == 'main'
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/streets-empire-deploy" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'cd /opt/streets-empire/StreetsEmpirev2 && bash scripts/ops/deploy.sh'
