name: Public Platform

on:
  push:
    branches:
      - main
      - beta
      - feature/1.2.0-d-roulette-street-dice
  pull_request:
    branches:
      - main
      - beta
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: Environment to deploy
        type: choice
        required: true
        default: beta
        options:
          - beta
          - main
      commit_sha:
        description: Optional commit SHA from the selected branch; blank uses its current tip
        type: string
        required: false
      full_tests:
        description: Run the complete Vitest regression suite instead of the reduced smoke suite
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pull-requests: read # Release planning reads merged PR version decisions.

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      commit_sha: ${{ steps.target_commit.outputs.sha }}
      release_version: ${{ steps.release_version.outputs.version }}
      release_version_checksum: ${{ steps.release_version.outputs.checksum }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: streets
          POSTGRES_PASSWORD: streets
          POSTGRES_DB: streets_empire_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U streets -d streets_empire_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://streets:streets@127.0.0.1:5432/streets_empire_ci?schema=public
      SESSION_SECRET: ci-only-session-secret-change-me-32-characters

    steps:
      - name: Check out the commit to validate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || inputs.deploy_branch || github.sha }}
          # Release planning needs the last APP_VERSION commit and all intervening PRs.
          fetch-depth: 0

      - name: Record validated commit
        id: target_commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Apply the proposed version BEFORE tests/builds. The deploy job can only
      # push this exact version after validation succeeds.
      - name: Prepare release version for CI
        if: (github.event_name == 'push' && github.ref_name == 'beta') || (github.event_name == 'workflow_dispatch' && inputs.deploy_branch == 'beta' && inputs.commit_sha == '')
        id: release_version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_BRANCH: ${{ inputs.deploy_branch || github.ref_name }}
          DEPLOY_COMMIT: ${{ steps.target_commit.outputs.sha }}
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/release.json"
          node scripts/ops/bump-version.mjs plan --to "$DEPLOY_COMMIT" --branch "$DEPLOY_BRANCH" --repo "$GITHUB_REPOSITORY" > "$plan"
          if jq -e '. != null and .version != null' "$plan" >/dev/null; then
            version="$(jq -r '.version' "$plan")"
            node scripts/ops/bump-version.mjs apply --version "$version"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "checksum=$(sha256sum packages/shared/src/platform.ts | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
            echo "CI will validate release $version before it is pushed."
          else
            echo "No automatic version bump needed."
          fi

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply CI database migrations
        run: npx prisma migrate deploy

      - name: Seed CI database
        run: npm run db:seed

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Verify browser install names for live and beta
        run: npm run qa:pwa

      - name: Run reduced smoke tests
        if: inputs.full_tests != true
        run: npm test

      - name: Run complete Vitest regression suite
        if: inputs.full_tests == true
        run: npm run test:full

      - name: Simulate 2.1.0-G crew anti-farm balance and legacy ruleset isolation
        run: npm run qa:crew-release

      - name: Run public release integration
        if: inputs.full_tests == true
        env:
          RELEASE_INTEGRATION: "1"
        run: npx vitest run apps/server/src/services/__tests__/release.integration.test.ts

      - name: Build API, game, public site and bot
        run: npm run build

  deploy:
    name: Deploy ${{ inputs.deploy_branch || github.ref_name }}
    needs: validate
    if: (github.event_name == 'push' && (github.ref_name == 'beta' || github.ref_name == 'main')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: streets-empire-deploy-${{ inputs.deploy_branch || github.ref_name }}
      cancel-in-progress: false
    environment:
      name: ${{ (inputs.deploy_branch || github.ref_name) == 'main' && 'production' || 'beta' }}
    permissions:
      # The release step pushes the APP_VERSION bump. Patch notes read pull request bodies.
      contents: write
      pull-requests: read
    env:
      DEPLOY_BRANCH: ${{ inputs.deploy_branch || github.ref_name }}
      DEPLOY_COMMIT: ${{ needs.validate.outputs.commit_sha }}
      RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
      RELEASE_VERSION_CHECKSUM: ${{ needs.validate.outputs.release_version_checksum }}
      CHECKOUT_DIR: ${{ (inputs.deploy_branch || github.ref_name) == 'main' && '/opt/streets-empire/StreetsEmpirev2' || '/opt/streets-empire/StreetsEmpirev2-beta' }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
    steps:
      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_SSH_PRIVATE_KEY VPS_SSH_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required environment secret: $name"
              exit 1
            fi
          done
          if [[ "$DEPLOY_BRANCH" != "beta" && "$DEPLOY_BRANCH" != "main" ]]; then
            echo "::error::Only beta and main can be deployed."
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/streets-empire-deploy"
          chmod 600 "$HOME/.ssh/streets-empire-deploy"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      # CI has already validated APP_VERSION at RELEASE_VERSION.
      # This step commits/pushes exactly that version, not a newly calculated one.
      # The GitHub Actions token push does not launch another workflow.
      - name: Check out the commit to release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
          fetch-depth: 0

      - name: Push the CI-validated release version
        id: release
        env:
          # An explicitly pinned manual deployment may intentionally roll back a ref.
          ALLOW_HISTORICAL_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha != '' }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$DEPLOY_COMMIT"

          # Accept only the same release GitHub Actions may have pushed already.
          # The content checksum ties that release to the version validated by CI.
          release_already_pushed() {
            local candidate="$1" parent title changed_paths checksum
            [[ -n "${RELEASE_VERSION:-}" ]] || return 1
            parent="$(git rev-parse "$candidate^" 2>/dev/null || true)"
            title="$(git log -1 --format=%s "$candidate")"
            [[ "$parent" == "$DEPLOY_COMMIT" && "$title" == "chore: release $RELEASE_VERSION [skip ci]" ]] || return 1
            # No unvalidated changes may travel with the reused release commit.
            changed_paths="$(git diff-tree --no-commit-id --name-only -r "$candidate")"
            [[ "$changed_paths" == "packages/shared/src/platform.ts" ]] || return 1
            checksum="$(git show "$candidate:packages/shared/src/platform.ts" | sha256sum | cut -d ' ' -f 1)"
            [[ "$checksum" == "$RELEASE_VERSION_CHECKSUM" ]]
          }

          # A newer push has its own CI run. Never fail or deploy stale code
          # just because its branch changed while this run was validating.
          report_superseded() {
            local current="$1"
            if git merge-base --is-ancestor "$DEPLOY_COMMIT" "$current"; then
              echo "::notice::Skipping deployment of $DEPLOY_COMMIT: $DEPLOY_BRANCH advanced to $current."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              echo "Deployment of $DEPLOY_COMMIT was superseded by $current; the newer push's CI handles deployment." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::$DEPLOY_BRANCH diverged from validated commit $DEPLOY_COMMIT. Refusing unsafe deployment."
            exit 1
          }

          git fetch --no-tags origin "refs/heads/$DEPLOY_BRANCH"
          remote_tip="$(git rev-parse FETCH_HEAD)"
          if [[ "$remote_tip" != "$DEPLOY_COMMIT" && "${ALLOW_HISTORICAL_DEPLOY:-false}" != "true" ]]; then
            if release_already_pushed "$remote_tip"; then
              sha="$remote_tip"
              echo "Reusing already-pushed validated release $RELEASE_VERSION ($sha)."
              echo "sha=$sha" >> "$GITHUB_OUTPUT"
              echo "deploy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            report_superseded "$remote_tip"
          fi

          if [[ -n "${RELEASE_VERSION:-}" ]]; then
            node scripts/ops/bump-version.mjs apply --version "$RELEASE_VERSION"
            actual_checksum="$(sha256sum packages/shared/src/platform.ts | cut -d ' ' -f 1)"
            if [[ "$actual_checksum" != "$RELEASE_VERSION_CHECKSUM" ]]; then
              echo "::error::Release contents differ from the version validated by CI."
              exit 1
            fi
            if git diff --quiet -- packages/shared/src/platform.ts; then
              echo "::error::Planned release $RELEASE_VERSION did not change APP_VERSION."
              exit 1
            fi
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -am "chore: release $RELEASE_VERSION [skip ci]"
            if git push origin "HEAD:$DEPLOY_BRANCH"; then
              sha="$(git rev-parse HEAD)"
              echo "Released validated $RELEASE_VERSION ($sha)."
            else
              # A concurrent run may have released this commit or a newer push.
              git fetch --no-tags origin "refs/heads/$DEPLOY_BRANCH"
              remote_tip="$(git rev-parse FETCH_HEAD)"
              if release_already_pushed "$remote_tip"; then
                sha="$remote_tip"
                echo "Reusing already-pushed validated release $RELEASE_VERSION ($sha)."
              elif [[ "$remote_tip" == "$DEPLOY_COMMIT" ]]; then
                echo "::error::Release push failed although $DEPLOY_BRANCH still points to $DEPLOY_COMMIT. Check repository write permissions."
                exit 1
              else
                report_superseded "$remote_tip"
              fi
            fi
          else
            echo "No release bump for $DEPLOY_COMMIT."
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      # The Discord status channel says an update is starting, then edits that post when
      # it finishes or fails (scripts/ops/deploy-status.mjs). Notices only ever warn.
      - name: Announce the update
        if: steps.release.outputs.deploy == 'true'
        continue-on-error: true
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/streets-empire-deploy" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "cd $CHECKOUT_DIR && node scripts/ops/deploy-status.mjs started $RELEASE_SHA"

      - name: Deploy selected commit
        if: steps.release.outputs.deploy == 'true'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          case "$DEPLOY_BRANCH" in
            beta) checkout_dir="/opt/streets-empire/StreetsEmpirev2-beta" ;;
            main) checkout_dir="/opt/streets-empire/StreetsEmpirev2" ;;
            *) echo "::error::Unsupported deploy branch: $DEPLOY_BRANCH"; exit 1 ;;
          esac
          printf -v checkout_arg '%q' "$checkout_dir"
          printf -v branch_arg '%q' "$DEPLOY_BRANCH"
          printf -v commit_arg '%q' "$RELEASE_SHA"
          remote_command="cd $checkout_arg && bash scripts/ops/deploy-ref.sh $branch_arg $commit_arg"
          ssh -i "$HOME/.ssh/streets-empire-deploy" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "$remote_command"

      - name: Announce the update finished
        if: steps.release.outputs.deploy == 'true'
        continue-on-error: true
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/streets-empire-deploy" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "cd $CHECKOUT_DIR && node scripts/ops/deploy-status.mjs finished $RELEASE_SHA"

      - name: Check out history for patch notes
        if: steps.release.outputs.deploy == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0

      # Turns the "## Patch notes" sections of the PRs in this deploy into one news
      # post that waits in Admin → News for review. See docs/AUTO-DEPLOY.md. The
      # deploy already succeeded, so a problem here only warns.
      - name: Hold patch notes for review
        if: steps.release.outputs.deploy == 'true'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          case "$DEPLOY_BRANCH" in
            beta) checkout_dir="/opt/streets-empire/StreetsEmpirev2-beta" ;;
            main) checkout_dir="/opt/streets-empire/StreetsEmpirev2" ;;
            *) echo "::error::Unsupported deploy branch: $DEPLOY_BRANCH"; exit 1 ;;
          esac
          printf -v checkout_arg '%q' "$checkout_dir"
          printf -v commit_arg '%q' "$RELEASE_SHA"
          vps() {
            ssh -i "$HOME/.ssh/streets-empire-deploy" \
              -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
              "$VPS_USER@$VPS_HOST" "$1"
          }
          # The last commit whose notes were handled, kept beside the deploy history.
          marker="$checkout_arg/.deploy/patch-notes-commit"
          remember() { vps "mkdir -p $checkout_arg/.deploy && printf '%s\n' $commit_arg > $marker"; }

          previous="$(vps "cat $marker 2>/dev/null || true" | tr -d '[:space:]')"
          if [[ ! "$previous" =~ ^[0-9a-f]{40}$ ]]; then
            echo "No earlier patch notes on this server; later deploys start from $RELEASE_SHA."
            remember
            exit 0
          fi
          if [[ "$previous" == "$RELEASE_SHA" ]]; then
            echo "Patch notes for $RELEASE_SHA were already handled."
            exit 0
          fi
          if ! git merge-base --is-ancestor "$previous" "$RELEASE_SHA"; then
            # A rollback: keep the marker so redeploying forward never repeats notes.
            echo "$RELEASE_SHA does not follow $previous, so there are no new patch notes."
            exit 0
          fi

          notes="$RUNNER_TEMP/patch-notes.json"
          node scripts/ops/patch-notes.mjs collect --from "$previous" --to "$RELEASE_SHA" \
            --branch "$DEPLOY_BRANCH" --repo "$GITHUB_REPOSITORY" > "$notes"
          if jq -e '. != null' "$notes" > /dev/null; then
            vps "cd $checkout_arg && node scripts/ops/patch-notes.mjs post" < "$notes"
            {
              echo "## Patch notes held for review"
              echo
              echo "Edit, delete or publish them now under **Admin → News**."
              echo
              jq -r '"**\(.title)**\n\n\(.body)"' "$notes"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          remember

      # Runs only when a step above failed: the starting post says the update hit a problem.
      - name: Announce a failed update
        if: failure() && steps.release.outputs.deploy == 'true'
        continue-on-error: true
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha || needs.validate.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/streets-empire-deploy" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "cd $CHECKOUT_DIR && node scripts/ops/deploy-status.mjs failed $RELEASE_SHA"
