name: Public Platform

on:
  push:
    branches:
      - main
      - beta
      - feature/1.2.0-d-roulette-street-dice
  pull_request:
    branches:
      - main
      - beta
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: Environment to deploy
        type: choice
        required: true
        default: beta
        options:
          - beta
          - main
      commit_sha:
        description: Optional commit SHA from the selected branch; blank uses its current tip
        type: string
        required: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      commit_sha: ${{ steps.target_commit.outputs.sha }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: streets
          POSTGRES_PASSWORD: streets
          POSTGRES_DB: streets_empire_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U streets -d streets_empire_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://streets:streets@127.0.0.1:5432/streets_empire_ci?schema=public
      SESSION_SECRET: ci-only-session-secret-change-me-32-characters

    steps:
      - name: Check out the commit to validate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || inputs.deploy_branch || github.sha }}

      - name: Record validated commit
        id: target_commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply CI database migrations
        run: npx prisma migrate deploy

      - name: Seed CI database
        run: npm run db:seed

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Run public release integration
        env:
          RELEASE_INTEGRATION: "1"
        run: npx vitest run apps/server/src/services/__tests__/release.integration.test.ts

      - name: Build API, game, public site and bot
        run: npm run build

  deploy:
    name: Deploy ${{ inputs.deploy_branch || github.ref_name }}
    needs: validate
    if: (github.event_name == 'push' && (github.ref_name == 'beta' || github.ref_name == 'main')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: streets-empire-deploy-${{ inputs.deploy_branch || github.ref_name }}
      cancel-in-progress: false
    environment:
      name: ${{ (inputs.deploy_branch || github.ref_name) == 'main' && 'production' || 'beta' }}
    permissions:
      contents: read
      # Patch notes read the bodies of the pull requests in each deploy.
      pull-requests: read
    env:
      DEPLOY_BRANCH: ${{ inputs.deploy_branch || github.ref_name }}
      DEPLOY_COMMIT: ${{ needs.validate.outputs.commit_sha }}
      CHECKOUT_DIR: ${{ (inputs.deploy_branch || github.ref_name) == 'main' && '/opt/streets-empire/StreetsEmpirev2' || '/opt/streets-empire/StreetsEmpirev2-beta' }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
    steps:
      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_SSH_PRIVATE_KEY VPS_SSH_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required environment secret: $name"
              exit 1
            fi
          done
          if [[ "$DEPLOY_BRANCH" != "beta" && "$DEPLOY_BRANCH" != "main" ]]; then
            echo "::error::Only beta and main can be deployed."
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/streets-empire-deploy"
          chmod 600 "$HOME/.ssh/streets-empire-deploy"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      # The Discord status channel says an update is starting, then edits that post when
      # it finishes or fails (scripts/ops/deploy-status.mjs). Notices only ever warn.
      - name: Announce the update
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/streets-empire-deploy" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "cd $CHECKOUT_DIR && node scripts/ops/deploy-status.mjs started $DEPLOY_COMMIT"

      - name: Deploy selected commit
        shell: bash
        run: |
          set -euo pipefail
          case "$DEPLOY_BRANCH" in
            beta) checkout_dir="/opt/streets-empire/StreetsEmpirev2-beta" ;;
            main) checkout_dir="/opt/streets-empire/StreetsEmpirev2" ;;
            *) echo "::error::Unsupported deploy branch: $DEPLOY_BRANCH"; exit 1 ;;
          esac
          printf -v checkout_arg '%q' "$checkout_dir"
          printf -v branch_arg '%q' "$DEPLOY_BRANCH"
          printf -v commit_arg '%q' "$DEPLOY_COMMIT"
          remote_command="cd $checkout_arg && bash scripts/ops/deploy-ref.sh $branch_arg $commit_arg"
          ssh -i "$HOME/.ssh/streets-empire-deploy" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "$remote_command"

      - name: Announce the update finished
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/streets-empire-deploy" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "cd $CHECKOUT_DIR && node scripts/ops/deploy-status.mjs finished $DEPLOY_COMMIT"

      - name: Check out history for patch notes
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
          fetch-depth: 0

      # Turns the "## Patch notes" sections of the PRs in this deploy into one news
      # post that waits in Admin → News for review. See docs/AUTO-DEPLOY.md. The
      # deploy already succeeded, so a problem here only warns.
      - name: Hold patch notes for review
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$DEPLOY_BRANCH" in
            beta) checkout_dir="/opt/streets-empire/StreetsEmpirev2-beta" ;;
            main) checkout_dir="/opt/streets-empire/StreetsEmpirev2" ;;
            *) echo "::error::Unsupported deploy branch: $DEPLOY_BRANCH"; exit 1 ;;
          esac
          printf -v checkout_arg '%q' "$checkout_dir"
          printf -v commit_arg '%q' "$DEPLOY_COMMIT"
          vps() {
            ssh -i "$HOME/.ssh/streets-empire-deploy" \
              -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
              "$VPS_USER@$VPS_HOST" "$1"
          }
          # The last commit whose notes were handled, kept beside the deploy history.
          marker="$checkout_arg/.deploy/patch-notes-commit"
          remember() { vps "mkdir -p $checkout_arg/.deploy && printf '%s\n' $commit_arg > $marker"; }

          previous="$(vps "cat $marker 2>/dev/null || true" | tr -d '[:space:]')"
          if [[ ! "$previous" =~ ^[0-9a-f]{40}$ ]]; then
            echo "No earlier patch notes on this server; later deploys start from $DEPLOY_COMMIT."
            remember
            exit 0
          fi
          if [[ "$previous" == "$DEPLOY_COMMIT" ]]; then
            echo "Patch notes for $DEPLOY_COMMIT were already handled."
            exit 0
          fi
          if ! git merge-base --is-ancestor "$previous" "$DEPLOY_COMMIT"; then
            # A rollback: keep the marker so redeploying forward never repeats notes.
            echo "$DEPLOY_COMMIT does not follow $previous, so there are no new patch notes."
            exit 0
          fi

          notes="$RUNNER_TEMP/patch-notes.json"
          node scripts/ops/patch-notes.mjs collect --from "$previous" --to "$DEPLOY_COMMIT" \
            --branch "$DEPLOY_BRANCH" --repo "$GITHUB_REPOSITORY" > "$notes"
          if jq -e '. != null' "$notes" > /dev/null; then
            vps "cd $checkout_arg && node scripts/ops/patch-notes.mjs post" < "$notes"
            {
              echo "## Patch notes held for review"
              echo
              echo "Edit, delete or publish them now under **Admin → News**."
              echo
              jq -r '.body' "$notes"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          remember

      # Runs only when a step above failed: the starting post says the update hit a problem.
      - name: Announce a failed update
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/streets-empire-deploy" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "cd $CHECKOUT_DIR && node scripts/ops/deploy-status.mjs failed $DEPLOY_COMMIT"
